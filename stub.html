  (function () {

    function cycle(event) {

// Stamp and half pass the dominant color of their own print, or null until
// that sample is ready.
const PLANE_CORNER = 0x56ae08;
const PLANE_ROUGH = 0.55;
const PLANE_WAIT = 0xc8c8c8;
// Cinnamon stem on the corner apple only. The body stays PLANE_CORNER.
const STEM_BROWN = 0x8b5a2b;

function markAppleStem(root) {
  root.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    // apple_whole_01.glb: APPLE_green_Bitten.002 is two primitives. The
    // 49-vertex twig uses green_apple_2_texture; the body is Material.002.
    // The leaf is a different node and is not part of this apple.
    if (mats.some((material) => material && /green_apple_2_texture/i.test(material.name || ''))) {
      node.userData.appleStem = true;
    }
  });
}

function paintAppleStem(root) {
  root.traverse((node) => {
    if (!node.isMesh || !node.userData.appleStem || !node.material) return;
    const prev = Array.isArray(node.material) ? node.material : [node.material];
    const next = prev.map((material) => {
      if (!material) return material;
      const stem = material.clone();
      stem.name = 'stem';
      stem.color.setHex(STEM_BROWN);
      if (stem.emissive) {
        stem.emissive.setHex(0x000000);
        stem.emissiveIntensity = 0;
      }
      stem.userData.stem = true;
      stem.userData.plane = false;
      return stem;
    });
    node.material = Array.isArray(node.material) ? next : next[0];
    for (const old of prev) {
      if (old && !next.includes(old)) old.dispose();
    }
  });
}

function applyPlane(root, colorHex) {
  if (!root) return;
  const hex = typeof colorHex === 'number' ? colorHex : PLANE_WAIT;
  const color = new THREE.Color(hex);
  root.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    const prev = Array.isArray(node.material) ? node.material : [node.material];
    if (prev.length && prev.every((material) => material && material.userData.plane)) {
      for (const material of prev) {
        if (material && material.color) material.color.copy(color);
      }
      return;
    }
    let side = THREE.FrontSide;
    for (const material of prev) {
      if (material && material.side === THREE.DoubleSide) side = THREE.DoubleSide;
    }
    const material = new THREE.MeshStandardMaterial({
      name: 'plane',
      color,
      metalness: 0,
      roughness: PLANE_ROUGH,
      emissive: 0x000000,
      emissiveIntensity: 0,
      envMapIntensity: 0,
      side,
      flatShading: false,
    });
    material.map = null;
    material.envMap = null;
    material.normalMap = null;
    material.roughnessMap = null;
    material.metalnessMap = null;
    material.aoMap = null;
    material.emissiveMap = null;
    material.lightMap = null;
    material.vertexColors = false;
    material.userData.plane = true;
    node.material = material;
    for (const old of prev) {
      if (old && old !== material) old.dispose();
    }
  });
}

function softBlobTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.03, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(42,42,42,0.42)');
  grd.addColorStop(0.3, 'rgba(55,55,55,0.18)');
  grd.addColorStop(0.62, 'rgba(70,70,70,0.05)');
  grd.addColorStop(1, 'rgba(70,70,70,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function markFileMaterials(root) {
  root.traverse((node) => {
    if (!node.isMesh || !node.material) return;

    for (const material of mats) {

function paintTeaserStamp(model) {
  model.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      const look = STAMP_TEASER[m.name] || STAMP_TEASER[o.name];
      if (look) {
        m.color.setHex(look.color);
        m.roughness = look.roughness;
        m.metalness = 0;
      }
      m.envMapIntensity = (o.name === 'Pad' || m.name === 'Pad') ? 0.08 : 0.2;
      m.needsUpdate = true;
      rememberTeaserMaterial(m);
    }
  });
}

function prepareStamp(model) {
  const look = currentModelTab().look;
  if (look === 'shader01') applyShader01(model);
  else if (look === 'file') markFileMaterials(model);
  else if (look === 'matte') {
    applyMatte(model);
    applyShadeSmooth(model, true);
  } else if (look === 'plane') {
    applyPlane(model, planePoolHex('stamp'));
    applyShadeSmooth(model, true);
  } else {
    paintTeaserStamp(model);
    commitShadeSmooth(model, false);
  }
  model.rotation.order = 'YXZ';
  return model;
}

const APPLE_RED = 0xe23b32;
const APPLE_GREEN = 0x67c514;

function cloneMaterials(root) {
  root.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
  });
}

function fitTopDown(model) {
  const pivot = new THREE.Group();
  pivot.add(model);
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  pivot.scale.setScalar(1 / diam);
  pivot.position.copy(center).multiplyScalar(-1 / diam);
  return pivot;
}

// apple_whole_01.glb is the whole Blender scene. The corner apple is the
// updated APPLE_green_Bitten.002. Fit that mesh alone, before
// DETAIL_APPLE_TURN and TAB01_APPLE_OFFSET, so it matches the folder3 size.
function cloneTab01Apple(scene) {
  // GLTFLoader drops '.' from node names, so APPLE_green_Bitten.002
  // arrives as APPLE_green_Bitten002.
  const raw = 'APPLE_green_Bitten.002';
  const sanitized = raw.replace(/\s/g, '_').replace(/[\[\].:/]/g, '');
  let found = null;
  scene.traverse((node) => {
    if (found) return;
    if (node.name === raw || node.name === sanitized) found = node;
  });
  if (!found) return scene.clone(true);
  const root = new THREE.Group();
  root.name = sanitized;
  root.add(found.clone(true));
  return root;
}

function prepareApple(gltf) {
  const tab = currentModelTab();
  // Isolate APPLE_green_Bitten002 by file, on tab 01 and on plane.
  const model = tab.apple === TAB01_APPLE_FILE
    ? cloneTab01Apple(gltf.scene)
    : gltf.scene.clone(true);
  cloneMaterials(model);
  const look = currentModelTab().look;
  if (look === 'shader01') {
    applyShader01(model);
    return fitTopDown(model);
  }
  if (look === 'file') {
    markFileMaterials(model);
    return fitTopDown(model);
  }
  if (look === 'matte') {
    applyMatte(model);
    applyShadeSmooth(model, true);
    return fitTopDown(model);
  }
  if (look === 'plane') {
    markAppleStem(model);
    applyPlane(model, PLANE_CORNER);
    paintAppleStem(model);
    applyShadeSmooth(model, true);
    return fitTopDown(model);
  }
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (m.name === 'PaleGreen' || m.name === 'green') {
        m.color.setHex(APPLE_GREEN);
        m.emissive.setHex(APPLE_GREEN);
        m.emissiveIntensity = 0.04;
      } else if (m.name === 'DarkBrown') {
        m.color.setHex(0x634336);
      } else if (m.name === 'DarkGreen') {
        m.color.setHex(0x2b3e29);
      }
      m.roughness = 0.42;
      m.metalness = 0;
      m.needsUpdate = true;
      rememberTeaserMaterial(m);
    }
  });
  applyShadeSmooth(model, true);
  return fitTopDown(model);
}

function prepareHalfApple(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  const look = currentModelTab().look;
  if (look === 'shader01') {
    applyShader01(model);
    tintTab01Half(model);
    return withHalfTurn(fitTopDown(model));
  }
  if (look === 'file') {
    markFileMaterials(model);
    return withHalfTurn(fitTopDown(model));
  }
  if (look === 'plane') {
    applyPlane(model, planePoolHex('apple'));
    applyShadeSmooth(model, true);
    return withHalfTurn(fitTopDown(model));
  }
  model.traverse((o) => {
    if (o.isMesh && o.geometry) o.geometry = o.geometry.clone();
  });
  if (look === 'matte') {
    orientHalfCut(model);
    applyMatte(model);
    commitShadeSmooth(model, true);
    return withHalfTurn(fitTopDown(model));
  }
  paintApple(model);
  orientHalfCut(model);
  commitShadeSmooth(model, true);
  return withHalfTurn(fitTopDown(model));
}

function orientHalfCut(model) {
  const body = meshByMaterial(model, 'green');
  const stem = meshByMaterial(model, 'brown');
  const flesh = meshByMaterial(model, 'brownLight');
  const leaf = meshByMaterial(model, 'DarkGreen');
  if (flesh && stem && body) {
    const cutN = worldNormal(flesh);
    const stemDir = centerOf(stem).sub(centerOf(body));
    if (cutN.lengthSq() > 1e-8 && stemDir.lengthSq() > 1e-8) {
      const qCut = new THREE.Quaternion().setFromUnitVectors(cutN, new THREE.Vector3(0, 1, 0));
      const stemFlat = stemDir.normalize().applyQuaternion(qCut);
      stemFlat.y = 0;
      if (stemFlat.lengthSq() > 1e-8) {
        const qStem = new THREE.Quaternion().setFromUnitVectors(stemFlat.normalize(), new THREE.Vector3(0, 0, 1));
        model.quaternion.copy(qStem.multiply(qCut));
      } else {
        model.quaternion.copy(qCut);
      }
    }
  }
  model.updateMatrixWorld(true);
  if (leaf && body) faceLeafToCamera(leaf, centerOf(body));
}

function planeSources(kind) {
  const srcs = [];
  const seen = new Set();
  const add = (src) => {
    if (!src || seen.has(src)) return;
    seen.add(src);
    srcs.push(src);
  };
  const store = window.VanokSignatures;
  if (store && typeof store.pool === 'function') {
    const pooled = store.pool(kind) || [];
    for (let i = 0; i < pooled.length; i++) add(pooled[i] && pooled[i].src);
  }
  const theme3 = (document.documentElement.dataset.theme || '0') === '3';
  const lists = kind === 'apple'
    ? (theme3 ? [KEY2_APPLE_IMPRINTS, APPLE_IMPRINTS] : [APPLE_IMPRINTS, KEY2_APPLE_IMPRINTS])
    : (theme3 ? [KEY2_STAMP_IMPRINTS, STAMP_IMPRINTS] : [STAMP_IMPRINTS, KEY2_STAMP_IMPRINTS]);
  for (let i = 0; i < lists.length; i++) {
    const list = lists[i] || [];
    for (let j = 0; j < list.length; j++) add(list[j] && list[j].src);
  }
  return srcs;
}

function queuePlanePrints() {
  const srcs = planeSources('stamp').concat(planeSources('apple'));
  for (let i = 0; i < srcs.length; i++) queueChromeSample(srcs[i]);
}

function planePoolHex(kind) {
  const srcs = planeSources(kind);
  for (let i = 0; i < srcs.length; i++) {
    const hex = chromePrintHex.get(srcs[i]);
    if (typeof hex === 'number') return hex;
  }
  if (srcs[0]) queueChromeSample(srcs[0]);
  return null;
}

function decodeIntroImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    const finish = () => resolve();
    img.onload = () => {
      if (typeof img.decode === 'function') img.decode().then(finish, finish);
      else finish();
    };
    img.onerror = finish;
    img.src = src;
  });
}

  const INK_DRY_MS = 760;

  function inkDryEase(t) {
    return 1 - (1 - t) ** 2.15;
  }

  function paintInkAt(dry, e) {
    const src = dry.src;
    const order = dry.order;
    const cw = dry.cw;
    const ch = dry.ch;
    const out = dry.out;
    const n = cw * ch;
    for (let i = 0; i < n; i++) {
      const when = order[i];
      const p = i * 4;
      let u = when > 2 ? 0 : (e - when) / 0.18 + 0.34;
      if (u <= 0) {
        out[p] = out[p + 1] = out[p + 2] = out[p + 3] = 0;
        continue;
      }
      if (u > 1) u = 1;
      else u = u * u * (3 - 2 * u);
      out[p] = src[p];
      out[p + 1] = src[p + 1];
      out[p + 2] = src[p + 2];
      out[p + 3] = Math.round(src[p + 3] * u);
    }
    dry.bctx.putImageData(dry.frameData, 0, 0);
    dry.vctx.clearRect(0, 0, cw, ch);
    const blur = (1 - e) * 0.45 * (cw / Math.max(dry.cssW, 1));
    dry.vctx.filter = blur > 0.25 ? `blur(${blur.toFixed(2)}px)` : 'none';
    dry.vctx.drawImage(dry.buffer, 0, 0);
    dry.vctx.filter = 'none';
  }

  // Exit rewinds the appear pass: ink-dry-settle (scale 1.028 → 1, 760ms,
  // cubic-bezier(0.16, 0.64, 0.2, 1)) and the same ink ease 1-(1-t)**2.15.
  function releaseMark(mark) {
    if (!mark || !mark.el || mark.leaving) return;
    mark.leaving = true;
    const el = mark.el;
    const finish = () => {
      if (el.isConnected) el.remove();
    };
    const dry = mark.inkDry;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !dry || !dry.src || !dry.view) {
      finish();
      return;
    }
    dry.stopForward = true;
    const fromT = dry.done ? 1 : Math.max(0, Math.min(1, dry.t || 0));
    if (fromT <= 0.001) {
      finish();
      return;
    }
    const photo = el.querySelector('img.ink');
    if (photo) photo.style.visibility = 'hidden';
    if (mark.dye) mark.dye.style.visibility = 'hidden';
    dry.view.style.animation = 'none';
    if (!dry.view.isConnected) el.insertBefore(dry.view, el.firstChild);
    el.classList.add('is-leaving');
    const scale = dry.view.animate(
      [{ transform: 'scale(1.028)' }, { transform: 'none' }],
      { duration: INK_DRY_MS, easing: INK_DRY_EASE, fill: 'both', direction: 'reverse' }
    );
    if (fromT < 0.999) scale.currentTime = (1 - fromT) * INK_DRY_MS;
    const started = performance.now();
    const span = fromT * INK_DRY_MS;
    const paint = (now) => {
      if (!el.isConnected) return;
      const u = Math.min(1, (now - started) / span);
      paintInkAt(dry, inkDryEase(tFrom(u)));
      if (u < 1) requestAnimationFrame(paint);
      else finish();
    };
    function tFrom(u) {
      return fromT * (1 - u);
    }
    paint(started);
  }

  // After the hit, thick ink is already there. Thin edges and pale fringes
  // finish a moment later, and a little blur dries off. Patches around the
  // seal complete at different times, so the print looks drawn in, not faded.
  function dryMark(mark) {
    if (!mark || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const photo = mark.el.querySelector('img.ink');
    if (!photo) return;
    photo.style.visibility = 'hidden';
    mark.dye.style.visibility = 'hidden';
    const reveal = () => {
      if (!mark.el.isConnected) return;
      const wet = mark.el.querySelector('.ink-dry');
      if (wet) wet.remove();
      photo.style.visibility = '';
      mark.dye.style.visibility = '';
    };
    const run = () => {
      if (!mark.el.isConnected || !photo.naturalWidth) {
        reveal();
        return;
      }
      const cssW = mark.el.offsetWidth || 220;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      let cw = Math.max(1, Math.round(cssW * dpr));
      let ch = Math.max(1, Math.round(cw * (photo.naturalHeight / photo.naturalWidth)));
      const cap = 420;
      const longest = Math.max(cw, ch);
      if (longest > cap) {
        const fit = cap / longest;
        cw = Math.max(1, Math.round(cw * fit));
        ch = Math.max(1, Math.round(ch * fit));
      }
      const buffer = document.createElement('canvas');
      buffer.width = cw;
      buffer.height = ch;
      const bctx = buffer.getContext('2d');
      try {
        bctx.drawImage(photo, 0, 0, cw, ch);
        bctx.getImageData(0, 0, 1, 1);
      } catch (err) {
        reveal();
        return;
      }
      const rig = mark.kind === 'apple' ? appleRig : stampRig;
      const themed = themeHex(mark.castHex);
      const tintAlpha = themed != null ? 1 : rig.tintAmount;
      if (tintAlpha > 0.01) {
        bctx.save();
        bctx.globalCompositeOperation = 'source-atop';
        bctx.globalAlpha = tintAlpha;
        bctx.fillStyle = themed != null
          ? '#' + themed.toString(16).padStart(6, '0')
          : rig.tint;
        bctx.fillRect(0, 0, cw, ch);
        bctx.restore();
      }
      const src = bctx.getImageData(0, 0, cw, ch).data;
      const n = cw * ch;
      const dist = new Float32Array(n);
      const far = 1e6;
      for (let i = 0; i < n; i++) {
        if (src[i * 4 + 3] < 12) {
          dist[i] = 0;
          continue;
        }
        let d = far;
        if (i % cw) d = Math.min(d, dist[i - 1] + 1);
        if (i >= cw) d = Math.min(d, dist[i - cw] + 1);
        dist[i] = d;
      }
      for (let i = n - 1; i >= 0; i--) {
        if (!dist[i]) continue;
        let d = dist[i];
        if (i % cw !== cw - 1) d = Math.min(d, dist[i + 1] + 1);
        if (i + cw < n) d = Math.min(d, dist[i + cw] + 1);
        dist[i] = d;
      }
      const order = new Float32Array(n);
      const seed = Math.random() * Math.PI * 2;
      for (let y = 0; y < ch; y++) {
        const ny = y / ch;
        for (let x = 0; x < cw; x++) {
          const i = y * cw + x;
          if (src[i * 4 + 3] < 12) {
            order[i] = 9;
            continue;
          }
          const nx = x / cw;
          const blot = Math.sin(nx * 9.2 + seed) * Math.sin(ny * 7.6 + seed * 1.4);
          const patch = blot * 0.5 + 0.5;
          const rings = dist[i];
          // 1px rim and hairlines finish last. The middle of a thick stroke is already down.
          const late = rings <= 1 ? 0.8 : rings === 2 ? 0.46 : 0.04;
          order[i] = late + patch * 0.05;
        }
      }
      const view = document.createElement('canvas');
      view.className = 'ink-dry';
      view.width = cw;

  }

  const trail = { on: false, id: -1, x: 0, y: 0, lastX: 0, lastY: 0, lastAt: 0, placed: 0 };

  function dropAt(x, y) {
    const hr = host.getBoundingClientRect();
    const before = marks.length;
    const tail = marks[marks.length - 1] || null;
    start({ px: x - hr.left, py: y - hr.top });
    return marks.length > before || marks[marks.length - 1] !== tail;
  }

  function dropStamp(e) {
    const p = eventPoint(e);
    dropAt(p.x, p.y);
  }

  function onTrailDown(e) {
    if (!alive || (e.button && e.button !== 0)) return;
    if (e.pointerType === 'touch' && e.isPrimary === false) return;
    const p = eventPoint(e);
    if (pointBlocked(p.x, p.y, e)) {
      trail.on = false;
      return;
    }
    trail.on = true;
    trail.id = e.pointerId == null ? -1 : e.pointerId;
    trail.x = trail.lastX = p.x;
    trail.y = trail.lastY = p.y;
    trail.lastAt = performance.now();
    trail.placed = 0;
    armStampPress(e);
  }

  function onTrailMove(e) {
    if (!trail.on) return;
    if (e.pointerId != null && trail.id !== -1 && e.pointerId !== trail.id) return;
    if (e.cancelable) e.preventDefault();
    clearPageSelection();
    if (e.pointerType === 'mouse' && (e.buttons & 1) === 0) return;
    const p = eventPoint(e);
    if (pointBlocked(p.x, p.y, e)) return;
    const now = performance.now();
    if (!trail.placed) {
      if (Math.hypot(p.x - trail.x, p.y - trail.y) < TRAIL_START) return;
      if (dropAt(trail.x, trail.y)) {
        trail.lastX = trail.x;
        trail.lastY = trail.y;
        trail.lastAt = now;
        trail.placed = 1;
      }
      return;
    }
    const dist = Math.hypot(p.x - trail.lastX, p.y - trail.lastY);
    if (dist < imprintSpan() || now - trail.lastAt < TRAIL_INTERVAL) return;
    if (dropAt(p.x, p.y)) {
      trail.lastX = p.x;
      trail.lastY = p.y;
      trail.lastAt = now;
      trail.placed += 1;
    }
  }

  let introGesture = false;
  function noteIntroGesture() {
    introGesture = !(performance.now() >= (window.__vanokStampsAt || Infinity));
  }
  addEventListener('pointerdown', noteIntroGesture, true);
  addEventListener('touchstart', noteIntroGesture, true);

  function onPointerUp(e) {
    const mine = trail.on && (e.pointerId == null || trail.id === -1 || e.pointerId === trail.id);
    const placed = mine ? trail.placed : 0;
    const lastX = trail.lastX;
    const lastY = trail.lastY;
    const lastAt = trail.lastAt;
    if (mine) trail.on = false;
    if (mine || document.documentElement.classList.contains('stamp-press')) endStampPress();
    if (introGesture || !(performance.now() >= (window.__vanokStampsAt || Infinity))) {
      introGesture = true;
      return;
    }
    const p = eventPoint(e);
    if (pointBlocked(p.x, p.y, e) || stampBlocked(e)) return;
    stampGesture = Date.now();
    if (placed > 0) {
      const dist = Math.hypot(p.x - lastX, p.y - lastY);
      if (dist >= imprintSpan() && performance.now() - lastAt >= TRAIL_INTERVAL) dropAt(p.x, p.y);
      return;
    }
    dropStamp(e);
  }

  function onClick(e) {
    if (introGesture || !(performance.now() >= (window.__vanokStampsAt || Infinity))) {
      introGesture = false;
      return;
    }
    if (Date.now() - stampGesture < 700) return;
    if (stampBlocked(e)) return;
    dropStamp(e);
  }

  function stampEditTarget(node) {
    const el = node && node.nodeType === 1 ? node : node && node.parentElement;
    return !!(el && el.closest && el.closest('input, textarea, [contenteditable="true"], .sig-input, .sig-modal'));
  }

  function clearPageSelection() {
    const sel = window.getSelection && window.getSelection();
    if (!sel || !sel.rangeCount) return;
    if (stampEditTarget(sel.anchorNode) || stampEditTarget(document.activeElement)) return;
    sel.removeAllRanges();
  }

  function lockPageImages() {
    const nodes = document.querySelectorAll('img, canvas');
    for (let i = 0; i < nodes.length; i++) nodes[i].draggable = false;
  }

  function armStampPress(e) {
    document.documentElement.classList.add('stamp-press');
    lockPageImages();
    if (e && e.cancelable) e.preventDefault();
    clearPageSelection();
  }

  function endStampPress() {
    document.documentElement.classList.remove('stamp-press');
    clearPageSelection();
  }

  // Safari does not fire selectstart, and cancelling pointerdown does not
  // stop the compatibility mousedown/mousemove that paints the highlight.
  function onStampMouseDown(e) {
    if (!alive || (e.button != null && e.button !== 0)) return;
    if (stampEditTarget(e.target) || stampBlocked(e)) return;
    const p = eventPoint(e);
    if (!appleUnder(e) && pointBlocked(p.x, p.y, e)) return;
    armStampPress(e);
  }

  function onStampMouseMove(e) {
    if (!trail.on && !document.documentElement.classList.contains('stamp-press')) return;
    if ((e.buttons & 1) === 0) return;
    if (stampEditTarget(e.target)) return;
    if (e.cancelable) e.preventDefault();
    clearPageSelection();
  }

  function onStampMouseUp(e) {
    if (stampEditTarget(e.target) || stampEditTarget(document.activeElement)) {
      document.documentElement.classList.remove('stamp-press');
      return;
    }
    endStampPress();
  }

  function onStampSelectionChange() {
    clearPageSelection();
  }

  function onStampNativeDrag(e) {
    if (stampEditTarget(e.target)) return;
    if (e.type === 'dragstart') {
      const el = e.target;
      const image = el && el.closest && el.closest('img, canvas, svg, .sign-imprint, .apple-view, .wordmark, .lettering, .vanok, .regular');
      if (!image && !trail.on && !document.documentElement.classList.contains('stamp-press')) return;
    }
    e.preventDefault();
    clearPageSelection();
  }

  if (window.PointerEvent) {
    addEventListener('pointerdown', onTrailDown, { capture: true, passive: false });
    addEventListener('pointermove', onTrailMove, { capture: true, passive: false });
    addEventListener('pointerup', onPointerUp, true);
    addEventListener('pointercancel', onPointerUp, true);
  } else {
    addEventListener('touchstart', onTrailDown, true);
    addEventListener('touchmove', onTrailMove, true);
    addEventListener('touchend', onPointerUp, true);
    addEventListener('touchcancel', onPointerUp, true);
  }
  addEventListener('click', onClick, true);
  addEventListener('mousedown', onStampMouseDown, { capture: true, passive: false });
  addEventListener('mousemove', onStampMouseMove, { capture: true, passive: false });
  addEventListener('mouseup', onStampMouseUp, true);
  document.addEventListener('selectionchange', onStampSelectionChange);
  addEventListener('selectstart', onStampNativeDrag, true);
  addEventListener('dragstart', onStampNativeDrag, true);
  lockPageImages();

  function isTyping(el) {
    while (el && el !== document.body) {
      if (el.isContentEditable) return true;
      const tag = el.tagName;
      if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (tag === 'INPUT') {
        const type = (el.type || 'text').toLowerCase();
        return type !== 'range' && type !== 'checkbox' && type !== 'radio' && type !== 'button';
      }
      el = el.parentElement;
    }
    return false;
  }

  function clearPlacedStamps() {
    while (marks.length) releaseMark(marks.pop());
    while (flights.length) releaseFlight(flights.pop());
    queued.length = 0;
  }

  function isStampEraseKey(e) {
    if (e.code === 'KeyD') return true;
    if (e.code) return false;
    const key = e.key;
    return key === 'd' || key === 'D' || key === 'в' || key === 'В';
  }

  function onKey(e) {
    if (e.repeat) return;
    if (e.code === 'Escape' && !panel.hidden && !isTyping(e.target)) {
      panel.hidden = true;
      return;
    }
    if (isStampEraseKey(e)) {
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      if (isTyping(e.target) || isTyping(document.activeElement)) return;
      e.preventDefault();
      clearPlacedStamps();
      return;
    }
    if (e.code !== 'KeyG' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(e.target) || isTyping(document.activeElement)) return;
    e.preventDefault();
    panel.hidden = !panel.hidden;
  }
  addEventListener('keydown', onKey);
  close.addEventListener('click', () => { panel.hidden = true; });

  function frame() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    placeStage();
    trimStampsToCap();
    paintMarks();
  }
  const ro = new ResizeObserver(frame);
  ro.observe(host);
  frame();

  function toolXformNode(root) {
    if (!root) return null;
    let node = null;
    for (let i = 0; i < root.children.length; i++) {
      if (root.children[i].name === 'tool-xform') {
        node = root.children[i];
        break;
      }
    }
    if (!node) {
      node = new THREE.Group();
      node.name = 'tool-xform';
      root.add(node);
    }
    const extras = [];
    for (let i = 0; i < root.children.length; i++) {
      if (root.children[i] !== node) extras.push(root.children[i]);
    }
    for (let i = 0; i < extras.length; i++) node.add(extras[i]);
    return node;
  }

  function applyToolXform(root, kind) {
    const pose = toolXform[kind];
    const node = toolXformNode(root);
    if (!node || !pose) return;
    const d = Math.PI / 180;
    node.rotation.order = 'XYZ';
    node.rotation.set(pose.x * d, pose.y * d, pose.z * d);
    node.scale.set(pose.scale, pose.scale, pose.scale);
  }

  function syncToolXforms() {
    applyToolXform(appleModel, 'apple');
    applyToolXform(stampModel, 'stamp');
    for (let i = 0; i < flights.length; i++) {
      applyToolXform(flights[i].model, flights[i].shot.kind);
    }
  }

  function mountTool(kind, fitted) {
    const group = new THREE.Group();
    const spin = new THREE.Group();
    spin.name = 'tool-xform';
    spin.add(fitted);
    group.add(spin);
    applyToolXform(group, kind);
    group.scale.setScalar(SIZE);
    group.visible = false;
    scene.add(group);
    if (kind === 'stamp') stampModel = group;
    else appleModel = group;
    drainQueue();
  }

  function copyToolMaterial(material) {
    const next = material.clone();
    if (material.userData.shader01) {
      next.userData.shader01 = true;
      next.userData.bareMatcap = true;
    }
    if (material.userData.keepTexture) next.userData.keepTexture = true;
    if (material.userData.matte) next.userData.matte = true;
    if (material.userData.pearl) next.userData.pearl = true;
    if (material.userData.chrome) next.userData.chrome = true;
    if (material.userData.plane) next.userData.plane = true;
    if (material.userData.teaserMat) next.userData.teaserMat = material.userData.teaserMat;
    return next;
  }

  function cloneFittedMaterials(fitted) {
    const clone = fitted.clone(true);
    clone.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      node.material = Array.isArray(node.material)
        ? node.material.map(copyToolMaterial)
        : copyToolMaterial(node.material);
    });
    return clone;
  }

  function disposeFitted(root) {
    root.traverse((node) => {
      if (!node.isMesh) return;
      const smooth = node.userData.smoothGeometry;
      const flat = node.userData.flatGeometry;
      if (smooth && smooth !== flat) smooth.dispose();
      if (!node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) if (material) material.dispose();
    });
  }

  function installToolMesh(group, kind, fitted, uniqueMaterials) {
    const node = toolXformNode(group);
    const next = uniqueMaterials ? cloneFittedMaterials(fitted) : fitted;
    const prev = node.children.slice();
    for (let i = 0; i < prev.length; i++) node.remove(prev[i]);
    node.add(next);
    for (let i = 0; i < prev.length; i++) disposeFitted(prev[i]);
    applyToolXform(group, kind);
  }

  let toolGeneration = 0;
  function syncToolModels() {
    const generation = ++toolGeneration;
    const tab = currentModelTab();
    const tabId = tab.id;
    Promise.all([loadGltf(tab.stamp), loadGltf(tab.half)]).then(([stampGltf, halfGltf]) => {
      if (!alive || generation !== toolGeneration || currentModelTab().id !== tabId) return;
      globalThis.__vanokToolFiles = { tab: tabId, look: tab.look, stamp: tab.stamp, half: tab.half };
      if (tab.look === 'plane') queuePlanePrints();
      if (stampGltf) {
        const sceneClone = stampGltf.scene.clone(true);
        cloneMaterials(sceneClone);
        const fitted = fitTopDown(prepareStamp(sceneClone));
        if (!stampModel) mountTool('stamp', fitted);
        else {
          installToolMesh(stampModel, 'stamp', fitted, false);
          for (const flight of flights) {
            if (flight.shot.kind !== 'stamp') continue;
            installToolMesh(flight.model, 'stamp', fitted, true);
            if (flight.shot.bodyHex != null) paintTool(flight.model, 'stamp', flight.shot.bodyHex);
            if (tab.look === 'plane') {
              const hex = planeHexForShot(flight.shot);
              if (hex != null) tintPlane(flight.model, hex);
            }
          }
        }
      }
      if (halfGltf) {
        const fitted = prepareHalfApple(halfGltf);
        if (!appleModel) mountTool('apple', fitted);
        else {
          installToolMesh(appleModel, 'apple', fitted, false);
          for (const flight of flights) {
            if (flight.shot.kind !== 'apple') continue;
            installToolMesh(flight.model, 'apple', fitted, true);
            if (flight.shot.bodyHex != null) paintTool(flight.model, 'apple', flight.shot.bodyHex);
            if (tab.look === 'plane') {
              const hex = planeHexForShot(flight.shot);
              if (hex != null) tintPlane(flight.model, hex);
            }
          }
        }
      }
      if (pearlOn) {
        applyPearl(stampModel);
        applyPearl(appleModel);
        for (let i = 0; i < flights.length; i++) applyPearl(flights[i].model);
      } else if (chromeOn) {
        applyChrome(appleModel, CHROME_APPLE);
        applyChrome(stampModel, CHROME_WAIT);
        for (let i = 0; i < flights.length; i++) {
          const hex = chromeHexForShot(flights[i].shot);
          applyChrome(flights[i].model, hex == null ? CHROME_WAIT : hex);
        }
      }
    });
  }
  syncToolModels();

  // Themes 0–2: stamp and half share fill 0.72 and key 1.7 on every L tab
  // except mat and plane. Theme 3 copies the corner apple's live fill and key
  // onto both tools, every L tab, with no stamp/half slider pair and no 1/3 scale.
  // Mat without theme 3 still drives stamp and half from their own sliders.
  // Plane without theme 3 uses the corner apple's live light: VIEW_APPLE.ambient
  // and VIEW_APPLE.intensity (0.72 and 4.45), the same pair syncAppleFlightLight
  // applies when the apple is not on the theme-3 or mat sliders. Full intensity,
  // not STAMP_KEY 1.7 and not a 1/3 low-poly scale.
  function renderTools() {
    const stamps = [];
    const halves = [];
    const tabId = currentModelTab().id;
    const matTab = tabId === 'mat';
    const planeTab = tabId === 'plane';
    const restore = () => {
      fill.intensity = STAMP_AMBIENT;
      key.intensity = STAMP_KEY;
      renderer.autoClear = true;
    };
    if (!isIceTheme() && !matTab) {
      let ambient = STAMP_AMBIENT;
      let keyLevel = STAMP_KEY;
      if (planeTab) {
        const mode = VIEW_APPLE.lightOn === false
          ? 'off'
          : (VIEW_APPLE.lightMode === 'map' ? 'map' : 'source');
        ambient = mode === 'off' ? 0 : VIEW_APPLE.ambient;
        keyLevel = mode === 'source' ? VIEW_APPLE.intensity : 0;
      }
      fill.intensity = ambient;
      key.intensity = keyLevel;
      renderer.autoClear = true;
      renderer.render(scene, camera);
      icePass = {
        style2: false,
        drewStamp: false,
        drewHalf: false,
        stampAmbient: ambient,
        stampKey: keyLevel,
        halfAmbient: ambient,
        halfKey: keyLevel,
      };
      return;
    }
    const appleFill = iceLight.appleAmbient;
    const appleKey = iceLight.appleKey;
    const stampAmbient = isIceTheme() ? appleFill : iceLight.stampAmbient;
    const stampKey = isIceTheme() ? appleKey : iceLight.stampKey;
    const halfAmbient = isIceTheme() ? appleFill : iceLight.halfAmbient;
    const halfKey = isIceTheme() ? appleKey : iceLight.halfKey;
    for (const flight of flights) {
      if (!flight.model.visible) continue;
      if (flight.shot.kind === 'stamp') stamps.push(flight);
      else if (flight.shot.kind === 'apple') halves.push(flight);
    }
    const shadowWas = flights.map((flight) => flight.shadow.visible);
    for (const flight of stamps) flight.model.visible = false;
    for (const flight of halves) flight.model.visible = false;
    try {
      fill.intensity = STAMP_AMBIENT;
      key.intensity = STAMP_KEY;
      renderer.autoClear = true;
      renderer.render(scene, camera);
      renderer.autoClear = false;
      for (const flight of flights) flight.shadow.visible = false;
      if (stamps.length) {
        for (const flight of stamps) flight.model.visible = true;
        fill.intensity = stampAmbient;
        key.intensity = stampKey;
        renderer.render(scene, camera);
        for (const flight of stamps) flight.model.visible = false;
      }
      if (halves.length) {
        for (const flight of halves) flight.model.visible = true;
        fill.intensity = halfAmbient;
        key.intensity = halfKey;
        renderer.render(scene, camera);
      }
    } finally {
      for (const flight of stamps) flight.model.visible = true;
      for (const flight of halves) flight.model.visible = true;
      flights.forEach((flight, index) => { flight.shadow.visible = shadowWas[index]; });
      restore();
    }
    icePass = {
      style2: isIceTheme(),
      drewStamp: stamps.length > 0,
      drewHalf: halves.length > 0,
      stampAmbient: stamps.length ? stampAmbient : null,
      stampKey: stamps.length ? stampKey : null,
      halfAmbient: halves.length ? halfAmbient : null,
      halfKey: halves.length ? halfKey : null,
    };
  }

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0;
    lastNow = now;
    step(dt);
    syncToolXforms();
    placeStage();
    renderTools();
  });

  function applyThemeInk() {
    for (const flight of flights) {
      if (flight.shot.castHex != null) {
        const themed = themeHex(flight.shot.castHex);
        flight.shot.bodyHex = themed == null ? flight.shot.castHex : themed;
      }
    }
    paintMarks();
    syncToolXforms();
  }
  window.__vanokStampLight = () => ({
    style2: isIceTheme(),
    baseAmbient: STAMP_AMBIENT,
    baseKey: STAMP_KEY,
    restingAmbient: fill.intensity,
    restingKey: key.intensity,
    stampAmbient: iceLight.stampAmbient,
    stampKey: iceLight.stampKey,
    halfAmbient: iceLight.halfAmbient,
    halfKey: iceLight.halfKey,
    appleAmbient: iceLight.appleAmbient,
    appleKey: iceLight.appleKey,
    applied: icePass,
  });
  window.__vanokPlaneMaterials = () => {
    const rowsOf = (root) => {
      const rows = [];
      if (!root) return rows;
      root.traverse((node) => {
        if (!node.isMesh || !node.material) return;
        const material = Array.isArray(node.material) ? node.material[0] : node.material;
        if (!material || !material.color) return;
        rows.push({
          type: material.type,
          color: material.color.getHexString(),
          metalness: material.metalness,
          roughness: material.roughness,
          map: !!material.map,
          envMap: !!material.envMap,
          matcap: !!material.matcap,
          flatShading: !!material.flatShading,
          plane: !!material.userData.plane,
        });
      });
      return rows;
    };
    return {
      tab: currentModelTab().id,
      stamp: rowsOf(stampModel),
      half: rowsOf(appleModel),
      halfTurnY: (() => {
        let y = null;
        if (!appleModel) return y;
        appleModel.traverse((node) => {
          if (node.name === 'half-turn') y = Math.round(node.rotation.y * 180 / Math.PI);
        });
        return y;
      })(),
      flights: flights.map((flight) => ({
        kind: flight.shot.kind,
        src: flight.shot.src,
        file: flight.shot.file,
        rows: rowsOf(flight.model),
      })),
    };
  };
  document.documentElement.addEventListener('vanok-theme', applyThemeInk);
  document.documentElement.addEventListener('vanok-models', syncToolModels);
  repaintAppleImprints = paintMarks;

  return () => {
    alive = false;
    stampCapQuery.removeEventListener('change', onStampCapChange);
    removeEventListener('resize', onStampCapChange);
    while (flights.length) releaseFlight(flights.pop());
    document.documentElement.removeEventListener('vanok-theme', applyThemeInk);
    document.documentElement.removeEventListener('vanok-models', syncToolModels);
    removeEventListener('pointerdown', noteIntroGesture, true);
    removeEventListener('touchstart', noteIntroGesture, true);
    if (window.PointerEvent) {
      removeEventListener('pointerdown', onTrailDown, true);
      removeEventListener('pointermove', onTrailMove, true);
      removeEventListener('pointerup', onPointerUp, true);
      removeEventListener('pointercancel', onPointerUp, true);
    } else {
      removeEventListener('touchstart', onTrailDown, true);
      removeEventListener('touchmove', onTrailMove, true);
      removeEventListener('touchend', onPointerUp, true);
      removeEventListener('touchcancel', onPointerUp, true);
    }
    removeEventListener('click', onClick, true);
    removeEventListener('mousedown', onStampMouseDown, true);
    removeEventListener('mousemove', onStampMouseMove, true);
    removeEventListener('mouseup', onStampMouseUp, true);
    document.removeEventListener('selectionchange', onStampSelectionChange);
    removeEventListener('selectstart', onStampNativeDrag, true);
    removeEventListener('dragstart', onStampNativeDrag, true);
    document.documentElement.classList.remove('stamp-press');
    removeEventListener('keydown', onKey);
    renderer.setAnimationLoop(null);
    if (window.__vanokPlaceSeal === placeSeal) delete window.__vanokPlaceSeal;
    if (window.__vanokPlaneMaterials) delete window.__vanokPlaneMaterials;
    repaintAppleImprints = () => {};
    ro.disconnect();
    renderer.dispose();
    canvas.remove();
    panel.remove();
    layer.remove();
  };
}

// Поза шапки до возврата фото: Euler XYZ, как у перетаскивания
// (горизонталь — Y, вертикаль — X, Shift / правая кнопка — Z).
// Направление света то же, что у DirectionalLight (−2.4, 5.2, −1.7).
const VIEW_APPLE = {
  xPx: 1513,
  topPx: 5,
  rotX: 69.7,
  rotY: -172.9,
  rotZ: -33.2,
  size: 1.54,
  azimuth: -90,
  elevation: 52,
  distance: 6.5422,
  intensity: 4.45,
  ambient: 0.72,
  lightMode: 'source',
  shadowDark: 0.09,
  shadowRadius: 11,
  lightOn: true,
  shadeSmooth: true,
  panelOpen: false,
};

function weldSmoothGeometry(geometry) {
  const source = geometry.clone();
  for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) source.deleteAttribute(name);

  });

  function afterRestPose() {
    syncEnterReadout();

  }
  addHeading('Положение');
  xInput = addSlider('По горизонтали', 'xPx', -400, Math.ceil(innerWidth + 400), 1, (v) => Math.round(v) + ' px', afterRestPose);
  topInput = addSlider('От верха экрана', 'topPx', -400, Math.ceil(innerHeight + 400), 1, (v) => Math.round(v) + ' px', afterRestPose);
  sizeInput = addSlider('Размер', 'size', 0.2, 8, 0.01, (v) => Math.round(v * 100) + '%', afterRestPose);
  addHeading('Поворот яблока');
  addSlider('X', 'rotX', -180, 180, 0.1, (v) => v.toFixed(1) + '°', afterRestPose);
  addSlider('Y', 'rotY', -180, 180, 0.1, (v) => v.toFixed(1) + '°', afterRestPose);
  addSlider('Z', 'rotZ', -180, 180, 0.1, (v) => v.toFixed(1) + '°', afterRestPose);
  const shadeChecks = document.createElement('div');

  shadeInput.addEventListener('change', () => {
    VIEW_APPLE.shadeSmooth = shadeInput.checked;

  shadeChecks.append(shadeLabel);
  panel.append(shadeChecks);
  addHeading('Источник света');
  const lightChecks = document.createElement('div');
  lightChecks.className = 'checks';
  const lightLabel = document.createElement('label');
  const lightInput = document.createElement('input');
  lightInput.type = 'checkbox';
  lightInput.checked = VIEW_APPLE.lightOn !== false;
  lightInput.setAttribute('aria-label', 'Свет');
  lightLabel.append(lightInput, document.createTextNode('Свет'));
  lightInput.addEventListener('change', () => {
    VIEW_APPLE.lightOn = lightInput.checked;

  lightChecks.append(lightLabel);
  for (const [value, label] of [['map', 'Карта'], ['source', 'Источник']]) {

    modeInput.setAttribute('aria-label', label);
    modeInput.addEventListener('change', () => {

  panel.append(lightChecks);
  mapHint = document.createElement('p');
  mapHint.className = 'hint';
  mapHint.textContent = 'Только общее освещение, без лампы и тени.';
  mapHint.hidden = VIEW_APPLE.lightMode !== 'map';
  panel.append(mapHint);
  sourceBlock = document.createElement('div');
  sourceBlock.hidden = VIEW_APPLE.lightMode === 'map';
  addSlider('Общее освещение', 'ambient', 0, 2, 0.01, (v) => v.toFixed(2), null, sourceBlock);
  const ambientHint = document.createElement('p');
  ambientHint.className = 'hint';
  ambientHint.textContent = '0.72 и интенсивность 1.70 — свет яблока, которое ставит печать.';
  sourceBlock.append(ambientHint);
  addSlider('Азимут', 'azimuth', -180, 180, 1, (v) => Math.round(v) + '°', null, sourceBlock);
  addSlider('Высота света', 'elevation', 5, 89, 1, (v) => Math.round(v) + '°', null, sourceBlock);
  addSlider('Интенсивность', 'intensity', 0, 8, 0.05, (v) => v.toFixed(2), null, sourceBlock);
  const lightPos = document.createElement('p');
  lightPos.className = 'hint';
  sourceBlock.append(lightPos);
  addHeading('Тень света', sourceBlock);
  const castHint = document.createElement('p');
  castHint.className = 'hint';
  castHint.textContent = 'Яблоко отбрасывает тень от этого источника.';
  sourceBlock.append(castHint);
  addSlider('Темнота тени', 'shadowDark', 0, 1, 0.01, (v) => v.toFixed(2), placeApple, sourceBlock);
  addSlider('Мягкость карты тени', 'shadowRadius', 0, 80, 0.1, (v) => v.toFixed(1), placeApple, sourceBlock);
  panel.append(sourceBlock);
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'copy-json';
  copyBtn.textContent = 'Скопировать JSON';
  copyBtn.addEventListener('click', async () => {
    const round = (value, digits) => Number(Number(value).toFixed(digits));
    const json = JSON.stringify({
      xPx: Math.round(VIEW_APPLE.xPx),

      size: round(VIEW_APPLE.size, 2),
      rotX: round(VIEW_APPLE.rotX, 1),
      rotY: round(VIEW_APPLE.rotY, 1),
      rotZ: round(VIEW_APPLE.rotZ, 1),

      ambient: round(VIEW_APPLE.ambient, 2),
      azimuth: Math.round(VIEW_APPLE.azimuth),
      elevation: Math.round(VIEW_APPLE.elevation),

      shadowRadius: round(VIEW_APPLE.shadowRadius, 1),

  panel.append(copyBtn);

  function isTyping(event) {
    const el = event.target;
    if (!(el instanceof HTMLElement)) return false;
    if (el.isContentEditable) return true;
    const tag = el.tagName;
    if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (tag !== 'INPUT') return false;
    const type = (el.type || 'text').toLowerCase();
    return !['range', 'checkbox', 'radio', 'button', 'submit', 'reset', 'color', 'file'].includes(type);
  }
  function onKey(event) {
    if (event.repeat) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.code === 'Escape') {
      if (panel.hidden) return;
      const el = event.target;
      const easeSelect = el instanceof HTMLSelectElement && panel.contains(el);
      if (!isTyping(event) || easeSelect) setOpen(false);
      return;
    }
    if (isTyping(event)) return;
    if (event.code !== 'KeyL') return;
    event.preventDefault();
    togglePanel();
  }
  addEventListener('keydown', onKey);
  addEventListener('resize', () => {
    applyAppleLayout();
    applyKeyLightAndPlace();
  });
  addEventListener('pointermove', onPointerMove);
  addEventListener('pointerleave', onPointerLeave);
  addEventListener('pointerdown', onApplePointerDown, { capture: true, passive: false });
  addEventListener('pointermove', onApplePointerMove, { passive: false });
  addEventListener('pointerup', onApplePointerUp);
  addEventListener('pointercancel', onApplePointerUp);

  function dressViewportApple(fitted) {
    fitted.traverse((node) => {
      if (!node.isMesh) return;
      node.castShadow = true;
      node.receiveShadow = false;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) if (material) material.shadowSide = THREE.DoubleSide;
    });
  }

  function disposeViewFitted(root) {
    root.traverse((node) => {
      if (!node.isMesh) return;
      const smooth = node.userData.smoothGeometry;
      const flat = node.userData.flatGeometry;
      if (smooth && smooth !== flat) smooth.dispose();
      if (!node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) if (material) material.dispose();
    });
  }

  let viewGeneration = 0;
  function viewAppleTurn(model) {
    let turn = null;
    for (let i = 0; i < model.children.length; i++) {
      if (model.children[i].name === 'apple-turn') turn = model.children[i];
    }
    if (!turn) {
      turn = new THREE.Group();
      turn.name = 'apple-turn';
      turn.rotation.order = 'XYZ';
      const extras = [];
      for (let i = 0; i < model.children.length; i++) extras.push(model.children[i]);
      model.add(turn);
      for (let i = 0; i < extras.length; i++) turn.add(extras[i]);
    }
    return turn;
  }
  function applyCornerAppleXform() {
    const d = Math.PI / 180;
    viewXform.rotation.order = 'XYZ';
    viewXform.rotation.set(
      viewAppleXform.x * d,
      viewAppleXform.y * d,
      viewAppleXform.z * d,
    );
    const s = viewAppleXform.scale;
    viewXform.scale.set(s, s, s);
  }
  refreshViewAppleXform = applyCornerAppleXform;
  function applyViewAppleTurn() {
    if (!appleModel) return;
    const turn = viewAppleTurn(appleModel);
    const file = turn.userData.appleFile;
    const pose = detailAppleTurn({ apple: file });
    const tabId = currentModelTab().id;
    // Plane uses the light bitten apple; tab 01 uses apple_whole_01.glb.
    // Both get DETAIL_APPLE_TURN plus TAB01_APPLE_OFFSET. low, detail, and mat do not.
    const tab01 = usesTab01ApplePose(file, tabId);
    const d = Math.PI / 180;
    turn.rotation.order = 'XYZ';
    turn.rotation.set(
      pose ? pose.x * d : 0,
      ((pose ? pose.y : 0) + (tab01 ? TAB01_APPLE_OFFSET.y : 0)) * d,
      pose ? pose.z * d : 0,
    );
    const scale = (pose ? pose.scale : 1) * (tab01 ? TAB01_APPLE_OFFSET.scale : 1);
    turn.scale.set(scale, scale, scale);
  }
  function syncViewportApple() {
    const generation = ++viewGeneration;
    const tab = currentModelTab();
    const tabId = tab.id;
    const url = tab.apple;
    loadGltf(url).then((gltf) => {
      if (!alive || generation !== viewGeneration || !gltf || currentModelTab().id !== tabId) return;
      if (tab.look === 'teaser') {
        VIEW_APPLE.shadeSmooth = true;
        if (shadeInput) shadeInput.checked = true;
      }
      const fitted = prepareApple(gltf);
      dressViewportApple(fitted);
      if (!appleModel) {
        appleModel = new THREE.Group();
        viewXform.add(appleModel);
        registerIceRoot(tilt, 'view');
      }
      const turn = viewAppleTurn(appleModel);
      const prev = turn.children.slice();
      for (let i = 0; i < prev.length; i++) turn.remove(prev[i]);
      turn.add(fitted);
      for (let i = 0; i < prev.length; i++) disposeViewFitted(prev[i]);
      turn.userData.appleFile = url;
      applyViewAppleTurn();
      appleFile = url;
      applyKeyLightAndPlace();
      if (pearlOn) applyPearl(appleModel);
      else if (chromeOn) applyChrome(appleModel, CHROME_APPLE);
      appleVisualReady = true;
    });
  }
  paintPearlViewport = () => {
    if (appleModel) applyPearl(appleModel);
    scene.environmentIntensity = 0;
  };
  paintChromeViewport = () => {
    if (appleModel) applyChrome(appleModel, CHROME_APPLE);
    scene.environmentIntensity = chromeOn ? 1.15 : 0;
  };
  restoreViewportLook = () => {
    syncViewportApple();
  };
  document.documentElement.addEventListener('vanok-models', syncViewportApple);
  syncViewportApple();

  applyKeyLightAndPlace();
  renderer.setAnimationLoop(() => {
    if (!alive) return;
    maybeStartAppleEnter();
    const flying = !!(appleEnter && performance.now() - appleEnter.start < appleEnter.ms);
    const rolling = appleRolling();
    if (!appleEnter || flying || !appleEnter.settled || rolling) {
      if (appleEnter && !flying) appleEnter.settled = true;
      applyKeyLightAndPlace();
    }
    if (appleRoll && !appleRolling()) {
      appleRoll = null;
      applyKeyLightAndPlace();
    }
    followPointer();
    syncAppleFlightLight();
    renderer.render(scene, camera);
    if (appleEnter) {
      const age = performance.now() - appleEnter.start;
      if (!globalThis.__enterTrace) globalThis.__enterTrace = [];
      const trace = globalThis.__enterTrace;
      const prev = trace[trace.length - 1];
      if (!prev || age - prev.age >= 220) {
        const rot = appleEnterRot();
        trace.push({
          age: Math.round(age),
          ease: Math.round(appleEnterEase() * 1000) / 1000,
          off: Math.round(appleEnterOffset()),
          y: Math.round(rot.y * 10) / 10,
          z: Math.round(rot.z * 10) / 10,
        });
      }
      if (!globalThis.__enterFrames) globalThis.__enterFrames = [];
      const bucket = Math.floor(age / 450);
      if (bucket <= 4 && !globalThis.__enterFrames[bucket]) {
        const snap = document.createElement('canvas');
        snap.width = 320;
        snap.height = 180;
        snap.getContext('2d').drawImage(renderer.domElement, 0, 0, 320, 180);
        globalThis.__enterFrames[bucket] = { age: Math.round(age), url: snap.toDataURL('image/jpeg', 0.6) };
      }
    }
  });

  function readViewportApple() {
    let casters = 0;
    let shading = null;
    tilt.traverse((node) => {
      if (node.isMesh && node.castShadow) casters += 1;
      if (shading || !node.isMesh) return;
      const mat = Array.isArray(node.material) ? node.material[0] : node.material;
      shading = {
        flatShading: !!mat?.flatShading,
        verts: node.geometry?.attributes?.position?.count ?? 0,
        color: mat?.color?.getHexString?.() || '',
        metalness: mat?.metalness,
        roughness: mat?.roughness,
        emissive: mat?.emissive?.getHexString?.() || '',
        map: !!(mat && mat.map),
        envMap: !!(mat && mat.envMap),
        matcap: !!(mat && mat.matcap),
        type: mat?.type || '',
        shader: !!(mat && mat.userData && mat.userData.shader01),
        keep: !!(mat && mat.userData && mat.userData.keepTexture),
        plane: !!(mat && mat.userData && mat.userData.plane),
      };
    });
    const pose = appleShownRot();
    const spinY = pose.y - appleEnterRot().y;
    return {
      ...VIEW_APPLE,
      shading,
      gazeX: gaze.sx,
      gazeY: gaze.sy,
      dragYaw: drag.yaw * 180 / Math.PI,
      dragPitch: drag.pitch * 180 / Math.PI,
      dragOn: drag.active,
      spinDeg: Math.round((pose.x - appleEnterRot().x) * 10) / 10,
      spinY: Math.round(spinY * 10) / 10,
      poseX: Math.round(pose.x * 10) / 10,
      poseY: Math.round(pose.y * 10) / 10,
      poseZ: Math.round(pose.z * 10) / 10,
      quatX: tilt.quaternion.x,
      quatY: tilt.quaternion.y,
      quatZ: tilt.quaternion.z,
      quatW: tilt.quaternion.w,
      shownX: (shownEuler.setFromQuaternion(tilt.quaternion, 'XYZ'), Math.round(shownEuler.x * 180 / Math.PI * 10) / 10),
      shownY: Math.round(shownEuler.y * 180 / Math.PI * 10) / 10,
      shownZ: Math.round(shownEuler.z * 180 / Math.PI * 10) / 10,
      light: { x: key.position.x, y: key.position.y, z: key.position.z },
      keyIntensity: key.intensity,
      fillIntensity: fill.intensity,
      envIntensity: scene.environmentIntensity,
      castShadow: key.castShadow,
      model: appleFile,
      modelTab: currentModelTab().id,
      modelLook: currentModelTab().look,
      appleTurnY: (() => {
        if (!appleModel) return 0;
        for (let i = 0; i < appleModel.children.length; i++) {
          const child = appleModel.children[i];
          if (child.name === 'apple-turn') return Math.round(child.rotation.y * 180 / Math.PI * 10) / 10;
        }
        return 0;
      })(),
      appleTurnScale: (() => {
        if (!appleModel) return 1;
        for (let i = 0; i < appleModel.children.length; i++) {
          const child = appleModel.children[i];
          if (child.name === 'apple-turn') return child.scale.x;
        }
        return 1;
      })(),
      casters,
      shadowMap: !!key.shadow.map,
      groundOpacity: groundMat.opacity,
      appleY: tilt.position.y,
      extent: key.shadow.camera.right,
      enterEase: appleEnterEase(),
      enterOffset: appleEnterOffset(),
      enterAge: appleEnter ? performance.now() - appleEnter.start : -1,
      enterXOffset: appleEnterXOffset(),
      enterRotX: appleEnterRot().x,
      enterRotY: appleEnterRot().y,
      enterRotZ: appleEnterRot().z,
      enterMs: appleEnter ? appleEnter.ms : fly.ms,
      enterEaseName: appleEnter ? appleEnter.ease : fly.ease,
      tiltZ: tilt.position.z,
    };
  }
  readViewportApple.set = (patch) => {
    Object.assign(VIEW_APPLE, patch);
    applyKeyLightAndPlace();
  };
  globalThis.__viewportApple = readViewportApple;

  return () => {
    alive = false;
    refreshViewAppleXform = () => {};
    removeEventListener('keydown', onKey);
    removeEventListener('resize', applyKeyLightAndPlace);
    removeEventListener('pointermove', onPointerMove);
    removeEventListener('pointerleave', onPointerLeave);
    removeEventListener('pointerdown', onApplePointerDown, true);
    removeEventListener('pointermove', onApplePointerMove);
    removeEventListener('pointerup', onApplePointerUp);
    removeEventListener('pointercancel', onApplePointerUp);
    if (globalThis.__vanokAppleGesture) delete globalThis.__vanokAppleGesture;
    if (globalThis.__vanokHitsApple) delete globalThis.__vanokHitsApple;
    if (globalThis.__vanokAppleRolling) delete globalThis.__vanokAppleRolling;
    document.documentElement.removeEventListener('vanok-models', syncViewportApple);
    renderer.setAnimationLoop(null);
    pmrem.dispose();
    renderer.dispose();
    host.remove();
    panel.remove();
    if (globalThis.__viewportApple) delete globalThis.__viewportApple;
  };
}

const SKIN = { color: 0x67c514, emissive: 0x7be81a, emissiveIntensity: 0.1, metalness: 0, roughness: 0.42 };
const STEM = { color: 0x7a4e28, emissive: 0x000000, emissiveIntensity: 0, metalness: 0, roughness: 0.64 };
const LEAF = { color: 0x2f861f, emissive: 0x14300a, emissiveIntensity: 0.18, metalness: 0, roughness: 0.52 };
const FLESH = { color: 0xf6e0b8, emissive: 0xf0d0a0, emissiveIntensity: 0.08, metalness: 0, roughness: 0.62 };
const SEED = { color: 0x6b3a22, emissive: 0x2a140c, emissiveIntensity: 0.04, metalness: 0, roughness: 0.5 };
const LOOK = {
  PaleGreen: SKIN,
  green: SKIN,
  DarkBrown: STEM,
  brown: STEM,
  _defaultMat: STEM,
  DarkGreen: LEAF,
  brownLight: FLESH,
  brownDark: SEED,
};

function materialsOf(mesh) {
  return Array.isArray(mesh.material) ? mesh.material : [mesh.material];
}

function meshByMaterial(root, name) {
  let found = null;
  root.traverse((o) => {
    if (o.isMesh && materialsOf(o).some((m) => m.name === name)) found = o;
  });
  return found;
}

function paintApple(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of materialsOf(o)) {
      const look = LOOK[m.name];
      if (!look) continue;
      m.color.setHex(look.color);
      m.emissive.setHex(look.emissive);
      m.emissiveIntensity = look.emissiveIntensity;
      m.metalness = look.metalness;
      m.roughness = look.roughness;
      const skin = m.name === 'PaleGreen' || m.name === 'green';
      m.envMapIntensity = skin ? 0.22 : 0.12;
      m.side = m.name === 'DarkGreen' ? THREE.DoubleSide : THREE.FrontSide;
      m.flatShading = false;
      if (m.name === 'brownDark') {
        m.polygonOffset = true;
        m.polygonOffsetFactor = -2;
        m.polygonOffsetUnits = -2;
      }
      m.needsUpdate = true;
      rememberTeaserMaterial(m);
    }
  });
}

// Лист в модели стоит ребром. Разворачиваем пластинку нормалью к камере,
// вращая вокруг основания — ближайшей к телу вершины.
function faceLeafToCamera(leaf, bodyCenter) {
  const viewDir = new THREE.Vector3(0, 1, 0);
  leaf.updateWorldMatrix(true, false);
  const toWorld = leaf.matrixWorld;
  const attr = leaf.geometry.attributes.position;
  const pts = [];
  for (let i = 0; i < attr.count; i++) {
    pts.push(new THREE.Vector3().fromBufferAttribute(attr, i).applyMatrix4(toWorld));
  }
  const mean = new THREE.Vector3();
  for (const p of pts) mean.add(p);
  mean.multiplyScalar(1 / pts.length);

  const c = new Array(9).fill(0);
  for (const p of pts) {
    const d = p.clone().sub(mean);
    c[0] += d.x * d.x; c[1] += d.x * d.y; c[2] += d.x * d.z;
    c[4] += d.y * d.y; c[5] += d.y * d.z; c[8] += d.z * d.z;
  }
  c[3] = c[1]; c[6] = c[2]; c[7] = c[5];
  const trace = c[0] + c[4] + c[8];
  const m = c.map((x, i) => (i % 4 === 0 ? trace - x : -x));
  const n = new THREE.Vector3(0.41, 0.82, 0.41).normalize();
  for (let i = 0; i < 80; i++) {
    n.set(
      m[0] * n.x + m[1] * n.y + m[2] * n.z,
      m[3] * n.x + m[4] * n.y + m[5] * n.z,
      m[6] * n.x + m[7] * n.y + m[8] * n.z,
    ).normalize();
  }
  if (n.dot(viewDir) < 0) n.negate();

  let base = pts[0], best = Infinity;
  for (const p of pts) {
    const d2 = p.distanceToSquared(bodyCenter);
    if (d2 < best) { best = d2; base = p; }
  }
  const world = new THREE.Matrix4()
    .makeTranslation(base.x, base.y, base.z)
    .multiply(new THREE.Matrix4().makeRotationFromQuaternion(
      new THREE.Quaternion().setFromUnitVectors(n, viewDir)))
    .multiply(new THREE.Matrix4().makeTranslation(-base.x, -base.y, -base.z));
  const inv = new THREE.Matrix4().copy(toWorld).invert();
  leaf.geometry.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, world).multiply(toWorld));
  leaf.geometry.computeVertexNormals();
}

function centerOf(mesh) {
  return new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
}

function worldNormal(mesh) {
  const attr = mesh.geometry.attributes.normal;
  const n = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  for (let i = 0; i < attr.count; i++) n.add(tmp.fromBufferAttribute(attr, i));
  mesh.updateWorldMatrix(true, false);
  return n.transformDirection(mesh.matrixWorld).normalize();
}

document.documentElement.addEventListener('vanok-theme', syncIceTheme);
window.__vanokIce = iceMaterialReport;
queuePlanePrints();
mountSignStamp(document.getElementById('sign-host'));
mountViewportApple();
