<!DOCTYPE html>
<html lang="en" data-theme="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanök Regular — Website soon</title>
<link rel="icon" href="design/stub/favicon.png" type="image/png">
<link rel="icon" href="design/stub/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="design/stub/apple-touch-icon.png">
<style>
  /* Desktop frame 110:1711 is 1440×800. Mobile frame 141:1647 is 375×812.
     --k scales a frame from its own width. Mobile shows through 440px.
     Desktop columns stretch: margin 12, gutter 12, count 12. */
  :root {
    --bg: #E9E9E9;
    --blue: #0A1AE9;
    --grotesk: Arial, "Helvetica Neue", Helvetica, sans-serif;
    /* Visual viewport. JS overwrites these when Safari chrome shifts it. */
    --vvh: 100dvh;
    --vv-top: 0px;
    --vv-lift: 0px;
  }
  html[data-theme="1"] {
    --blue: #8A7E59;
    --bg: hsl(303.8182deg 100% 78.4314%);
  }
  html[data-theme="2"] {
    --blue: #E3F4E8;
    --bg: linear-gradient(180deg, #A59D90 0%, #02DD67 100%);
  }
  html[data-theme="3"] {
    --blue: #ffffff;
    --bg: #80a6bc;
  }
  html[data-theme="3"] .site-credits {
    color: rgba(255, 255, 255, 0.32);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg) fixed;
    cursor: pointer;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  html {
    height: 100svh;
    height: 100dvh;
  }
  html[data-theme="0"],
  html[data-theme="1"],
  html[data-theme="3"] {
    background-color: var(--bg);
    background-image: var(--paper, none);
    background-repeat: repeat;
    background-size: 256px 256px;
    background-attachment: fixed;
  }

  body {
    z-index: 0;
    background: transparent;
    color: var(--blue);
    font-family: var(--grotesk);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
  }

  /* Zero-size filter SVG. Absolute so it does not open a line box and drop the header. */
  .lab-ink-filter {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
  }

  .frame {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: transparent;
  }

  .desk {
    --k: calc(100vw / 1440);
    /* Stretch columns on the desktop frame. Margin and gutter stay 12px. */
    --grid-margin: 12px;
    --grid-gutter: 12px;
    /* 100vw, not 100%: a percentage would resolve against height inside top/height. */
    --col: calc((100vw - 2 * var(--grid-margin) - 11 * var(--grid-gutter)) / 12);
    --letter-w: calc(6 * var(--col) + 5 * var(--grid-gutter));
    --letter-left: calc(var(--grid-margin) + 6 * (var(--col) + var(--grid-gutter)));
    /* Frame 596:52 is at y=12 on the 1440 frame. The wordmark box shares that top with the header row. */
    --wordmark-top: calc(12 * var(--k));
    height: calc(800 * var(--k));
    background: transparent;
  }
  .mob {
    --k: calc(100vw / 375);
    /* Bio is three 14*k lines at 16*k. The clear gap under that block is 24px at every width. */
    --wordmark-top: calc(58 * var(--k) + 24px);
    height: 100%;
    display: none;
    background: transparent;
  }

  .frame p { margin: 0; position: absolute; }

  .frame img { position: absolute; display: block; max-width: none; }

  .crosshair {
    position: absolute;
    z-index: 9;
    left: calc(11.06 * var(--k));
    top: calc(11.23 * var(--k));
    width: calc(21.535 * var(--k));
    height: calc(21.535 * var(--k));
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    line-height: 0;
    cursor: pointer;
  }
  .crosshair svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .bio {
    font-size: calc(14 * var(--k));
    line-height: normal;
    white-space: nowrap;
  }

  .desk .bio {
    left: calc(var(--grid-margin) + (var(--col) + var(--grid-gutter)));
    top: calc(12 * var(--k));
    line-height: calc(16 * var(--k));
  }

  .soon {
    font-size: calc(14 * var(--k));
    line-height: normal;
    white-space: nowrap;
  }

  .desk .soon {
    top: calc(12 * var(--k));
    right: var(--grid-margin);
  }

  /* Lettering box from frame 596:52. Top is the header row, not a gap under the bio. */
  .wordmark {
    position: absolute;
    z-index: 1;
    display: block;
    max-width: none;
    --k: calc(100vw / 1440);
    --grid-margin: 12px;
    --grid-gutter: 12px;
    --col: calc((100vw - 2 * var(--grid-margin) - 11 * var(--grid-gutter)) / 12);
    --letter-w: calc(6 * var(--col) + 5 * var(--grid-gutter));
    --letter-left: calc(var(--grid-margin) + 6 * (var(--col) + var(--grid-gutter)));
    --wordmark-top: calc(12 * var(--k));
    left: var(--letter-left);
    top: var(--wordmark-top);
    width: var(--letter-w);
    height: calc(var(--letter-w) * 233 / 702);
    filter: url(#lab-ink);
  }
  @media (max-width: 440px) {
    .wordmark {
      --k: calc(100vw / 375);
      --wordmark-top: calc(58 * var(--k) + 24px);
      left: calc(24 * var(--k));
      top: var(--wordmark-top);
      width: calc(327 * var(--k));
      height: calc(327 * var(--k) * 233 / 702);
      filter: url(#lab-ink);
    }
  }

  .sign { position: absolute; }

  .desk .sign {
    left: calc(50% - 152 * var(--k));
    top: calc(442 * var(--k));
    width: calc(304 * var(--k));
  }

  .sign-line {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: calc(1 * var(--k));
    background: var(--blue);
  }

  .sign p {
    left: 0;
    width: 100%;
    text-align: center;
    line-height: 1;
    white-space: nowrap;
  }

  .desk .sign p {
    top: calc(8 * var(--k));
    font-size: calc(14 * var(--k));
  }

  .mob .bio {
    left: calc(194 * var(--k));
    top: calc(16 * var(--k));
    width: calc(157 * var(--k));
    font-size: calc(12 * var(--k));
    line-height: calc(14 * var(--k));
    white-space: normal;
  }

  /* Bottom row is 24*k above the visible viewport, not the old 812 frame.
     --vv-lift shifts it up when Safari's layout viewport is taller. */
  .mob .soon {
    position: fixed;
    right: calc(24 * var(--k));
    bottom: calc(24 * var(--k) + var(--vv-lift));
    height: calc(14 * var(--k));
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-size: calc(12 * var(--k));
    line-height: calc(14 * var(--k));
  }

  .mob .crosshair {
    position: absolute;
    left: calc(23.231 * var(--k));
    top: calc(23.231 * var(--k));
    bottom: auto;
    width: calc(21.535 * var(--k));
    height: calc(21.535 * var(--k));
  }


  /* Sign line sits at y=465 on the 375×812 frame. Width scale only, so theme changes do not move it. */
  .mob .sign {
    left: calc(74.25 * var(--k));
    top: calc(465 * var(--k));
    width: calc(226.492 * var(--k));
  }

  .mob .sign-line {
    width: calc(226.492 * var(--k));
  }

  .mob .sign p {
    left: 0;
    width: 100%;
    text-align: center;
    top: calc(6.625 * var(--k));
    font-size: calc(12 * var(--k));
    line-height: calc(14 * var(--k));
  }

  .ig-link,
  .catalog-entry,
  .cam-light {
    z-index: 3;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    line-height: normal;
    text-decoration-line: underline;
    text-decoration-thickness: from-font;
    text-underline-position: from-font;
    white-space: nowrap;
    cursor: pointer;
  }
  .desk .ig-link,
  .desk .catalog-entry,
  .desk .cam-light {
    position: absolute;
    top: calc(12 * var(--k));
    font-size: calc(14 * var(--k));
  }
  .desk .ig-link { left: var(--letter-left); }
  .desk .catalog-entry,
  .desk .cam-light {
    left: calc(var(--grid-margin) + 9 * (var(--col) + var(--grid-gutter)));
  }
  .mob .ig-link {
    position: fixed;
    left: calc(24 * var(--k));
    top: auto;
    bottom: calc(24 * var(--k) + var(--vv-lift));
    height: calc(14 * var(--k));
    display: flex;
    align-items: center;
    font-size: calc(12 * var(--k));
    line-height: calc(14 * var(--k));
  }

  .site-credits {
    z-index: 4;
    margin: 0;
    color: var(--blue);
    font-family: var(--grotesk);
    font-weight: 400;
    font-size: calc(14 * var(--k));
    line-height: normal;
    text-decoration: none;
    white-space: nowrap;
    writing-mode: vertical-rl;
    cursor: pointer;
  }
  .desk .site-credits {
    position: fixed;
    right: 12px;
    bottom: 12px;
  }
  .mob .site-credits {
    display: none;
    font-size: calc(12 * var(--k));
  }
  .site-credits .credits-name {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    visibility: hidden;
  }
  @media (hover: hover) {
    .site-credits:hover .credits-full { visibility: hidden; }
    .site-credits:hover .credits-name { visibility: visible; }
  }

  @media (max-width: 440px) {
    .desk { display: none; }
    .mob {
      display: block;
      height: 100svh;
      height: 100dvh;
      max-height: 100dvh;
    }
  }

  #sign-host {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  .sign-stage {
    position: fixed;
    pointer-events: none;
    z-index: 8;
  }
  .sign-imprints {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .sign-imprint {
    position: absolute;
    display: block;
    transform-origin: center center;
    pointer-events: none;
  }
  .sign-imprint .ink {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
  }
  .sign-imprint .dye {
    position: absolute;
    inset: 0;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
  .stamp-panel {
    position: fixed;
    z-index: 100;
    right: 16px;
    bottom: 16px;
    width: min(300px, calc(100vw - 32px));
    max-height: min(680px, calc(100vh - 32px));
    overflow: auto;
    padding: 12px 14px 14px;
    background: #d7d7d7;
    color: #0c6df4;
    border: 1px solid #0c6df4;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.3;
  }
  .stamp-panel,
  .apple-light { touch-action: auto; }
  .stamp-panel[hidden] { display: none; }
  .stamp-panel h2 {
    margin: 0;
    padding-right: 52px;
    font-size: 14px;
    font-weight: 400;
  }
  .stamp-panel h3 {
    margin: 12px 0 0;
    font-size: 12px;
    font-weight: 400;
  }
  .stamp-panel .ice-light {
    margin: 0 0 10px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(12, 109, 244, 0.35);
  }
  .stamp-panel .ice-light .hint { margin: 4px 0 0; }
  .stamp-panel .hint { margin: 4px 0 8px; }
  .stamp-panel .tabs { display: flex; gap: 6px; margin: 0 0 8px; }
  .stamp-panel .tabs button {
    flex: 1 1 auto;
    border: 1px solid #0c6df4;
    background: transparent;
    color: #0c6df4;
    font: inherit;
    padding: 4px 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .stamp-panel .tabs button.on { background: #0c6df4; color: #e1e1e1; }
  .stamp-panel .pane[hidden] { display: none; }
  .stamp-panel .close {
    position: absolute;
    top: 8px;
    right: 8px;
    border: 0;
    background: transparent;
    color: #0c6df4;
    font: inherit;
    cursor: pointer;
    padding: 2px 4px;
  }
  .stamp-panel label.row { display: block; margin-top: 8px; }
  .stamp-panel label.row span { display: flex; justify-content: space-between; gap: 8px; }
  .stamp-panel b { font-weight: 400; }
  .stamp-panel i { font-style: normal; }
  .stamp-panel input[type="range"] {
    display: block;
    width: 100%;
    margin-top: 4px;
    accent-color: #0c6df4;
  }
  .stamp-panel select,
  .stamp-panel input[type="color"] {
    display: block;
    width: 100%;
    margin-top: 4px;
    color: #0c6df4;
    background: #e8e8e8;
    border: 1px solid #0c6df4;
    font: inherit;
  }
  .stamp-panel input[type="color"] { height: 24px; padding: 0; }
  .stamp-panel .checks {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  .stamp-panel .checks label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stamp-panel .checks input { accent-color: #0c6df4; }
  .stamp-panel .meta { margin: 10px 0 0; }
  .stamp-panel .meta p { margin: 0 0 4px; }
  .stamp-panel .thumbs { display: flex; gap: 6px; margin-top: 6px; }
  .stamp-panel .thumbs button {
    width: 84px;
    height: 46px;
    padding: 2px;
    border: 1px solid rgba(12, 109, 244, 0.35);
    background: #ececec;
    cursor: pointer;
  }
  .stamp-panel .thumbs button.on { border-color: #0c6df4; box-shadow: inset 0 0 0 1px #0c6df4; }
  .stamp-panel .thumbs img { width: 100%; height: 100%; object-fit: contain; }
  .apple-view {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
  }
  .apple-view canvas { display: block; width: 100%; height: 100%; }
  .apple-light {
    position: fixed;
    z-index: 100;
    left: 16px;
    bottom: 52px;
    width: min(280px, calc(100vw - 32px));
    max-height: min(640px, calc(100vh - 80px));
    overflow: auto;
    margin: 0;
    padding: 12px 14px 14px;
    background: #d7d7d7;
    color: #0c6df4;
    border: 1px solid #0c6df4;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.3;
  }
  .apple-light[hidden] { display: none; }
  .apple-light h2 {
    margin: 0;
    padding-right: 64px;
    font-size: 14px;
    font-weight: 400;
  }
  .apple-light h3 {
    margin: 12px 0 0;
    font-size: 12px;
    font-weight: 400;
  }
  .apple-light .hint { margin: 4px 0 0; }
  .apple-light .model-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 0;
  }
  .apple-light .model-tabs button {
    border: 1px solid #0c6df4;
    background: #ececec;
    color: #0c6df4;
    font: inherit;
    padding: 5px 8px;
    cursor: pointer;
  }
  .apple-light .model-tabs button.on {
    background: #0c6df4;
    color: #e1e1e1;
  }
  .apple-light .close {
    position: absolute;
    top: 8px;
    right: 8px;
    border: 0;
    background: transparent;
    color: #0c6df4;
    font: inherit;
    cursor: pointer;
    padding: 2px 4px;
  }
  .apple-light label.row { display: block; margin-top: 8px; }
  .apple-light label.row span { display: flex; justify-content: space-between; gap: 8px; }
  .apple-light b { font-weight: 400; }
  .apple-light i { font-style: normal; font-variant-numeric: tabular-nums; }
  .apple-light input[type="range"] {
    display: block;
    width: 100%;
    margin-top: 4px;
    accent-color: #0c6df4;
  }
  .apple-light select {
    display: block;
    width: 100%;
    margin-top: 4px;
    color: #0c6df4;
    background: #e8e8e8;
    border: 1px solid #0c6df4;
    font: inherit;
  }
  .apple-light .checks { margin-top: 10px; }
  .apple-light .checks label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .apple-light .checks input { accent-color: #0c6df4; }
  .apple-light .copy-json {
    display: block;
    width: 100%;
    margin-top: 14px;
    border: 1px solid #0c6df4;
    background: #0c6df4;
    color: #e1e1e1;
    font: inherit;
    padding: 7px 10px;
    cursor: pointer;
  }

  /* Intro plays on the real sign line. The label follows it. Everything else waits. */
  .sign-line {
    transform-origin: center center;
    animation: vanok-sign-open 640ms ease both;
  }
  @keyframes vanok-sign-open {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  .sign p {
    animation: vanok-sign-label 400ms ease 480ms both;
  }
  @keyframes vanok-sign-label {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  html.page-ready .sign-line,
  html.page-ready .sign p { animation: none; }
  html.page-ready .sign-line { transform: scaleX(1); }
  html.page-ready .sign p { opacity: 1; }

  .wordmark,
  .bio,
  .soon,
  .crosshair,
  .draw-sig-btn,
  .catalog-entry,
  .ig-link,
  .site-credits,
  .cam-light,
  .ig-link,
  .site-credits,
  #sign-host,
  .apple-view {
    opacity: 0;
    transition: opacity 500ms ease;
  }
  html.page-ready .wordmark,
  html.page-ready .bio,
  html.page-ready .soon,
  html.page-ready .crosshair,
  html.page-ready .draw-sig-btn,
  html.page-ready .catalog-entry,
  html.page-ready .cam-light,
  html.page-ready .ig-link,
  html.page-ready .site-credits,
  html.page-ready #sign-host,
  html.page-ready .apple-view.apple-shown {
    opacity: 1;
  }
  html:not(.page-ready) .crosshair,
  html:not(.page-ready) .draw-sig-btn,
  html:not(.page-ready) .catalog-entry,
  html:not(.page-ready) .cam-light,
  html:not(.page-ready) .ig-link,
  html:not(.page-ready) .site-credits { pointer-events: none; }

  .draw-sig-btn {
    position: fixed;
    z-index: 9;
    left: 50%;
    bottom: 16px;
    width: 77px;
    height: 77px;
    margin: 0;
    padding: 0;
    border: 0;
    transform: translateX(-50%);
    background: transparent;
    cursor: pointer;
  }
  .draw-sig-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: transparent;
  }
  .draw-sig-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background-color: var(--blue);
    -webkit-mask: url("design/stub/sig-entry-circle.svg") center / contain no-repeat;
    mask: url("design/stub/sig-entry-circle.svg") center / contain no-repeat;
    pointer-events: none;
  }
  @media (max-width: 440px) {
    .draw-sig-btn {
      --k: calc(100vw / 375);
      width: calc(77 * var(--k));
      height: calc(77 * var(--k));
      bottom: calc(var(--vv-lift) - 7 * var(--k));
      left: calc(50% - 1px);
    }
  }
  @media (min-width: 441px) {
    .draw-sig-btn { display: none; }
  }

  .cam-light-mob {
    position: fixed;
    z-index: 9;
    left: 50%;
    bottom: calc(16px + var(--vv-lift));
    transform: translateX(-50%);
    font-size: 14px;
  }
  @media (min-width: 441px) {
    .cam-light-mob { display: none; }
  }
  @media (max-width: 440px) {
    .cam-light-mob {
      --k: calc(100vw / 375);
      bottom: calc(16 * var(--k) + var(--vv-lift));
      font-size: calc(12 * var(--k));
    }
  }
  /* Hidden, but inside the viewport. Off-screen video never reaches play() in Safari. */
  .cam-preview {
    position: fixed;
    left: 0;
    top: 0;
    width: 160px;
    height: 120px;
    opacity: 0;
    pointer-events: none;
  }

  /* Three.js ground (#E9E9E9) and its shadow map. Behind the chrome. */
  .page-shadow {
    position: fixed;
    inset: 0;
    z-index: -1;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: block;
    background: transparent;
  }

  .turn-power {
    position: fixed;
    z-index: 120;
    left: 16px;
    bottom: 16px;
    width: min(300px, calc(100vw - 32px));
    margin: 0;
    padding: 12px 14px 14px;
    background: #E9E9E9;
    color: #0A1AE9;
    border: 1px solid #0A1AE9;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.3;
  }
  .turn-power[hidden] { display: none; }
  .turn-power-tabs { display: flex; gap: 6px; margin: 0 0 12px; }
  .turn-power-tabs button {
    appearance: none;
    border: 1px solid #0A1AE9;
    background: transparent;
    color: #0A1AE9;
    font: inherit;
    padding: 3px 8px;
    cursor: pointer;
  }
  .turn-power-tabs button.on {
    background: #0A1AE9;

  (function () {

    setTimeout(function () {
      if (root.classList.contains('page-ready')) return;

    function cycle(event) {
      event.preventDefault();

      if (event.code === 'Digit2' || event.code === 'Numpad2') {
        if (typing) return;
        event.preventDefault();

    mesh.position.set(p.x, p.y, CASTER_Z);

    mesh.castShadow = true;
  }

  function syncCasters() {
    const nodes = document.querySelectorAll('.wordmark, .bio, .ig-link, .soon, .sign-line, .sign p, .crosshair, .site-credits, .cam-light');
    const seen = new Set();
    for (let i = 0; i < nodes.length; i++) {
      const el = nodes[i];
      if (!isShown(el)) continue;
      seen.add(el);
      let entry = casters.get(el);
      if (!entry) {
        entry = createCaster(el);
        casters.set(el, entry);
      }
      if (entry.kind === 'text') {
        const key = labelKey(el);
        if (key !== entry.key) {
          const tex = paintLabel(el);
          if (tex) {
            applyMap(entry.mesh, tex);
            entry.key = key;
            entry.ready = true;
          }
        }
      }
      if (!entry.ready) {
        entry.mesh.visible = false;
        continue;
      }
      place(entry.mesh, el.getBoundingClientRect(), entry.kind);
    }
    casters.forEach(function (entry, el) {
      if (!seen.has(el)) entry.mesh.visible = false;
    });
  }

  window.addEventListener('resize', function () {
    viewW = 0;
    resize();
  });

  window.__labShadow = {
    light: lamp,
    renderer: renderer,
    ground: plate,
    map: 'PCFSoftShadowMap',
  };

  function frame() {
    resize();
    syncGround();
    syncCasters();
    syncLamp();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

  const size = 512;

  const radius = (size - 1) / 2;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nx = (x - radius) / radius;
      const ny = (radius - y) / radius;
      const d2 = nx * nx + ny * ny;
      const nz = d2 >= 1 ? 0 : Math.sqrt(1 - d2);

// envMapIntensity 1.4, clearcoat. No matcap and no file texture. The corner
// apple and the stamping half are #56AE08. Each round stamp takes the dominant
// opaque color of its own print (near-white and near-transparent pixels dropped).
const CHROME_APPLE = 0x56ae08;
const CHROME_ROUGH = 0.08;
const CHROME_ENV = 1.4;

let chromeOn = false;

let refreshChromePrints = () => {};
let refreshPlanePrints = () => {};
const chromePrintHex = new Map();

function dominantOpaqueHex(img) {
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  if (!w || !h) return null;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  if (!ctx) return null;
  ctx.drawImage(img, 0, 0, w, h);
  let data;
  try {
    data = ctx.getImageData(0, 0, w, h).data;
  } catch (err) {
    return null;
  }
  const buckets = new Map();
  for (let i = 0; i < data.length; i += 4) {
    const a = data[i + 3];
    if (a < 32) continue;
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];
    if (r > 245 && g > 245 && b > 245) continue;
    const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
    let bucket = buckets.get(key);
    if (!bucket) {
      bucket = { n: 0, r: 0, g: 0, b: 0 };
      buckets.set(key, bucket);
    }
    bucket.n += 1;
    bucket.r += r;
    bucket.g += g;
    bucket.b += b;
  }
  let best = null;
  for (const bucket of buckets.values()) {
    if (!best || bucket.n > best.n) best = bucket;
  }
  if (!best || !best.n) return null;
  const r = Math.round(best.r / best.n);
  const g = Math.round(best.g / best.n);
  const b = Math.round(best.b / best.n);
  return (r << 16) | (g << 8) | b;
}

function queueChromeSample(src) {
  if (!src || chromePrintHex.has(src) || chromePrintHex.has('pending:' + src)) return;
  chromePrintHex.set('pending:' + src, 1);
  const img = new Image();
  img.onload = () => {
    chromePrintHex.delete('pending:' + src);
    const hex = dominantOpaqueHex(img);
    if (hex == null) return;
    chromePrintHex.set(src, hex);
    if (chromeOn) refreshChromePrints();
    refreshPlanePrints();
  };
  img.onerror = () => chromePrintHex.delete('pending:' + src);
  img.src = src;
}

function fitTopDown(model) {
  const pivot = new THREE.Group();
  pivot.add(model);
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  pivot.scale.setScalar(1 / diam);
  pivot.position.copy(center).multiplyScalar(-1 / diam);
  return pivot;
}

function cloneTab01Apple(scene) {
  // GLTFLoader drops '.' from node names, so APPLE_green_Bitten.002
  // arrives as APPLE_green_Bitten002.
  const raw = 'APPLE_green_Bitten.002';
  const sanitized = raw.replace(/\s/g, '_').replace(/[\[\].:/]/g, '');
  let found = null;
  scene.traverse((node) => {
    if (found) return;
    if (node.name === raw || node.name === sanitized) found = node;
  });
  if (!found) return scene.clone(true);
  const root = new THREE.Group();
  root.name = sanitized;
  root.add(found.clone(true));
  return root;
}

function orientHalfCut(model) {
  const body = meshByMaterial(model, 'green');
  const stem = meshByMaterial(model, 'brown');
  const flesh = meshByMaterial(model, 'brownLight');
  const leaf = meshByMaterial(model, 'DarkGreen');
  if (flesh && stem && body) {
    const cutN = worldNormal(flesh);
    const stemDir = centerOf(stem).sub(centerOf(body));
    if (cutN.lengthSq() > 1e-8 && stemDir.lengthSq() > 1e-8) {
      const qCut = new THREE.Quaternion().setFromUnitVectors(cutN, new THREE.Vector3(0, 1, 0));
      const stemFlat = stemDir.normalize().applyQuaternion(qCut);
      stemFlat.y = 0;
      if (stemFlat.lengthSq() > 1e-8) {
        const qStem = new THREE.Quaternion().setFromUnitVectors(stemFlat.normalize(), new THREE.Vector3(0, 0, 1));
        model.quaternion.copy(qStem.multiply(qCut));
      } else {
        model.quaternion.copy(qCut);
      }
    }
  }
  model.updateMatrixWorld(true);
  if (leaf && body) faceLeafToCamera(leaf, centerOf(body));
}

function planeSources(kind) {
  const srcs = [];
  const seen = new Set();
  const add = (src) => {
    if (!src || seen.has(src)) return;
    seen.add(src);
    srcs.push(src);
  };
  const store = window.VanokSignatures;
  if (store && typeof store.pool === 'function') {
    const pooled = store.pool(kind) || [];
    for (let i = 0; i < pooled.length; i++) add(pooled[i] && pooled[i].src);
  }
  const theme3 = (document.documentElement.dataset.theme || '0') === '3';
  const lists = kind === 'apple'
    ? (theme3 ? [KEY2_APPLE_IMPRINTS, APPLE_IMPRINTS] : [APPLE_IMPRINTS, KEY2_APPLE_IMPRINTS])
    : (theme3 ? [KEY2_STAMP_IMPRINTS, STAMP_IMPRINTS] : [STAMP_IMPRINTS, KEY2_STAMP_IMPRINTS]);
  for (let i = 0; i < lists.length; i++) {
    const list = lists[i] || [];
    for (let j = 0; j < list.length; j++) add(list[j] && list[j].src);
  }
  return srcs;
}

function queuePlanePrints() {

  function drawColor() {
    if (!colorDeck.length) {
      const colors = ['blue', 'pink', 'green'];
      for (let i = colors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [colors[i], colors[j]] = [colors[j], colors[i]];
      }
      if (colors[colors.length - 1] === lastColor) {
        [colors[0], colors[colors.length - 1]] = [colors[colors.length - 1], colors[0]];
      }
      colorDeck.push(...colors);
    }
    lastColor = colorDeck.pop();
    return lastColor;
  }

    const key2 = kind === 'apple' ? KEY2_APPLE_IMPRINTS : KEY2_STAMP_IMPRINTS;
    const imprint = list.find((item) => item.file === cast.file)
      || key2.find((item) => item.file === cast.file)
      || list[0];
    const themed = themeHex(cast.hex);
    return { ...imprint, castHex: cast.hex, bodyHex: themed == null ? cast.hex : themed };
  }
  function fileOf(item) {
    return String(item && item.src || '').split('/').pop().split('?')[0];
  }
  function castFromLibrary(item) {
    if (item && item.preset) {
      const file = fileOf(item);
      const casts = item.kind === 'apple' ? APPLE_CASTS : STAMP_CASTS;
      const stock = casts.find((cast) => cast.file === file);
      if (stock) return castFromStock(item.kind, stock);
      const hex = Number.isFinite(item.castHex) ? item.castHex : 0x0c6df4;
      const themed = themeHex(hex);
      return {
        file: file || item.id,
        src: item.src,
        castHex: hex,
        bodyHex: themed == null ? hex : themed,
        custom: false,
      };
    }
    return castFromCustom(item);
  }
  function optionId(item) {
    const store = window.VanokSignatures;
    return store && typeof store.placeKey === 'function' ? store.placeKey(item) : item.id;
  }
  const folderBags = { stamp: [], apple: [] };
  function drawFolder(kind) {
    const casts = kind === 'apple' ? KEY2_APPLE_CASTS : KEY2_STAMP_CASTS;
    if (!casts.length) return null;
    let bag = folderBags[kind];
    if (!bag.length) {
      bag = casts.slice();
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      folderBags[kind] = bag;
    }
    return castFromStock(kind, bag.pop());
  }
  function usesFolderStamps() {
    return (document.documentElement.dataset.theme || '0') === '3';
  }
  function pickCast(kind) {
    const store = window.VanokSignatures;
    const rig = kind === 'apple' ? appleRig : stampRig;
    const casts = kind === 'apple' ? APPLE_CASTS : STAMP_CASTS;
    if (store && rig.file === 'random') {
      const forced = store.takeNext(kind);
      if (forced) {
        lastColor = forced.colorName || lastColor;
        store.rememberPlaced(kind, optionId(forced));
        return castFromLibrary(forced);
      }
      if (usesFolderStamps()) {
        const folder = drawFolder(kind);
        if (folder) return folder;
      }
      const customs = store.pool(kind);
      if (!customs.length) return null;
      {
        const options = customs.map((item) => ({ id: optionId(item), item }));
        let bag = options;
        const last = store.lastPlaced(kind);
        if (options.length > 1 && last) {
          const fresh = options.filter((entry) => entry.id !== last);
          if (fresh.length) bag = fresh;
        }
        const choice = bag[Math.floor(Math.random() * bag.length)];
        store.rememberPlaced(kind, choice.id);
        if (choice.item) {
          lastColor = choice.item.colorName || lastColor;
          return castFromLibrary(choice.item);
        }
        lastColor = choice.cast.color;
        return castFromStock(kind, choice.cast);
      }
    }
    let cast = casts.find((item) => item.file === rig.file);
    if (!cast) {
      const color = drawColor();
      cast = casts.find((item) => item.color === color) || casts[0];
    } else {
      lastColor = cast.color;
    }
    return castFromStock(kind, cast);
  }

  // Theme 2 recolours every ink. Theme 1 turns every ink white.
  // Theme 3 and default mode both draw the folder-42 prints.
  function themeHex(ink) {
    const theme = document.documentElement.dataset.theme || '0';
    if (theme === '2') return 0xe3f4e8;
    if (theme === '1') return 0xffffff;
    return null;
  }

  function sampleShot(point, rig, kind) {
    const choice = pickCast(kind);
    if (!choice) return null;
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const span = rig.jitter * (w / 1440);
    return {
      ...choice,
      kind,
      rig,
      rot: (Math.random() * 2 - 1) * rig.rotation,
      px: (point.px + (Math.random() * 2 - 1) * span) / w,
      py: (point.py + (Math.random() * 2 - 1) * span) / h,
      placed: false,
    };
  }

  function paintMarks() {
    if (!marks.length || !host.isConnected) return;
    const h = host.clientHeight;
    if (host.clientWidth < 2 || h < 2) return;
    for (const mark of marks) {
      const rig = mark.kind === 'apple' ? appleRig : stampRig;
      const fitted = (SIZE * rig.scale / viewH) * h;
      // Stock files pad the seal. Custom exports fill the canvas, so they
      // take the seal size: 505/539 on the circle, 460/537 on the apple.
      // imprintScale is the apple «Масштаб принта»: 1 is that current width.
      const imgW = mark.kind === 'apple'
        ? fitted * (mark.custom ? APPLE_INK_FRAC : 1) * rig.imprintScale
        : (mark.custom ? fitted : fitted / INK_FRAC);
      mark.el.style.left = `calc(${mark.px * 100}% + ${rig.offsetX}px)`;
      mark.el.style.top = `calc(${mark.py * 100}% + ${rig.offsetY}px)`;
      mark.el.style.width = imgW + 'px';
      mark.el.style.opacity = String(rig.opacity);
      mark.el.style.filter = rig.blur > 0.01 ? `blur(${rig.blur}px)` : 'none';
      const rot = mark.kind === 'apple'
        ? rig.pressY - mark.rot + appleImprintSpin
        : mark.rot;
      mark.el.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
      const themed = themeHex(mark.castHex);
      if (themed == null) {
        mark.dye.style.opacity = String(rig.tintAmount);
        mark.dye.style.background = rig.tint;
      } else {
        mark.dye.style.opacity = '1';
        mark.dye.style.background = '#' + themed.toString(16).padStart(6, '0');
      }
    }
  }

  function motionSeconds(base, speed) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    return (reduce ? base * 0.4 : base) / Math.max(0.25, speed);
  }

  function pressSeconds() {
    return matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.08 : 0.2;
  }

  function targetOf(current) {
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const px = current.px * w + current.rig.offsetX;
    const py = current.py * h + current.rig.offsetY;
    const size = SIZE * (current.kind === 'apple' ? current.rig.scale : current.rig.printScale);
    return {
      x: (px / w - 0.5) * viewW,
      z: (py / h - 0.5) * viewH,
      edge: viewH / 2 + size * 0.65,
    };
  }

  function squashCurve(u) {
    if (u < 0.55) return Math.sin((u / 0.55) * Math.PI / 2) * 1.12;
    const v = (u - 0.55) / 0.45;
    return 1.12 - 0.12 * (1 - (1 - v) ** 2);
  }

  function axisPose(flight, prefix) {
    const d = Math.PI / 180;
    const rig = flight.shot.rig;
    return {
      x: rig[prefix + 'X'] * d,
      y: rig[prefix + 'Y'] * d,
      z: rig[prefix + 'Z'] * d,
    };
  }

  function lerpPose(a, b, t) {
    return {
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t,
      z: a.z + (b.z - a.z) * t,
    };
  }

  function travelPose(u, from, via, to) {
    if (u <= 0.5) return lerpPose(from, via, u / 0.5);
    return lerpPose(via, to, (u - 0.5) / 0.5);
  }

  function poseFor(flight, name, u) {
    const start = axisPose(flight, 'start');
    const fly = axisPose(flight, 'fly');
    const press = axisPose(flight, 'press');
    if (name === 'descend') return travelPose(u, start, fly, press);
    if (name === 'lift') return travelPose(u, press, fly, start);
    return press;
  }

  function tintObject(root, rig) {
    root.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        if (m.userData.shader01 || m.userData.keepTexture || m.userData.matte || m.userData.pearl || m.userData.chrome || m.userData.plane) continue;
        if (!m.userData.baseColor) {
          const snap = m.userData.teaserMat;
          m.userData.baseColor = new THREE.Color(snap ? snap.color : m.color.getHex());
        }
        m.color.copy(m.userData.baseColor);
        if (rig.tintAmount > 0) m.color.lerp(new THREE.Color(rig.tint), rig.tintAmount);
        m.transparent = rig.opacity < 0.999;
        m.opacity = rig.opacity;
        m.depthWrite = rig.opacity > 0.95;
      }
    });
  }

  function pressScales(squash, amount) {
    const signed = amount * squash;
    return {
      x: Math.max(0.12, 1 + signed),
      y: Math.max(0.12, 1 - signed * 1.35),
    };
  }

  function paintTool(root, kind, hex) {
    root.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) {
        if (material.userData.shader01 || material.userData.keepTexture || material.userData.matte || material.userData.pearl || material.userData.chrome || material.userData.plane) continue;
        if (kind === 'apple') {
          if (material.name !== 'green' && material.name !== 'PaleGreen') continue;
          material.color.setHex(hex);
          material.emissive.setHex(hex);
          material.emissiveIntensity = 0.08;
          continue;
        }
        const color = new THREE.Color(hex);
        if (node.name === 'Pad') color.multiplyScalar(0.78);
        else if (node.name === 'Handle') color.multiplyScalar(0.9);
        material.color.copy(color);
      }
    });
  }

  function cloneTool(source) {
    const clone = source.clone(true);
    clone.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const copyMat = (material) => {
        const next = material.clone();
        if (material.userData.shader01) {
          next.userData.shader01 = true;
          next.userData.bareMatcap = true;
        }
        if (material.userData.keepTexture) next.userData.keepTexture = true;
        if (material.userData.matte) next.userData.matte = true;
        if (material.userData.pearl) next.userData.pearl = true;
        if (material.userData.chrome) next.userData.chrome = true;
        if (material.userData.plane) next.userData.plane = true;
        if (material.userData.teaserMat && !next.userData.teaserMat) {
          next.userData.teaserMat = material.userData.teaserMat;
        }
        return next;
      };
      node.material = Array.isArray(node.material)
        ? node.material.map(copyMat)
        : copyMat(node.material);
    });
    clone.visible = false;
    scene.add(clone);
    registerIceRoot(clone, 'tool');
    return clone;
  }

  function cloneShadow() {
    const mesh = shadow.clone();
    mesh.material = shadow.material.clone();
    mesh.visible = false;
    scene.add(mesh);
    return mesh;
  }

  function releaseFlight(flight) {
    iceRoots.delete(flight.model);
    scene.remove(flight.model);
    flight.model.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) material.dispose();
    });
    scene.remove(flight.shadow);
    flight.shadow.material.dispose();
    flight.model.visible = false;
    flight.shadow.visible = false;
  }

  function applyPose(flight, x, z, squashAmt, rot, presence, spin) {
    const shot = flight.shot;
    const rig = shot.rig;
    const size = SIZE * (shot.kind === 'apple' ? rig.scale : rig.printScale);
    const pressed = pressScales(rig.squash, squashAmt);
    const spread = pressed.x;
    const squat = pressed.y;
    const euler = spin || poseFor(flight, 'press', 1);
    const model = flight.model;
    model.scale.set(size * spread, size * squat, size * spread);
    model.rotation.order = 'XYZ';
    model.rotation.set(euler.x, euler.y - rot * Math.PI / 180, euler.z);
    model.position.set(x, 0.02 - Math.min(1, squashAmt) * 0.012, z);
    model.visible = true;
    if (shot.kind === 'apple') tintObject(model, rig);
    if (chromeOn) {
      const hex = chromeHexForShot(shot);
      if (hex != null) tintChrome(model, hex);
    }
    if (shot.bodyHex != null) paintTool(model, shot.kind, shot.bodyHex);
    if (currentModelTab().look === 'plane') {
      const hex = planeHexForShot(shot);
      if (hex != null) tintPlane(model, hex);
    }
    const shade = flight.shadow;
    shade.visible = true;
    shade.position.set(x + 0.04, 0.002, z + 0.03);
    shade.material.opacity = 0.1 + presence * 0.22 + Math.min(1, squashAmt) * 0.4;
    shade.scale.setScalar(1.12 - Math.min(1, squashAmt) * 0.1);
  }

  function kindReady(kind) {
    return kind === 'apple' ? appleModel : stampModel;
  }

  function start(point) {
    if (!(performance.now() >= (window.__vanokStampsAt || Infinity))) return;
    if (typeof globalThis.__vanokAppleGesture === 'function' && globalThis.__vanokAppleGesture()) return;
    if (!STAMPS_ON) return;
    const armed = window.VanokSignatures && window.VanokSignatures.peekNext();
    const kind = armed ? armed.kind : (pressN % 2 === 0 ? 'stamp' : 'apple');
    const source = kindReady(kind);
    if (!source) {
      queued.push(point);
      return;
    }
    pressN += 1;
    const rig = kind === 'stamp' ? stampRig : appleRig;
    const shot = sampleShot(point, rig, kind);
    if (!shot) return;
    const flight = {
      shot,
      phase: 'descend',
      phaseU: 0,
      model: cloneTool(source),
      shadow: cloneShadow(),
    };
    flights.push(flight);
    const ui = fileUis.find((item) => item.kind === kind);
    if (ui) ui.last.textContent = 'Сейчас: ' + shot.file;
    refreshFiles();
    const goal = targetOf(shot);
    applyPose(flight, goal.x, goal.edge, 0, shot.rot, 0, poseFor(flight, 'descend', 0));
  }

  function placeSeal(item, clientX, clientY) {
    if (!alive || !item || (item.kind !== 'stamp' && item.kind !== 'apple')) return;
    const kind = item.kind;
    if (!STAMPS_ON) return;
    const hr = host.getBoundingClientRect();
    const point = { px: clientX - hr.left, py: clientY - hr.top };
    const source = kindReady(kind);
    if (!source) {
      queued.push({ px: point.px, py: point.py, seal: item });
      return;
    }
    const rig = kind === 'stamp' ? stampRig : appleRig;
    const choice = castFromLibrary(item);
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const span = rig.jitter * (w / 1440);
    const shot = {
      ...choice,
      kind,
      rig,
      rot: (Math.random() * 2 - 1) * rig.rotation,
      px: (point.px + (Math.random() * 2 - 1) * span) / w,
      py: (point.py + (Math.random() * 2 - 1) * span) / h,
      placed: false,
    };
    const store = window.VanokSignatures;
    if (store && typeof store.rememberPlaced === 'function') store.rememberPlaced(kind, optionId(item));
    pressN += 1;
    const flight = {
      shot,
      phase: 'descend',
      phaseU: 0,
      model: cloneTool(source),
      shadow: cloneShadow(),
    };
    flights.push(flight);
    const ui = fileUis.find((row) => row.kind === kind);
    if (ui) ui.last.textContent = 'Сейчас: ' + shot.file;
    refreshFiles();
    const goal = targetOf(shot);
    applyPose(flight, goal.x, goal.edge, 0, shot.rot, 0, poseFor(flight, 'descend', 0));

  function drainQueue() {
    while (queued.length) {
      const next = queued[0];
      if (next && next.seal) {
        const kind = next.seal.kind === 'apple' ? 'apple' : 'stamp';
        if (!kindReady(kind)) return;
        queued.shift();
        const hr = host.getBoundingClientRect();
        placeSeal(next.seal, next.px + hr.left, next.py + hr.top);
        continue;
      }
      const armed = window.VanokSignatures && window.VanokSignatures.peekNext();
      const kind = armed ? armed.kind : (pressN % 2 === 0 ? 'stamp' : 'apple');
      if (!kindReady(kind)) return;
      start(queued.shift());
    }
  }

  function stepFlight(flight, dt) {
    const shot = flight.shot;
    if (flight.phase === 'rest') {
      if (shot.rig.liftAway) {
        flight.phase = 'lift';
        flight.phaseU = 0;
      } else {
        const goal = targetOf(shot);
        applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      }
      return false;
    }
    const goal = targetOf(shot);
    if (flight.phase === 'descend') {
      flight.phaseU += dt / motionSeconds(0.62, shot.rig.descent);
      const u = Math.min(1, flight.phaseU);
      const k = 1 - (1 - u) ** 3;
      applyPose(flight, goal.x, goal.edge + (goal.z - goal.edge) * k, 0, shot.rot, k, poseFor(flight, 'descend', u));
      if (u >= 1) { flight.phase = 'press'; flight.phaseU = 0; }
    } else if (flight.phase === 'press') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      applyPose(flight, goal.x, goal.z, squashCurve(u), shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.5) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'repress') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      const sq = 1 + Math.sin(Math.min(1, u) * Math.PI) * 0.35;
      applyPose(flight, goal.x, goal.z, sq, shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.2) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'dwell') {
      applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      placeInk(shot);
      if (shot.rig.dwell <= 0.001) {
        flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
        flight.phaseU = 0;
      } else {
        flight.phaseU += dt / shot.rig.dwell;
        if (flight.phaseU >= 1) {
          flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
          flight.phaseU = 0;
        }
      }
    } else if (flight.phase === 'lift') {
      flight.phaseU += dt / motionSeconds(0.42, shot.rig.lift);
      const u = Math.min(1, flight.phaseU);
      const k = u * u;
      const release = Math.max(0, 1 - Math.min(1, u / 0.28));
      applyPose(flight, goal.x, goal.z + (goal.edge - goal.z) * k, release, shot.rot, 1 - k, poseFor(flight, 'lift', u));
      if (u >= 1) {
        releaseFlight(flight);
        return true;
      }
    }
    return false;
  }

  function step(dt) {
    for (let i = flights.length - 1; i >= 0; i--) {
      if (stepFlight(flights[i], dt)) flights.splice(i, 1);
    }
  }

  let stampGesture = 0;
  const stampBlock = '.stamp-panel, .apple-light, .sig-modal, .draw-sig-btn, .catalog-entry, .ig-link, .site-credits, .crosshair, input, select, textarea, button, label';

  function stampBlocked(e) {
    if (!alive || (e.button && e.button !== 0)) return true;
    const t = e.target;
    return !!(t && t.closest && t.closest(stampBlock));
  }

  function dropStamp(e) {
    let x = e.clientX;
    let y = e.clientY;
    if (e.changedTouches && e.changedTouches.length && e.type === 'touchend') {
      x = e.changedTouches[0].clientX;
      y = e.changedTouches[0].clientY;
    }
    const hr = host.getBoundingClientRect();
    start({ px: x - hr.left, py: y - hr.top });
  }

  let introGesture = false;
  function noteIntroGesture() {
    introGesture = !(performance.now() >= (window.__vanokStampsAt || Infinity));
  }
  addEventListener('pointerdown', noteIntroGesture, true);
  addEventListener('touchstart', noteIntroGesture, true);

  function onPointerUp(e) {
    if (introGesture || !(performance.now() >= (window.__vanokStampsAt || Infinity))) {
      introGesture = true;
      return;
    }
    if (stampBlocked(e)) return;
    stampGesture = Date.now();
    dropStamp(e);
  }

  function onClick(e) {
    if (introGesture || !(performance.now() >= (window.__vanokStampsAt || Infinity))) {
      introGesture = false;
      return;
    }
    if (Date.now() - stampGesture < 700) return;
    if (stampBlocked(e)) return;
    dropStamp(e);
  }

  if (window.PointerEvent) addEventListener('pointerup', onPointerUp, true);
  else addEventListener('touchend', onPointerUp, true);
  addEventListener('click', onClick, true);

  function isTyping(el) {
    while (el && el !== document.body) {
      if (el.isContentEditable) return true;
      const tag = el.tagName;
      if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (tag === 'INPUT') {
        const type = (el.type || 'text').toLowerCase();
        return type !== 'range' && type !== 'checkbox' && type !== 'radio' && type !== 'button';
      }
      el = el.parentElement;
    }
    return false;
  }

  function clearPlacedStamps() {
    for (let i = marks.length - 1; i >= 0; i--) {
      marks[i].el.remove();
      marks.splice(i, 1);
    }
    while (flights.length) releaseFlight(flights.pop());
    queued.length = 0;
  }

  function isStampEraseKey(e) {
    if (e.code === 'KeyD') return true;
    if (e.code) return false;
    const key = e.key;
    return key === 'd' || key === 'D' || key === 'в' || key === 'В';
  }

  function onKey(e) {
    if (e.repeat) return;
    if (e.code === 'Escape' && !panel.hidden && !isTyping(e.target)) {
      panel.hidden = true;
      return;
    }
    if (isStampEraseKey(e)) {
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      if (isTyping(e.target) || isTyping(document.activeElement)) return;
      e.preventDefault();
      clearPlacedStamps();
      return;
    }
    if (e.code !== 'KeyG' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(e.target) || isTyping(document.activeElement)) return;
    e.preventDefault();
    panel.hidden = !panel.hidden;
  }
  addEventListener('keydown', onKey);
  close.addEventListener('click', () => { panel.hidden = true; });

  function frame() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    placeStage();
    paintMarks();
  }
  const ro = new ResizeObserver(frame);
  ro.observe(host);
  frame();

  function toolXformNode(root) {
    if (!root) return null;
    let node = null;
    for (let i = 0; i < root.children.length; i++) {
      if (root.children[i].name === 'tool-xform') {
        node = root.children[i];
        break;
      }
    }
    if (!node) {
      node = new THREE.Group();
      node.name = 'tool-xform';
      root.add(node);
    }
    const extras = [];
    for (let i = 0; i < root.children.length; i++) {
      if (root.children[i] !== node) extras.push(root.children[i]);
    }
    for (let i = 0; i < extras.length; i++) node.add(extras[i]);
    return node;
  }

  function applyToolXform(root, kind) {
    const pose = toolXform[kind];
    const node = toolXformNode(root);
    if (!node || !pose) return;
    const d = Math.PI / 180;
    node.rotation.order = 'XYZ';
    node.rotation.set(pose.x * d, pose.y * d, pose.z * d);
    node.scale.set(pose.scale, pose.scale, pose.scale);
  }

  function syncToolXforms() {
    applyToolXform(appleModel, 'apple');
    applyToolXform(stampModel, 'stamp');
    for (let i = 0; i < flights.length; i++) {
      applyToolXform(flights[i].model, flights[i].shot.kind);
    }
  }

  function mountTool(kind, fitted) {
    const group = new THREE.Group();
    const spin = new THREE.Group();
    spin.name = 'tool-xform';
    spin.add(fitted);
    group.add(spin);
    applyToolXform(group, kind);
    group.scale.setScalar(SIZE);
    group.visible = false;
    scene.add(group);
    if (kind === 'stamp') stampModel = group;
    else appleModel = group;
    drainQueue();
  }

  function copyToolMaterial(material) {
    const next = material.clone();
    if (material.userData.shader01) {
      next.userData.shader01 = true;
      next.userData.bareMatcap = true;
    }
    if (material.userData.keepTexture) next.userData.keepTexture = true;
    if (material.userData.matte) next.userData.matte = true;
    if (material.userData.pearl) next.userData.pearl = true;
    if (material.userData.chrome) next.userData.chrome = true;
    if (material.userData.plane) next.userData.plane = true;
    if (material.userData.teaserMat) next.userData.teaserMat = material.userData.teaserMat;
    return next;
  }

  function cloneFittedMaterials(fitted) {
    const clone = fitted.clone(true);
    clone.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      node.material = Array.isArray(node.material)
        ? node.material.map(copyToolMaterial)
        : copyToolMaterial(node.material);
    });
    return clone;
  }

  function disposeFitted(root) {
    root.traverse((node) => {
      if (!node.isMesh) return;
      const smooth = node.userData.smoothGeometry;
      const flat = node.userData.flatGeometry;
      if (smooth && smooth !== flat) smooth.dispose();
      if (!node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) if (material) material.dispose();
    });
  }

  function installToolMesh(group, kind, fitted, uniqueMaterials) {
    const node = toolXformNode(group);
    const next = uniqueMaterials ? cloneFittedMaterials(fitted) : fitted;
    const prev = node.children.slice();
    for (let i = 0; i < prev.length; i++) node.remove(prev[i]);
    node.add(next);
    for (let i = 0; i < prev.length; i++) disposeFitted(prev[i]);
    applyToolXform(group, kind);
  }

  let toolGeneration = 0;
  function syncToolModels() {
    const generation = ++toolGeneration;
    const tab = currentModelTab();
    const tabId = tab.id;
    Promise.all([loadGltf(tab.stamp), loadGltf(tab.half)]).then(([stampGltf, halfGltf]) => {
      if (!alive || generation !== toolGeneration || currentModelTab().id !== tabId) return;
      globalThis.__vanokToolFiles = { tab: tabId, look: tab.look, stamp: tab.stamp, half: tab.half };
      if (tab.look === 'plane') queuePlanePrints();
      if (stampGltf) {
        const sceneClone = stampGltf.scene.clone(true);
        cloneMaterials(sceneClone);
        const fitted = fitTopDown(prepareStamp(sceneClone));
        if (!stampModel) mountTool('stamp', fitted);
        else {
          installToolMesh(stampModel, 'stamp', fitted, false);
          for (const flight of flights) {
            if (flight.shot.kind !== 'stamp') continue;
            installToolMesh(flight.model, 'stamp', fitted, true);
            if (flight.shot.bodyHex != null) paintTool(flight.model, 'stamp', flight.shot.bodyHex);
            if (tab.look === 'plane') {
              const hex = planeHexForShot(flight.shot);
              if (hex != null) tintPlane(flight.model, hex);
            }
          }
        }
      }
      if (halfGltf) {
        const fitted = prepareHalfApple(halfGltf);
        if (!appleModel) mountTool('apple', fitted);
        else {
          installToolMesh(appleModel, 'apple', fitted, false);
          for (const flight of flights) {
            if (flight.shot.kind !== 'apple') continue;
            installToolMesh(flight.model, 'apple', fitted, true);
            if (flight.shot.bodyHex != null) paintTool(flight.model, 'apple', flight.shot.bodyHex);
            if (tab.look === 'plane') {
              const hex = planeHexForShot(flight.shot);
              if (hex != null) tintPlane(flight.model, hex);
            }
          }
        }
      }
      if (pearlOn) {
        applyPearl(stampModel);
        applyPearl(appleModel);
        for (let i = 0; i < flights.length; i++) applyPearl(flights[i].model);
      } else if (chromeOn) {
        applyChrome(appleModel, CHROME_APPLE);
        applyChrome(stampModel, CHROME_WAIT);
        for (let i = 0; i < flights.length; i++) {
          const hex = chromeHexForShot(flights[i].shot);
          applyChrome(flights[i].model, hex == null ? CHROME_WAIT : hex);
        }
      }
    });
  }
  syncToolModels();

  // Themes 0–2: stamp and half share fill 0.72 and key 1.7 on every L tab
  // except mat and plane. Theme 3 copies the corner apple's live fill and key
  // onto both tools, every L tab, with no stamp/half slider pair and no 1/3 scale.
  // Mat without theme 3 still drives stamp and half from their own sliders.
  // Plane without theme 3 uses the corner apple's live light: VIEW_APPLE.ambient
  // and VIEW_APPLE.intensity (0.72 and 4.45), the same pair syncAppleFlightLight
  // applies when the apple is not on the theme-3 or mat sliders. Full intensity,
  // not STAMP_KEY 1.7 and not a 1/3 low-poly scale.
  function renderTools() {
    const stamps = [];
    const halves = [];
    const tabId = currentModelTab().id;
    const matTab = tabId === 'mat';
    const planeTab = tabId === 'plane';
    const restore = () => {
      fill.intensity = STAMP_AMBIENT;
      key.intensity = STAMP_KEY;
      renderer.autoClear = true;
    };
    if (!isIceTheme() && !matTab) {
      let ambient = STAMP_AMBIENT;
      let keyLevel = STAMP_KEY;
      if (planeTab) {
        const mode = VIEW_APPLE.lightOn === false
          ? 'off'
          : (VIEW_APPLE.lightMode === 'map' ? 'map' : 'source');
        ambient = mode === 'off' ? 0 : VIEW_APPLE.ambient;
        keyLevel = mode === 'source' ? VIEW_APPLE.intensity : 0;
      }
      fill.intensity = ambient;
      key.intensity = keyLevel;
      renderer.autoClear = true;
      renderer.render(scene, camera);
      icePass = {
        style2: false,
        drewStamp: false,
        drewHalf: false,
        stampAmbient: ambient,
        stampKey: keyLevel,
        halfAmbient: ambient,
        halfKey: keyLevel,
      };
      return;
    }
    const appleFill = iceLight.appleAmbient;
    const appleKey = iceLight.appleKey;
    const stampAmbient = isIceTheme() ? appleFill : iceLight.stampAmbient;
    const stampKey = isIceTheme() ? appleKey : iceLight.stampKey;
    const halfAmbient = isIceTheme() ? appleFill : iceLight.halfAmbient;
    const halfKey = isIceTheme() ? appleKey : iceLight.halfKey;
    for (const flight of flights) {
      if (!flight.model.visible) continue;
      if (flight.shot.kind === 'stamp') stamps.push(flight);
      else if (flight.shot.kind === 'apple') halves.push(flight);
    }
    const shadowWas = flights.map((flight) => flight.shadow.visible);
    for (const flight of stamps) flight.model.visible = false;
    for (const flight of halves) flight.model.visible = false;
    try {
      fill.intensity = STAMP_AMBIENT;
      key.intensity = STAMP_KEY;
      renderer.autoClear = true;
      renderer.render(scene, camera);
      renderer.autoClear = false;
      for (const flight of flights) flight.shadow.visible = false;
      if (stamps.length) {
        for (const flight of stamps) flight.model.visible = true;
        fill.intensity = stampAmbient;
        key.intensity = stampKey;
        renderer.render(scene, camera);
        for (const flight of stamps) flight.model.visible = false;
      }
      if (halves.length) {
        for (const flight of halves) flight.model.visible = true;
        fill.intensity = halfAmbient;
        key.intensity = halfKey;
        renderer.render(scene, camera);
      }
    } finally {
      for (const flight of stamps) flight.model.visible = true;
      for (const flight of halves) flight.model.visible = true;
      flights.forEach((flight, index) => { flight.shadow.visible = shadowWas[index]; });
      restore();
    }
    icePass = {
      style2: isIceTheme(),
      drewStamp: stamps.length > 0,
      drewHalf: halves.length > 0,
      stampAmbient: stamps.length ? stampAmbient : null,
      stampKey: stamps.length ? stampKey : null,
      halfAmbient: halves.length ? halfAmbient : null,
      halfKey: halves.length ? halfKey : null,
    };
  }

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0;
    lastNow = now;
    step(dt);
    syncToolXforms();
    placeStage();
    renderTools();
  });

  function applyThemeInk() {
    for (const flight of flights) {
      if (flight.shot.castHex != null) {
        const themed = themeHex(flight.shot.castHex);
        flight.shot.bodyHex = themed == null ? flight.shot.castHex : themed;
      }
    }
    paintMarks();
    syncToolXforms();
  }
  window.__vanokStampLight = () => ({
    style2: isIceTheme(),
    baseAmbient: STAMP_AMBIENT,
    baseKey: STAMP_KEY,
    restingAmbient: fill.intensity,
    restingKey: key.intensity,
    stampAmbient: iceLight.stampAmbient,
    stampKey: iceLight.stampKey,
    halfAmbient: iceLight.halfAmbient,
    halfKey: iceLight.halfKey,
    appleAmbient: iceLight.appleAmbient,
    appleKey: iceLight.appleKey,
    applied: icePass,
  });
  window.__vanokPlaneMaterials = () => {
    const rowsOf = (root) => {
      const rows = [];
      if (!root) return rows;
      root.traverse((node) => {
        if (!node.isMesh || !node.material) return;
        const material = Array.isArray(node.material) ? node.material[0] : node.material;
        if (!material || !material.color) return;
        rows.push({
          type: material.type,
          color: material.color.getHexString(),
          metalness: material.metalness,
          roughness: material.roughness,
          map: !!material.map,
          envMap: !!material.envMap,
          matcap: !!material.matcap,
          flatShading: !!material.flatShading,
          plane: !!material.userData.plane,
        });
      });
      return rows;
    };
    return {
      tab: currentModelTab().id,
      stamp: rowsOf(stampModel),
      half: rowsOf(appleModel),
      halfTurnY: (() => {
        let y = null;
        if (!appleModel) return y;
        appleModel.traverse((node) => {
          if (node.name === 'half-turn') y = Math.round(node.rotation.y * 180 / Math.PI);
        });
        return y;
      })(),
      flights: flights.map((flight) => ({
        kind: flight.shot.kind,
        src: flight.shot.src,
        file: flight.shot.file,
        rows: rowsOf(flight.model),
      })),
    };
  };
  document.documentElement.addEventListener('vanok-theme', applyThemeInk);
  document.documentElement.addEventListener('vanok-models', syncToolModels);
  repaintAppleImprints = paintMarks;

  return () => {
    alive = false;
    while (flights.length) releaseFlight(flights.pop());
    document.documentElement.removeEventListener('vanok-theme', applyThemeInk);
    document.documentElement.removeEventListener('vanok-models', syncToolModels);
    removeEventListener('pointerdown', noteIntroGesture, true);
    removeEventListener('touchstart', noteIntroGesture, true);
    if (window.PointerEvent) removeEventListener('pointerup', onPointerUp, true);
    else removeEventListener('touchend', onPointerUp, true);
    removeEventListener('click', onClick, true);
    removeEventListener('keydown', onKey);
    renderer.setAnimationLoop(null);
    if (window.__vanokPlaceSeal === placeSeal) delete window.__vanokPlaceSeal;
    if (window.__vanokPlaneMaterials) delete window.__vanokPlaneMaterials;
    repaintAppleImprints = () => {};
    ro.disconnect();
    renderer.dispose();
    canvas.remove();
    panel.remove();
    layer.remove();
  };
}

// Поза шапки до возврата фото: Euler XYZ, как у перетаскивания
// (горизонталь — Y, вертикаль — X, Shift / правая кнопка — Z).
// Направление света то же, что у DirectionalLight (−2.4, 5.2, −1.7).
const VIEW_APPLE = {
  xPx: 1513,
  topPx: 5,
  rotX: 69.7,
  rotY: -172.9,
  rotZ: -33.2,
  size: 1.54,
  azimuth: -90,
  elevation: 52,
  distance: 6.5422,
  intensity: 4.45,
  ambient: 0.72,
  lightMode: 'source',
  shadowDark: 0.09,
  shadowRadius: 11,
  lightOn: true,
  shadeSmooth: true,
  panelOpen: false,
};

function weldSmoothGeometry(geometry) {
  const source = geometry.clone();
  for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) source.deleteAttribute(name);
  const merged = BufferGeometryUtils.mergeVertices(source, 1e-4);
  source.dispose();
  merged.computeVertexNormals();
  return merged;
}

function applyShadeSmooth(root, smooth) {
  if (!root) return;
  root.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    const matsNow = Array.isArray(node.material) ? node.material : [node.material];
    if (matsNow.some((material) => material && (material.userData.keepTexture || material.userData.shader01 || material.userData.pearl || material.userData.chrome))) return;
    if (!node.userData.flatGeometry) {
      node.userData.flatGeometry = node.geometry;
      node.userData.smoothGeometry = weldSmoothGeometry(node.geometry);
    }
    node.geometry = smooth ? node.userData.smoothGeometry : node.userData.flatGeometry;
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    for (const material of mats) {
      if (!material || material.userData.shader01 || material.userData.pearl || material.userData.chrome) continue;
      material.flatShading = !smooth;
      material.needsUpdate = true;
    }
  });
}

function commitShadeSmooth(root, disposePrevious) {
  if (!root) return;
  root.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    const matsNow = Array.isArray(node.material) ? node.material : [node.material];
    if (matsNow.some((material) => material && (material.userData.keepTexture || material.userData.shader01 || material.userData.pearl || material.userData.chrome))) return;
    const welded = weldSmoothGeometry(node.geometry);
    const prev = node.geometry;
    node.geometry = welded;
    if (disposePrevious && prev && prev !== welded) prev.dispose();
    for (const material of matsNow) {
      if (!material || material.userData.shader01 || material.userData.pearl || material.userData.chrome) continue;
      material.flatShading = false;
      material.needsUpdate = true;
    }
  });
}

const ICE_MATTE = 0xb7c6cb;
const iceRoots = new Set();

function isIceTheme() {
  return (document.documentElement.dataset.theme || '0') === '3';
}

function rememberTeaserMaterial(material) {
  if (!material || material.userData.teaserMat) return;
  material.userData.teaserMat = {
    color: material.color.getHex(),
    emissive: material.emissive ? material.emissive.getHex() : 0,
    emissiveIntensity: material.emissiveIntensity || 0,
    litEmissive: material.userData.litEmissive != null ? material.userData.litEmissive : null,
    metalness: material.metalness ?? 0,
    roughness: material.roughness ?? 1,
    envMapIntensity: material.envMapIntensity ?? 1,
    flatShading: !!material.flatShading,
  };
}

function restoreTeaserMaterial(material) {
  const snap = material && material.userData.teaserMat;
  if (!snap) return;
  material.color.setHex(snap.color);
  if (material.emissive) {
    material.emissive.setHex(snap.emissive);
    material.emissiveIntensity = snap.emissiveIntensity;
  }
  if (snap.litEmissive != null) material.userData.litEmissive = snap.litEmissive;
  material.metalness = snap.metalness;
  material.roughness = snap.roughness;
  material.envMapIntensity = snap.envMapIntensity;
  material.flatShading = snap.flatShading;
  material.needsUpdate = true;
}

function applyIceMaterial(material) {
  if (!material || material.userData.shader01 || material.userData.keepTexture || material.userData.pearl || material.userData.chrome) return;
  rememberTeaserMaterial(material);
  material.color.setHex(ICE_MATTE);
  if (material.emissive) {
    material.emissive.setHex(0x000000);
    material.emissiveIntensity = 0;
  }
  if (material.userData.litEmissive != null) material.userData.litEmissive = 0;
  material.metalness = 0;
  material.roughness = 1;
  material.envMapIntensity = 0.22;
  material.flatShading = false;
  material.needsUpdate = true;
}

function applyIceMaterials(root) {
  if (!root || root.userData.iceKind === 'view') return;
  root.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    for (const material of materialsOf(node)) applyIceMaterial(material);
  });
}

function registerIceRoot(root, kind) {
  if (!root) return;
  root.userData.iceKind = kind;
  if (!root.userData.teaserReady) {
    root.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      for (const material of materialsOf(node)) rememberTeaserMaterial(material);
    });
    root.userData.teaserReady = true;
  }
  iceRoots.add(root);
}

function restoreIceRoot(root) {
  const view = root.userData.iceKind === 'view';
  const welded = view ? VIEW_APPLE.shadeSmooth === true : false;
  applyShadeSmooth(root, welded);
  root.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    for (const material of materialsOf(node)) {
      restoreTeaserMaterial(material);
      if (view && !material.userData.shader01) {
        material.flatShading = !welded;
        material.needsUpdate = true;
      }
    }
  });
}

function syncIceTheme() {
  // Key 2 changes the blue UI and the per-object lights only.
  // Meshes and shaders follow the L-panel tab.
}

function iceMaterialReport() {
  const rows = [];
  for (const root of iceRoots) {
    root.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const material = materialsOf(node)[0];
      if (!material || !material.color) return;
      rows.push({
        kind: root.userData.iceKind || '',
        name: material.name || node.name || '',
        color: material.color.getHexString(),
        metalness: material.metalness,
        roughness: material.roughness,
        flatShading: !!material.flatShading,
        verts: node.geometry && node.geometry.attributes.position ? node.geometry.attributes.position.count : 0,
      });
    });
  }
  return { theme: document.documentElement.dataset.theme || '0', rows };
}

function mountViewportApple() {
  if (VIEW_APPLE.xPx == null) VIEW_APPLE.xPx = Math.round(innerWidth * 0.5);
  if (VIEW_APPLE.topPx == null) VIEW_APPLE.topPx = 0;
  if (!CORNER_APPLE_ON) return;

  const host = document.createElement('div');
  host.className = 'apple-view';
  host.setAttribute('aria-hidden', 'true');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.domElement.style.pointerEvents = 'none';
  host.appendChild(renderer.domElement);
  document.body.appendChild(host);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 40);
  camera.position.set(0, 8, 0);
  camera.up.set(0, 0, -1);
  camera.lookAt(0, 0, 0);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const fill = new THREE.AmbientLight(0xffffff, 0.62);
  scene.add(fill);
  const key = new THREE.DirectionalLight(0xfff7f2, VIEW_APPLE.intensity);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.00015;
  key.shadow.normalBias = 0.004;
  key.shadow.radius = VIEW_APPLE.shadowRadius;
  scene.add(key, key.target);

  const groundMat = new THREE.ShadowMaterial({ color: 0x000000, opacity: VIEW_APPLE.shadowDark });
  groundMat.depthWrite = false;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  ground.renderOrder = 1;
  scene.add(ground);

  const tilt = new THREE.Group();
  tilt.rotation.order = 'XYZ';
  scene.add(tilt);
  const viewXform = new THREE.Group();
  viewXform.name = 'view-xform';
  viewXform.rotation.order = 'XYZ';
  tilt.add(viewXform);

  let alive = true;
  let appleModel = null;
  let appleFile = PLAIN_APPLE_FILE;
  let xInput = null;
  let topInput = null;
  let sizeInput = null;
  let shadeInput = null;
  let enterXInput = null;
  let enterTopInput = null;
  let enterRotXInput = null;
  let enterRotYInput = null;
  let enterRotZInput = null;

  // Mobile pose is locked on the 375 artboard. Screen pixels scale with
  // viewport width, the same ratio as .mob --k. Vertical position is
  // 18 design px from the top, so viewport height does not move it.
  // Desktop pose is only above 440px. Rotation is shared and does not scale.
  // At the open 1728px frame the apple anchor is x=1513, top=5. Column 12
  // of the stretch grid (margin 12, gutter 12) starts 72px to the right,
  // so the into-column offset is negative on the 1440 column-width scale.
  // Gutters stay 12px, and that offset still scales with the column width.
  const MOBILE_BOARD = 375;
  const DESK_GRID_MARGIN = 12;
  const DESK_GRID_GUTTER = 12;
  const DESK_GRID_COLS = 12;
  const DESK_APPLE_COL = 11;
  const DESK_COL_AT_1440 = (1440 - 2 * DESK_GRID_MARGIN - 11 * DESK_GRID_GUTTER) / DESK_GRID_COLS;
  const DESK_APPLE_REF_W = 1728;
  function desktopColumnWidth(width) {
    return (width - 2 * DESK_GRID_MARGIN - (DESK_GRID_COLS - 1) * DESK_GRID_GUTTER) / DESK_GRID_COLS;
  }
  const DESK_APPLE_INTO_COL = (1513
    - DESK_GRID_MARGIN
    - DESK_APPLE_COL * (desktopColumnWidth(DESK_APPLE_REF_W) + DESK_GRID_GUTTER))
    * DESK_COL_AT_1440 / desktopColumnWidth(DESK_APPLE_REF_W);
  function desktopAppleX(width) {
    const col = desktopColumnWidth(width);
    const into = DESK_APPLE_INTO_COL * (col / DESK_COL_AT_1440);

  function isTyping(event) {
    const el = event.target;
    if (!(el instanceof HTMLElement)) return false;
    if (el.isContentEditable) return true;
    const tag = el.tagName;
    if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (tag !== 'INPUT') return false;
    const type = (el.type || 'text').toLowerCase();
    return !['range', 'checkbox', 'radio', 'button', 'submit', 'reset', 'color', 'file'].includes(type);
  }
  function onKey(event) {
    if (event.repeat) return;

    if (event.code === 'Escape') {
      if (panel.hidden) return;
      const el = event.target;
      const easeSelect = el instanceof HTMLSelectElement && panel.contains(el);
      if (!isTyping(event) || easeSelect) setOpen(false);
      return;
    }
    if (isTyping(event)) return;
    if (event.code !== 'KeyL') return;
    event.preventDefault();
    togglePanel();
  }

  function dressViewportApple(fitted) {
    fitted.traverse((node) => {
      if (!node.isMesh) return;
      node.castShadow = true;
      node.receiveShadow = false;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) if (material) material.shadowSide = THREE.DoubleSide;
    });
  }

  function disposeViewFitted(root) {
    root.traverse((node) => {
      if (!node.isMesh) return;
      const smooth = node.userData.smoothGeometry;
      const flat = node.userData.flatGeometry;
      if (smooth && smooth !== flat) smooth.dispose();
      if (!node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) if (material) material.dispose();
    });
  }

  let viewGeneration = 0;
  function viewAppleTurn(model) {
    let turn = null;
    for (let i = 0; i < model.children.length; i++) {
      if (model.children[i].name === 'apple-turn') turn = model.children[i];
    }
    if (!turn) {
      turn = new THREE.Group();
      turn.name = 'apple-turn';
      turn.rotation.order = 'XYZ';
      const extras = [];
      for (let i = 0; i < model.children.length; i++) extras.push(model.children[i]);
      model.add(turn);
      for (let i = 0; i < extras.length; i++) turn.add(extras[i]);
    }
    return turn;
  }
  function applyCornerAppleXform() {
    const d = Math.PI / 180;
    viewXform.rotation.order = 'XYZ';
    viewXform.rotation.set(
      viewAppleXform.x * d,
      viewAppleXform.y * d,
      viewAppleXform.z * d,
    );
    const s = viewAppleXform.scale;
    viewXform.scale.set(s, s, s);
  }
  refreshViewAppleXform = applyCornerAppleXform;
  function applyViewAppleTurn() {
    if (!appleModel) return;
    const turn = viewAppleTurn(appleModel);
    const file = turn.userData.appleFile;
    const pose = detailAppleTurn({ apple: file });
    const tabId = currentModelTab().id;
    // Tabs 01 and plane share apple_whole_01.glb. Both get DETAIL_APPLE_TURN
    // plus TAB01_APPLE_OFFSET. low, detail, and mat do not.
    const tab01 = file === TAB01_APPLE_FILE && (tabId === '01' || tabId === 'plane');
    const d = Math.PI / 180;
    turn.rotation.order = 'XYZ';
    turn.rotation.set(
      pose ? pose.x * d : 0,
      ((pose ? pose.y : 0) + (tab01 ? TAB01_APPLE_OFFSET.y : 0)) * d,
      pose ? pose.z * d : 0,
    );
    const scale = (pose ? pose.scale : 1) * (tab01 ? TAB01_APPLE_OFFSET.scale : 1);
    turn.scale.set(scale, scale, scale);

  function syncViewportApple() {
    const generation = ++viewGeneration;
    const tab = currentModelTab();
    const tabId = tab.id;
    const url = tab.apple;
    loadGltf(url).then((gltf) => {
      if (!alive || generation !== viewGeneration || !gltf || currentModelTab().id !== tabId) return;
      if (tab.look === 'teaser') {
        VIEW_APPLE.shadeSmooth = true;
        if (shadeInput) shadeInput.checked = true;
      }
      const fitted = prepareApple(gltf);
      dressViewportApple(fitted);
      if (!appleModel) {
        appleModel = new THREE.Group();
        viewXform.add(appleModel);
        host.classList.add('apple-shown');
        registerIceRoot(tilt, 'view');
      }
      const turn = viewAppleTurn(appleModel);
      const prev = turn.children.slice();
      for (let i = 0; i < prev.length; i++) turn.remove(prev[i]);
      turn.add(fitted);
      for (let i = 0; i < prev.length; i++) disposeViewFitted(prev[i]);
      turn.userData.appleFile = url;
