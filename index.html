<link rel="icon" href="design/stub/favicon-32.png" type="image/png" sizes="32x32">

<style>
  /* Кадр 1440×800. --k переводит его пиксели во вьюпорт.
     Хедер и палитра — классический тизер (vanok-teaser/index.html): один синий вордмарк в 12px от верха. */
  :root {
    --bg: #E9E9E9;
    --board-bg: #d7d7d7;
    --blue: #0A1AE9;
    --blue-fill: #0A1AE9;
    --blue-on: #e1e1e1;
    --grotesk: Arial, "Helvetica Neue", Helvetica, sans-serif;
    --k: calc(100vw / 1440);
    --u: calc(100vh / 800);
    --vv-lift: 0px;
    --step-pct: 100;
    --tread-depth: 288;
    --shaft-perspective: 1100;
    --step-shade: 0;
  }
  html[data-theme="1"] {
    --blue: #8A7E59;
    --bg: hsl(303.8182deg 100% 78.4314%);
  }
  html[data-theme="2"] {
    --blue: #E3F4E8;
    --bg: linear-gradient(180deg, #A59D90 0%, #02DD67 100%);
  }
  html[data-theme="3"] {
    --blue: #ffffff;
    --bg: #80a6bc;
  }
  html[data-theme="3"] .chrome .site-credits {
    color: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; background: var(--bg) fixed; }

  body {
    color: var(--blue);
    font-family: var(--grotesk);
    -webkit-font-smoothing: antialiased;
  }

  /* Холст живёт всё время: смена hash не пересоздаёт WebGL. */
  #stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  #app { position: relative; z-index: 2; }

  /* Classic teaser header. Desktop wordmark is one blue mark, 12px from the top.
     The script mark can leave .chrome and ride in .lettering-ride; the grid vars stay shared. */
  .chrome,
  .lettering-ride {
    --hk: calc(100vw / 1440);
    --grid-margin: 12px;
    --grid-gutter: 12px;
    --col: calc((100vw - 2 * var(--grid-margin) - 11 * var(--grid-gutter)) / 12);
    --letter-w: calc(6 * var(--col) + 5 * var(--grid-gutter));
    --letter-left: calc(var(--grid-margin) + 6 * (var(--col) + var(--grid-gutter)));
    --wordmark-top: calc(6 * var(--hk));
  }
  .chrome {
    position: relative;
    z-index: 5;
    height: calc(12px + var(--letter-w) * 233 / 702);
    color: var(--blue);
    pointer-events: none;
  }
  .chrome .crosshair,
  .chrome .ig-link,
  .chrome .catalog-entry,
  .chrome .site-credits,
  .chrome .soon { pointer-events: auto; }
  body[data-route="board"] .chrome {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    margin-bottom: 0;
  }
  .chrome > * { position: absolute; }
  .chrome p { margin: 0; }
  .chrome img { display: block; max-width: none; }
  :is(.chrome, .lettering-ride) .vanok,
  :is(.chrome, .lettering-ride) .regular,
  :is(.chrome, .lettering-ride) .lettering { display: none; }
  html[data-theme="1"] :is(.chrome, .lettering-ride) .lettering-1,
  html[data-theme="2"] :is(.chrome, .lettering-ride) .lettering-2,
  html[data-theme="3"] :is(.chrome, .lettering-ride) .lettering-3 { display: block; }
  html[data-theme="1"] :is(.chrome, .lettering-ride) .wordmark,
  html[data-theme="2"] :is(.chrome, .lettering-ride) .wordmark,
  html[data-theme="3"] :is(.chrome, .lettering-ride) .wordmark { display: none; }

  .chrome .crosshair,
  .chrome .catalog-entry {
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    cursor: pointer;
  }
  .chrome .crosshair {
    z-index: 9;
    left: calc(11.06 * var(--hk));
    top: calc(11.23 * var(--hk));
    width: calc(21.535 * var(--hk));
    height: calc(21.535 * var(--hk));
    line-height: 0;
  }
  .chrome .crosshair svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .chrome .bio,
  .chrome .soon {
    font-size: calc(14 * var(--hk));
    line-height: normal;
    white-space: nowrap;
  }
  .chrome .bio {
    left: calc(var(--grid-margin) + var(--col) + var(--grid-gutter));
    top: calc(12 * var(--hk));
    line-height: calc(16 * var(--hk));
  }
  .chrome .soon {
    top: calc(12 * var(--hk));
    right: var(--grid-margin);
    color: inherit;
    text-decoration: none;
  }
  .chrome .ig-link,
  .chrome .catalog-entry {
    z-index: 3;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    line-height: normal;
    text-decoration-line: underline;
    text-decoration-thickness: from-font;
    text-underline-position: from-font;
    white-space: nowrap;
    cursor: pointer;
    top: calc(12 * var(--hk));
    font-size: calc(14 * var(--hk));
  }
  .chrome .ig-link { left: var(--letter-left); }
  .chrome .catalog-entry {
    left: calc(var(--grid-margin) + 9 * (var(--col) + var(--grid-gutter)));
  }
  :is(.chrome, .lettering-ride) .wordmark {
    left: var(--letter-left);
    top: 12px;
    width: var(--letter-w);
    height: calc(var(--letter-w) * 233 / 702);
  }
  /* Board moves the script into .lettering-ride so it translates with the steps. */
  .lettering-ride {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }
  .lettering-ride > * { position: absolute; }
  .lettering-ride img { display: block; max-width: none; }
  :is(.chrome, .lettering-ride) .lettering-1,
  :is(.chrome, .lettering-ride) .lettering-2,
  :is(.chrome, .lettering-ride) .lettering-3 {
    left: var(--letter-left);
    width: var(--letter-w);
  }
  :is(.chrome, .lettering-ride) .lettering-1 {
    top: calc(var(--wordmark-top) + 23px);
    height: calc(var(--letter-w) * 135 / 619);
  }
  :is(.chrome, .lettering-ride) .lettering-2 {
    top: calc(var(--wordmark-top) + 32px);
    height: calc(var(--letter-w) * 82 / 702);
  }
  :is(.chrome, .lettering-ride) .lettering-3 {
    top: calc(var(--wordmark-top) + 12px);
    height: calc(var(--letter-w) * 124 / 702);
  }
  .chrome .site-credits {
    z-index: 4;
    position: fixed;
    right: 12px;
    bottom: 12px;
    margin: 0;
    color: var(--blue);
    font-family: var(--grotesk);
    font-weight: 400;
    font-size: calc(14 * var(--hk));
    line-height: normal;
    text-decoration: none;
    white-space: nowrap;
    writing-mode: vertical-rl;
    cursor: pointer;
    opacity: 0.32;
  }
  .chrome .site-credits .credits-name {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    visibility: hidden;
  }
  @media (hover: hover) {
    .chrome .ig-link,
    .chrome .catalog-entry { transition: opacity 180ms ease; }
    .chrome .ig-link:hover,
    .chrome .catalog-entry:hover { opacity: 0.8; }
    .chrome .site-credits:hover .credits-full { visibility: hidden; }
    .chrome .site-credits:hover .credits-name { visibility: visible; }
  }
  @media (max-width: 440px) {
    .chrome,
    .lettering-ride {
      --hk: calc(100vw / 375);
      --wordmark-top: calc(58 * var(--hk) + 24px);
    }
    .chrome {
      height: calc(var(--wordmark-top) + 110 * var(--hk));
    }
      :is(.chrome, .lettering-ride) .wordmark,
    .chrome .catalog-entry,
    .chrome .site-credits { display: none; }
    :is(.chrome, .lettering-ride) .vanok,
    :is(.chrome, .lettering-ride) .regular { display: block; }
    html[data-theme="1"] :is(.chrome, .lettering-ride) .vanok,
    html[data-theme="1"] :is(.chrome, .lettering-ride) .regular,
    html[data-theme="2"] :is(.chrome, .lettering-ride) .vanok,
    html[data-theme="2"] :is(.chrome, .lettering-ride) .regular,
    html[data-theme="3"] :is(.chrome, .lettering-ride) .vanok,
    html[data-theme="3"] :is(.chrome, .lettering-ride) .regular { display: none; }
    .chrome .crosshair {
      left: calc(23.231 * var(--hk));
      top: calc(23.231 * var(--hk));
    }
    .chrome .bio {
      left: calc(194 * var(--hk));
      top: calc(16 * var(--hk));
      width: calc(157 * var(--hk));
      font-size: calc(12 * var(--hk));
      line-height: calc(14 * var(--hk));
      white-space: normal;
    }
    .chrome .soon {
      position: fixed;
      z-index: 6;
      top: auto;
      right: calc(24 * var(--hk));
      bottom: calc(24 * var(--hk) + var(--vv-lift));
      height: calc(14 * var(--hk));
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: calc(12 * var(--hk));
      line-height: calc(14 * var(--hk));
    }
    .chrome .ig-link {
      position: fixed;
      z-index: 6;
      left: calc(24 * var(--hk));
      top: auto;
      bottom: calc(24 * var(--hk) + var(--vv-lift));
      height: calc(14 * var(--hk));
      display: flex;
      align-items: center;
      font-size: calc(12 * var(--hk));
      line-height: calc(14 * var(--hk));
    }
    :is(.chrome, .lettering-ride) .vanok {
      left: calc(24 * var(--hk));
      top: var(--wordmark-top);
      width: calc(156.387 * var(--hk));
      height: calc(108.538 * var(--hk));
    }
    :is(.chrome, .lettering-ride) .regular {
      left: calc(136.341 * var(--hk));
      top: calc(var(--wordmark-top) + (93.593 - 77) * var(--hk));
      width: calc(214.658 * var(--hk));
      height: calc(90.339 * var(--hk));
    }
    :is(.chrome, .lettering-ride) .lettering-1,
    :is(.chrome, .lettering-ride) .lettering-2,
    :is(.chrome, .lettering-ride) .lettering-3 {
      left: calc(24 * var(--hk));
      top: var(--wordmark-top);
      width: calc(327 * var(--hk));
    }
    :is(.chrome, .lettering-ride) .lettering-1 { height: calc(71.32 * var(--hk)); }
    :is(.chrome, .lettering-ride) .lettering-2 { height: calc(327 * var(--hk) * 82 / 702); }
    :is(.chrome, .lettering-ride) .lettering-3 { height: calc(327 * var(--hk) * 124 / 702); }
  }

  .sheet {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: calc(18 * var(--k));
    padding: 0 0 14vh calc(72 * var(--k));
  }

  .sheet h2 {
    margin: 0;
    font-size: clamp(18px, calc(24 * var(--k)), 24px);
    font-weight: 400;
    max-width: 22ch;
  }

  .sheet p {
    margin: 0;
    font-size: clamp(13px, calc(16 * var(--k)), 16px);
    max-width: 34ch;
  }

  .index-list { margin: 0; padding: 0; list-style: none; max-width: calc(560 * var(--k)); }
  .index-list li {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    padding: calc(14 * var(--k)) 0;
    border-top: 1px solid color-mix(in srgb, var(--blue) 35%, transparent);
    font-size: clamp(13px, calc(16 * var(--k)), 16px);
  }
  .index-list li:last-child { border-bottom: 1px solid color-mix(in srgb, var(--blue) 35%, transparent); }

  .pill {
    align-self: flex-start;
    background: var(--blue-fill);
    color: var(--blue-on);
    border-radius: calc(30 * var(--k));
    padding: calc(12 * var(--k)) calc(16 * var(--k));
    font-size: clamp(14px, calc(18 * var(--k)), 18px);
    text-decoration: none;
  }

  .case {
    max-width: calc(520 * var(--k));
    margin: calc(12 * var(--k)) 0 0 calc(72 * var(--k));
    display: flex;
    flex-direction: column;
    gap: calc(14 * var(--k));
  }
  .case h2 { margin: 0; font-size: calc(16 * var(--k)); font-weight: 400; }
  .case p { margin: 0; font-size: calc(16 * var(--k)); max-width: 36ch; }

  .tiles {
    display: grid;
    grid-template-columns: 1.15fr 0.55fr 0.85fr;
    gap: calc(16 * var(--k));
    padding: calc(28 * var(--k)) calc(48 * var(--k)) calc(48 * var(--k));
  }
  .tile {
    height: calc(240 * var(--k));
    border: 1px solid color-mix(in srgb, var(--blue) 28%, transparent);
    background: rgba(255, 255, 255, 0.16);
  }
  .tile.wide { height: calc(300 * var(--k)); }

  .about-block {
    max-width: calc(420 * var(--k));
    margin: calc(48 * var(--k)) 0 0 calc(72 * var(--k));
    display: flex;
    flex-direction: column;
    gap: calc(16 * var(--k));
  }
  .about-block h2 { margin: 0; font-weight: 400; font-size: calc(24 * var(--k)); }
  .about-block p { margin: 0; font-size: calc(16 * var(--k)); max-width: 34ch; }
  .quiet {
    margin: calc(48 * var(--k)) 0 0 calc(72 * var(--k));
    font-size: calc(14 * var(--k));
  }
  .quiet a { color: var(--blue); }

  /* Маршрут #/board: колонка кадра 15:1144.
     Каждая полоса 4087×800 листается горизонтально, страница — вертикально. */
  html:has(body[data-route="board"]),
  body[data-route="board"] {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #E9E9E9;
    overscroll-behavior: none;
  }
  body[data-route="board"] {
    --u: var(--k);
    background: #E9E9E9;
  }
  body[data-route="board"] #stage {
    visibility: hidden;
    pointer-events: none;
  }

  .reel {
    position: relative;
    z-index: 2;
    padding: 0;
  }

  .reel .case {
    max-width: none;
    width: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: calc(6 * var(--k));
  }
  .reel .signoff { margin-top: 0; }

  .escalator {
    position: relative;
    --scene-unit: var(--k);
    --scene-height: calc(800 * var(--scene-unit));
    width: 100%;
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #E9E9E9;
    touch-action: none;
    perspective: calc(var(--shaft-perspective) * var(--scene-unit));
    perspective-origin: 50% calc(50% - .26 * var(--scene-height));
  }
  .escalator-stage {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform-origin: 50% calc(50% - .04 * var(--scene-height));
    transform: translateZ(0px) scale(1.2);
  }
  .escalator-track {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }
  /* Shared design coordinates. See docs/responsive-layout.md. */
  .reel .escalator .case {
    --step-h: calc(var(--scene-height) * var(--step-pct) / 100);
    --riser-w: calc(var(--step-h) * 1440 / 800);
    position: relative;
    height: var(--step-h);
    gap: 0;
    background: transparent;
    transform-style: preserve-3d;
  }
  .step-rig {
    --rib-pitch: 8px;
    position: absolute;
    inset: 0;
    overflow: visible;
    transform-style: preserve-3d;
  }
  .step-riser {
    position: absolute;
    top: 0;
    left: calc(50% - var(--riser-w) / 2);
    width: var(--riser-w);
    height: var(--step-h);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #c4c4c4;
  }
  .step-slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  html[data-page-theme="1"] .step-riser { background: var(--original-step-color, #c4c4c4); }
  html[data-page-theme="1"] .step-tread { background-color: color-mix(in srgb, var(--original-step-color, #c4c4c4) 86%, black); }
  html[data-page-theme="2"] .step-riser { background: var(--screen-color); }
  html[data-page-theme="2"] .step-tread {
    background: color-mix(in srgb, var(--screen-color) 86%, black);
  }
  html[data-page-theme="2"] .step-nose {
    background: color-mix(in srgb, var(--screen-color) 70%, black);
  }
  html[data-page-theme="2"] .escalator .case-meta { color: #222; }
  html[data-separate-tread="true"] .step-tread {
    background-color: var(--tread-colour) !important;
    background-image: none !important;
  }
  html[data-separate-tread="true"][data-baked="true"] .step-tread {
    background-image: url('design/steps/rib-escalator-10.png') !important;
    background-size: calc(8 * var(--scene-unit)) calc(32 * var(--scene-unit));
  }
  .screen-palette { display: flex; gap: 6px; margin-top: 10px; }
  .screen-palette i { height: 20px; flex: 1; border: 1px solid #888; }
  /* Ribs live on the metal beneath the transparent artwork. */
  .step-riser { isolation: isolate; }
  html[data-baked="true"] .step-riser::before,
  html[data-baked="true"] .step-riser::after,
  html[data-baked="true"] .step-tread::before { display: none; }
  html[data-baked="true"] .step-tread {
    background-image: var(--baked-tread);
    background-repeat: repeat;
    background-size: calc(8 * var(--scene-unit)) calc(32 * var(--scene-unit));
  }
  .step-tread::before { opacity: var(--rib-strength, 1); }
  .step-riser::before, .step-tread::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: var(--rib-texture); background-size: calc(var(--rib-width, 8) * var(--scene-unit)) calc(32 * var(--scene-unit)); opacity: var(--rib-strength, 1);
  }
  .step-slide { z-index: 1; }
  .step-riser::after {
    content: ''; position: absolute; inset: 0; z-index: 1;
    pointer-events: none; background: var(--rib-texture); background-size: calc(var(--rib-width, 8) * var(--scene-unit)) calc(32 * var(--scene-unit));
    opacity: var(--rib-over-art, 0);
  }
  .stamp-panel { overscroll-behavior: contain; touch-action: pan-y; }
  .stamp-panel.escalator-controls { width: min(390px, calc(100vw - 32px)); }
  .escalator-controls fieldset { border: 0; border-top: 1px solid #aaa; padding: 16px 0; margin: 12px 0 0; min-width: 0; }
  .escalator-controls legend { font-size: 14px; padding: 0 8px 0 0; }
  .rib-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rib-option { display: flex; align-items: start; gap: 7px; padding: 10px; border: 1px solid #aaa; cursor: pointer; }
  .rib-option:has(input:checked) { border-color: var(--blue); background: #e9e9e9; }
  .rib-option input { margin: 2px 0; accent-color: var(--blue); }
  .rib-option small { display: block; margin-top: 4px; color: #555; }
  .escalator-controls .close { position: sticky; top: 0; float: right; background: #d7d7d7; z-index: 2; padding: 6px; }
  .stamp-teaser { width: 100%; height: 100%; border: 0; display: block; }
  .step-tread {
    --fold: 0;
    position: absolute;
    left: calc(50% - var(--riser-w) / 2);
    top: 0;
    width: var(--riser-w);
    height: calc(var(--tread-depth) * var(--scene-unit));
    transform-origin: center top;
    transform: rotateX(-90deg);
    background: #adadad;
  }
  .step-boot-prints {
    position: absolute;
    top: var(--boot-prints-depth, 50%);
    left: var(--boot-prints-x, 50%);
    width: min(calc(150 * var(--scene-unit)), 22%);
    height: 84%;
    object-fit: contain;
    transform: translate(-50%, -50%) scale(var(--boot-prints-scale, 1));
    opacity: .68;
    pointer-events: none;
  }
  .step-tread:has(.step-boot-prints) { overflow: hidden; }
  .step-nose {
    position: absolute;
    left: calc(50% - var(--riser-w) / 2);
    top: 0;
    width: var(--riser-w);
    height: 2px;
    background: #969696;
    transform: translateZ(1px);
    pointer-events: none;
  }
  .escalator .case-meta {
    position: absolute;
    z-index: 2;
    left: 16px;
    top: 18px;
    margin: 0;

    max-width: none;

    line-height: 1.2;
    white-space: nowrap;
    pointer-events: none;
  }
  .reel .case-meta {
    display: flex;
    gap: calc(12 * var(--k));
    align-items: center;
    margin: 0;
    max-width: none;
    height: calc(16 * var(--k));
    font-size: calc(14 * var(--k));
    line-height: normal;
    color: var(--blue);
    white-space: nowrap;
  }
  .case-meta span:nth-child(1) { width: calc(107 * var(--k)); flex: none; }
  .case-meta span:nth-child(2) { width: calc(583 * var(--k)); flex: none; }
  .case-meta span:nth-child(3) { width: calc(464 * var(--k)); flex: none; }
  .case-meta .full {
    width: calc(226 * var(--k));
    flex: none;
    text-decoration: underline dotted;
    text-underline-offset: 0.15em;
    cursor: pointer;
  }
  .reel .escalator .case-meta {
    position: absolute;
    z-index: 2;

  }

  const videos = new IntersectionObserver(entries => {
    for (const {target, isIntersecting} of entries) {
      if (isIntersecting) {
        if (!target.src) target.src = target.dataset.src;
        target.play().catch(() => {});
      } else target.pause();
    }
  }, { threshold: 0.05 });
  covers.forEach(cover => cover.querySelectorAll('video[data-src]').forEach(video => videos.observe(video)));

  const load = cover => {
    cover.querySelectorAll('img[data-src]').forEach(img => {
      img.src = img.dataset.src;
      img.removeAttribute('data-src');
    });
  };
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) if (entry.isIntersecting) {
      load(entry.target);
      observer.unobserve(entry.target);
    }
  }, { rootMargin: '150% 0px' });
  covers.forEach((cover, index) => index < 2 ? load(cover) : observer.observe(cover));
  return () => {
    for (const entry of hoverTargets) entry.hide();
    observer.disconnect();
    videos.disconnect();
    window.removeEventListener('pointermove', onHover, true);
    document.documentElement.removeEventListener('pointerleave', clearHover);
    delete root.dataset.previewHover;
  };
}


const ROUTE_DIALOGS = {
  index: ['Index', 'Everything I’ve made throughout my career will be here'],

const routeDialog = document.createElement('dialog');

</header>
<div class="route-dialog-copy">

document.body.append(routeDialog);
const routeStampFrames = new Map();

function showRouteStamps(name) {

routeDialog.querySelector('button').addEventListener('click', closeRouteDialog);

addEventListener('message', event => {

function parseRoute() {

const mobileTemplate = () => `

      </section>
    </div>
  </div>
`;

const DESIGN_W = 1440;
const MOBILE_DESIGN_W = 375;
const DESIGN_H = 800;
let introScrollProgress = 0;
const STRIP_SPEED = 60;
const scrollSnap = { scope: 'all', strength: 40, distance: 50, offset: 0 };
function escalatorTouchBlocked(target) {
  return target instanceof Element && !!target.closest(
    'a, button, input, textarea, select, summary, label, .sig-modal, .stamp-panel'
  );
}

// Shift+wheel stays on the page helper and does not drive the escalator.
function wheelScrollsPage(event) {
  if (event.target instanceof Element && event.target.closest('.stamp-panel, .sig-modal')) return false;
  if (event.shiftKey) return false;
  return Math.abs(event.deltaY) > 0;
}

function mountEscalator(root, settings, mobile = false) {
  const viewport = root.querySelector('.escalator');
  const track = viewport && viewport.querySelector('.escalator-track');
  const stage = viewport && viewport.querySelector('.escalator-stage');
  const signoff = viewport && viewport.querySelector('.signoff');
  if (!track) return () => {};
  const chrome = document.querySelector('.chrome');
  const ride = document.createElement('div');
  ride.className = 'lettering-ride';
  const marks = chrome && !mobile
    ? [...chrome.querySelectorAll(':scope > .intro-script')]
    : [];
  const markAnchor = chrome && chrome.querySelector('.crosshair');
  marks.forEach((node) => ride.appendChild(node));
  viewport.appendChild(ride);
  const originals = [...track.children].filter((el) => el.classList.contains('case'));
  const caseBackgrounds = originals.map(step => step.querySelector('.case-cover-background, .mobile-case-background'));
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let alive = true;
  let y = 0;
  const designWidth = mobile ? MOBILE_DESIGN_W : DESIGN_W;
  let unit = 1;
  let last = performance.now();
  let held = null;
  const dragSamples = [];
  let velocity = 0;
  let coasting = false;
  const wheelSamples = [];
  let lastWheelAt = 0;
  let wheelLive = false;
  let firstCaseY = Infinity;
  let snapPoints = [];
  let escalatorStarted = false;

  function syncLettering() {
    const zoom = Number(settings.scale) || 1;
    const near = Number(settings.near) || 0;
    const persp = Number(settings.perspective) || 1100;
    const denom = persp - near;
    const project = denom > 16 ? persp / denom : 1;
    const headerShift = -y * zoom * project;
    if (mobile) chrome.style.setProperty('--mobile-intro-y', `${headerShift}px`);
    else ride.style.transform = `translate3d(0, ${headerShift}px, 0)`;
    const introDistance = Math.max(120 * unit, viewport.clientHeight * .5 - 55 * unit);
    introScrollProgress = Math.max(0, Math.min(2, -headerShift / introDistance));
    document.documentElement.style.setProperty('--intro-header-top', `${Math.max(0, introDistance + headerShift)}px`);
    if (signoff) {
      const remaining = Math.max(0, range().max - y);
      const lastRiser = originals[originals.length - 1]?.querySelector('.step-riser');
      const edge = lastRiser && remaining * zoom * project < viewport.clientHeight * 2
        ? lastRiser.getBoundingClientRect().bottom - viewport.getBoundingClientRect().top
        : viewport.clientHeight;
      const top = remaining === 0 ? 0 : Math.max(0, Math.min(viewport.clientHeight, edge));
      const frame = signoff.querySelector('iframe');
      if (frame && !frame.hasAttribute('src') && remaining * zoom * project < viewport.clientHeight * 2) {
        frame.src = frame.dataset.src;
      }
      signoff.style.transform = `translate3d(0, ${top}px, 0)`;
      signoff.inert = top >= viewport.clientHeight;
    }
  }

  function restoreLettering() {
    document.documentElement.style.removeProperty('--header-shift');
    if (chrome) marks.forEach((node) => chrome.insertBefore(node, markAnchor));
    ride.remove();
    if (mobile) chrome.style.removeProperty('--mobile-intro-y');
  }

  const WHEEL_GAIN = 1;
  const INERTIA_TAU = 0.28;
  const INERTIA_STOP = 18;
  const INERTIA_V_CAP = 1600;
  const SAMPLE_MS = 100;
  const WHEEL_GAP_MS = 70;
  function noteManualScroll(delta) {
    if (delta !== 0) escalatorStarted = y >= firstCaseY - 1;
  }

  function resistManualScroll(delta) {
    if (!delta || scrollSnap.scope === 'off' || !scrollSnap.strength || motion.matches) return delta;
    const radius = DESIGN_H * unit * scrollSnap.distance / 100;
    if (radius <= 0) return delta;

    // Integrate a triangular slowdown along the gesture, even when one wheel
    // event crosses the center. The result always follows the input direction.
    const areaTo = distance => {
      const inside = Math.min(Math.abs(distance), radius);
      return Math.sign(distance) * inside * (1 - inside / (2 * radius));
    };
    let resistance = 0;
    const count = scrollSnap.scope === 'intro' ? Math.min(1, snapPoints.length) : snapPoints.length;
    for (let i = 0; i < count; i++) {
      const start = y - snapPoints[i];
      const area = Math.abs(areaTo(start + delta) - areaTo(start));
      resistance = Math.max(resistance, area);
    }
    const strength = scrollSnap.strength / 100 * .85;
    return delta - Math.sign(delta) * resistance * strength;
  }

  function placeLead() {
    const zoom = Number(settings.scale) || 1;
    const target = viewport.clientHeight * settings.introStairsY / 100;
    const savedY = y;
    y = 0;
    track.style.transform = 'translate3d(0, 0, 0)';
    let pad = target;
    track.style.paddingTop = pad + 'px';
    const riser = originals[0] && originals[0].querySelector('.step-riser');
    if (riser) {
      placeStage();
      for (let i = 0; i < 6; i++) {
        articulate();
        const visual = riser.getBoundingClientRect().top - viewport.getBoundingClientRect().top;
        const error = target - visual;
        if (Math.abs(error) < 1.5 * unit) break;
        pad = Math.max(0, pad + error / zoom);
        track.style.paddingTop = pad + 'px';
      }
    }
    y = savedY;
    applyDelta(0);
    track.style.transform = `translate3d(0, ${-y}px, 0)`;
    articulate();
    syncLettering();
  }

  function range() {
    const lastStep = originals[originals.length - 1];
    if (!lastStep) return { min: 0, max: 0 };
    const end = lastStep.offsetTop + lastStep.offsetHeight;
    return { min: 0, max: Math.max(0, end) };
  }

  function applyDelta(dy) {
    const { min, max } = range();
    const next = Math.min(max, Math.max(min, y + dy));
    const applied = next - y;
    y = next;
    return applied;
  }

  function pushSample(list, dy, now) {
    list.push({ t: now, dy });
    const cutoff = now - SAMPLE_MS;
    while (list.length && list[0].t < cutoff) list.shift();
  }

  function velocityFrom(list) {
    if (!list.length) return 0;
    const sum = list.reduce((acc, sample) => acc + sample.dy, 0);
    const span = Math.max(0.016, (list[list.length - 1].t - list[0].t) / 1000);
    const speed = sum / span;
    return Math.max(-INERTIA_V_CAP * unit, Math.min(INERTIA_V_CAP * unit, speed));
  }

  function armCoast(speed) {
    const { min, max } = range();
    let next = speed;
    if ((y <= min + 0.5 && next < 0) || (y >= max - 0.5 && next > 0)) next = 0;
    velocity = next;
    coasting = Math.abs(velocity) > INERTIA_STOP * unit;
    if (!coasting) velocity = 0;
  }

    if (routeDialog.open) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (!wheelScrollsPage(event)) return;
    event.preventDefault();

    let dy = event.deltaY;

    else if (event.deltaMode === 2) dy *= viewport.clientHeight || innerHeight;
    if (event.deltaMode !== 2) dy *= unit;
    dy *= WHEEL_GAIN;
    const applied = applyDelta(resistManualScroll(dy));
    const now = performance.now();
    noteManualScroll(applied);
    coasting = false;
    const notch = event.deltaMode !== 0;
    if (notch || y < firstCaseY) {
      velocity = 0;
      wheelLive = false;
      wheelSamples.length = 0;
      return;
    }
    pushSample(wheelSamples, applied, now);
    lastWheelAt = now;
    const avg = wheelSamples.reduce((acc, sample) => acc + Math.abs(sample.dy), 0) / wheelSamples.length;
    if (wheelSamples.length >= 2 && avg < 70 * unit) {
      velocity = velocityFrom(wheelSamples);
      wheelLive = true;
    } else {

      wheelLive = false;
    }
  }

  function onTouchStart(event) {
    if (event.touches.length !== 1) return;
    const onThumbnail = mobile && event.target instanceof Element && event.target.closest('.mobile-thumb-scroll');
    if (!onThumbnail && escalatorTouchBlocked(event.target)) return;
    if (!(event.target instanceof Element) || !viewport.contains(event.target)) return;
    const t = event.touches[0];
    held = { id: t.identifier, x: t.clientX, y: t.clientY, axis: null, onThumbnail };
    dragSamples.length = 0;
    coasting = false;
    wheelLive = false;
    velocity = 0;
    wheelSamples.length = 0;
  }

  function onTouchMove(event) {
    if (!held) return;
    const t = [...event.touches].find((touch) => touch.identifier === held.id);
    if (!t) return;
    const dx = t.clientX - held.x;
    const dy = t.clientY - held.y;
    if (held.onThumbnail && !held.axis) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 6) return;
      held.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (held.axis === 'x') return;
    const onScroller = !mobile && event.target instanceof Element && !!event.target.closest('.scroller');
    if (onScroller && Math.abs(dx) > Math.abs(dy)) {
      held.x = t.clientX;
      held.y = t.clientY;
      return;
    }
    if (event.cancelable) event.preventDefault();
    const applied = applyDelta(resistManualScroll(-dy));
    pushSample(dragSamples, applied, performance.now());
    held.x = t.clientX;
    held.y = t.clientY;
    coasting = false;
    wheelLive = false;
    velocity = 0;

  }

    const frame = signoff && signoff.querySelector('iframe');
    if (!frame || event.source !== frame.contentWindow || event.origin !== location.origin) return;
    if (event.data?.type === 'vanok-scroll') {
      coasting = false; wheelLive = false; velocity = 0;
      applyDelta(Number(event.data.delta) || 0);
    }
    if (event.data?.type === 'vanok-settings') {
      dispatchEvent(new KeyboardEvent('keydown', { code: event.data.code, key: event.data.key }));
    }
  }
  addEventListener('message', onTeaserMessage);
  function onResize() {
    const nextUnit = viewport.getBoundingClientRect().width / designWidth;
    if (!nextUnit) return;
    const ratio = nextUnit / unit;
    y *= ratio;
    velocity *= ratio;
    if (ratio !== 1) {
      dragSamples.length = 0;
      wheelSamples.length = 0;
    }
    unit = nextUnit;
    viewport.style.setProperty('--scene-unit', `${unit}px`);
    if (mobile) {
      root.style.setProperty('--mobile-cover-scale', unit);
      document.body.style.setProperty('--mobile-unit', `${unit}px`);
    }

  addEventListener('vanok-intro-layout', onResize);
  addEventListener('resize', onResize);
  addEventListener('wheel', onWheel, { passive: false });
  addEventListener('touchstart', onTouchStart, { passive: true });
  addEventListener('touchmove', onTouchMove, { passive: false });
  addEventListener('touchend', onTouchEnd);
  addEventListener('touchcancel', onTouchEnd);

  function placeStage() {
    if (!stage) return;

    const zoom = Number(settings.scale) || 1;
    stage.style.transform = `translateZ(${near}px) scale(${zoom})`;
  }

  function articulate() {
    const viewH = viewport.clientHeight;
    if (viewH <= 0) return;
    const sceneH = DESIGN_H * unit;
    const recess = settings.recess * unit;
    const zoom = Number(settings.scale) || 1;
    const perspective = settings.perspective * unit;
    const near = settings.near * unit;
    const center = viewH / 2 + scrollSnap.offset * unit;
    const perspectiveY = viewH / 2 - .26 * sceneH;
    const stageY = viewH / 2 - .04 * sceneH;
    const noseY = viewH / 2 + .22 * sceneH;
    const maxDepth = Math.max(recess, unit) * 8;

    const geometry = originals.map(step => ({
      step,
      rise: parseFloat(getComputedStyle(step).height),
      offset: step.offsetTop,

      const projectionOrigin = perspectiveY - center + (mobile ? rise / 2 : 0);
      const scaleOffset = (1 - zoom) * stageY + zoom * rise / 2;
      const depthSlope = recess / Math.max(rise, .01 * sceneH);
      // Solve for the track position where the projected case face is centered.
      const flatOffset = (center + projectionOrigin * near / perspective - scaleOffset) / zoom;
      const recessedOffset = (zoom * flatOffset - projectionOrigin * depthSlope * noseY / perspective)
        / (zoom - projectionOrigin * depthSlope / perspective);
      const limit = noseY - maxDepth / (depthSlope || 1);
      const faceOffset = flatOffset >= noseY ? flatOffset : recessedOffset < limit
        ? flatOffset - projectionOrigin * maxDepth / (perspective * zoom) : recessedOffset;
      return Math.max(0, offset - faceOffset);
    });
    firstCaseY = snapPoints[0] ?? Infinity;
    const maxBackgroundZoom = Math.min(.055, 60 / Math.max(viewport.clientWidth, 1));
    for (const [index, background] of caseBackgrounds.entries()) {
      if (!background || motion.matches) continue;
      const approach = Math.max(0, Math.min(1, (snapPoints[index] - y) / (sceneH * .65)));
      const scale = (1 + maxBackgroundZoom * approach ** 2).toFixed(4);
      if (background.style.getPropertyValue('--case-bg-scale') !== scale) {
        background.style.setProperty('--case-bg-scale', scale);
      }
    }
    for (const {step, rise, offset} of geometry) {
      const depth = Math.max(-maxDepth, Math.min(0, recess * (offset - y - noseY) / Math.max(rise, .01 * sceneH)));
      const rig = step.querySelector('.step-rig');
      if (rig) {
        // Restore the projected width on mobile with the same factor on both axes.
        const projectionScale = mobile ? ` scale(${1 - depth / perspective})` : '';
        rig.style.transform = `translateZ(${depth}px)${projectionScale}`;
        const shade = Math.min(1, Math.max(0, -depth / Math.max(recess, unit)));
        rig.style.setProperty('--step-shade', shade.toFixed(3));
      }
      const tread = step.querySelector('.step-tread');
      if (!tread) continue;
      // Keep the tread perpendicular: folding it flat creates overlapping planes.
      tread.style.transform = 'rotateX(-90deg)';
    }
  }

  let lastLayout = '';
  function tick(now) {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (held) {
      // The finger already moved y one-to-one.
    } else if (wheelLive) {
      if (now - lastWheelAt > WHEEL_GAP_MS) {
        const speed = velocity;
        wheelLive = false;
        wheelSamples.length = 0;
        armCoast(speed);
      }
    } else if (coasting) {
      velocity *= Math.exp(-dt / INERTIA_TAU);
      const step = velocity * dt;
      const applied = applyDelta(step);
      if (Math.abs(applied - step) > 0.5 * unit || Math.abs(velocity) < INERTIA_STOP * unit) {
        velocity = 0;
        coasting = false;
      }
    } else if (escalatorStarted && y >= firstCaseY - 1 && !routeDialog.open && settings.autoPlay && !root.hasAttribute('data-preview-hover') && !document.querySelector('.case-cover-caption:active') && !motion.matches && !document.querySelector('.escalator-controls:not([hidden])')) {
      const { max } = range();
      if (y < max) {
        const scale = unit * designWidth / DESIGN_W;
        applyDelta(STRIP_SPEED * settings.speed * scale * dt);
      }
    }
    const layout = [y, viewport.clientWidth, viewport.clientHeight, settings.stepH,
      settings.recess, settings.tread, settings.scale, settings.near, settings.perspective, scrollSnap.offset].join('|');
    if (layout !== lastLayout) {
      track.style.transform = `translate3d(0, ${-y}px, 0)`;
      placeStage();
      articulate();
      syncLettering();
      lastLayout = layout;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  return () => {
    alive = false;
    restoreLettering();
    removeEventListener('message', onTeaserMessage);
    removeEventListener('vanok-intro-layout', onResize);
    removeEventListener('resize', onResize);
    removeEventListener('wheel', onWheel);
    removeEventListener('touchstart', onTouchStart);
    removeEventListener('touchmove', onTouchMove);
    removeEventListener('touchend', onTouchEnd);
    removeEventListener('touchcancel', onTouchEnd);
    held = null;
  };
}

let unmountStrip = null;
let mountDesktop = null;
let showDesktopApple = null;
let onDesktopRoute = null;
let desktopStartup = null;

function mountMobile(root) {
  const stopCovers = mountCaseCovers(root, true);
  const viewport = root.querySelector('.mobile-escalator');
  const settings = {
    scale: 1, near: 0, perspective: 850, introStairsY: 100, stepH: 100,
    tread: 145, recess: 130, speed: .2, autoPlay: true,
  };
  viewport.style.setProperty('--shaft-perspective', settings.perspective);
  viewport.style.setProperty('--tread-depth', String(settings.tread));
  const stopEscalator = mountEscalator(root, settings, true);
  return () => {
    stopCovers();
    stopEscalator();
  };
}

function paint(name) {
  const layout = mobileLayout.matches ? 'mobile' : 'board';
  if ((!unmountStrip || document.body.dataset.layout !== layout) && (layout === 'mobile' || mountDesktop)) {
    unmountStrip?.();
    document.body.dataset.layout = layout;
    if (layout === 'mobile') {
      app.innerHTML = mobileTemplate();
      unmountStrip = mountMobile(app);
    } else {
      app.innerHTML = desktopTemplate();
      unmountStrip = mountDesktop(app);
    }
  }
  const content = ROUTE_DIALOGS[name];
  if (!content) {
    if (routeDialog.open) routeDialog.close();
    return;
  }
  routeDialog.querySelector('h2').textContent = content[0];
  routeDialog.querySelector('p').textContent = content[1];
  showRouteStamps(name);
  if (!routeDialog.open) routeDialog.showModal();
}

let desktopTemplate = null;
function updateLayout() {
  paint(parseRoute());
  if (!mobileLayout.matches) {
    desktopStartup ||= startDesktop().catch(error => console.error('The desktop scene could not start.', error));
    showDesktopApple?.();
  }
}
mobileLayout.addEventListener('change', updateLayout);
addEventListener('hashchange', () => {
  paint(parseRoute());
  onDesktopRoute?.();
});
updateLayout();

async function startDesktop() {
const [THREE, {GLTFLoader}, {RoomEnvironment}, BufferGeometryUtils] = await Promise.all([
  import('three'),
  import('three/addons/loaders/GLTFLoader.js'),
  import('three/addons/environments/RoomEnvironment.js'),
  import('three/addons/utils/BufferGeometryUtils.js'),
]);
const DESIGN_MID = 400;
const APPLE_CX = 609;
const APPLE_CY = 200;
const APPLE_D = 304;
const G = 2.35;

const stage = document.getElementById('stage');

function shot(src, alt, x, y, w, h, cls = 'cover') {
  const classes = cls ? `loose ${cls}` : 'loose';
  return `<img class="${classes}" alt="${alt}" src="design/board/${src}" style="left: calc(${x} * var(--u)); top: calc(${y} * var(--u)); width: calc(${w} * var(--u)); height: calc(${h} * var(--u))">`;

const stepImageLoads = new Map();
const stepColourRenders = new Map();
function loadStepImage(src) {
  if (!stepImageLoads.has(src)) {
    const image = new Image();
    image.src = src;
    stepImageLoads.set(src, image.decode().then(() => image));
  }
  return stepImageLoads.get(src);
}

async function renderStepColour(step, index, sourceIndex, colour) {
  const key = `${sourceIndex}|${colour}`;
  step.dataset.colourRender = key;
  try {
    let rendered = stepColourRenders.get(index);
    if (!rendered || rendered.key !== key) {
      const [art, texture] = await Promise.all([
        loadStepImage(STEP_SLIDES[sourceIndex]),
        loadStepImage('design/steps/rib-escalator-10.png'),
      ]);
      const canvas = document.createElement('canvas');
      canvas.width = 1920;
      canvas.height = 1067;
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.fillStyle = colour;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const pattern = ctx.createPattern(texture, 'repeat');
      pattern.setTransform(new DOMMatrix().scale(4 / 3));
      ctx.fillStyle = pattern;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(art, 0, 0, canvas.width, canvas.height);
      const tread = document.createElement('canvas');
      tread.width = 8;
      tread.height = 32;
      const tc = tread.getContext('2d', { alpha: false });
      tc.fillStyle = colour;
      tc.fillRect(0, 0, 8, 32);
      tc.fillStyle = 'rgba(0,0,0,.14)';
      tc.fillRect(0, 0, 8, 32);
      tc.drawImage(texture, 0, 0, 8, 32);
      rendered = { key, face: canvas.toDataURL('image/jpeg', .92), tread: tread.toDataURL() };
      if (step.dataset.colourRender !== key) return;
      stepColourRenders.set(index, rendered);
    }
    if (step.dataset.colourRender !== key || !step.isConnected) return;
    step.querySelector('.step-slide').src = rendered.face;
    step.style.setProperty('--baked-tread', `url("${rendered.tread}")`);
  } catch {
    step.dataset.colourRender = '';
  }
}

function applyEscalatorVars() {
  const root = document.documentElement;
  root.dataset.pageTheme = String(escalator.pageTheme);
  root.dataset.separateTread = String(escalator.separateTreadColor);
  root.style.setProperty('--tread-colour', escalator.treadColor);
  const baked = escalator.ribs === 2 && Math.abs(escalator.ribStrength - .1) < .001;
  root.dataset.baked = String(baked);
  document.querySelectorAll('.escalator-track > .case').forEach((step, index) => {
    if (step.querySelector('.case-cover')) {
      const colour = escalator.pageTheme === 1 ? escalator.stepColor : SCREEN_COLORS[index];
      step.style.setProperty('--screen-color', colour);
      step.style.setProperty('--original-step-color', colour);
      step.style.setProperty('--baked-tread', 'url("design/steps/tread-1-0.png")');
      return;
    }
    const img = step.querySelector('.step-slide');
    // Theme one retains the original sequence; the colour study starts with EUPHORIA.
    const sourceIndex = index < 2 ? 1 - index : index % STEP_SLIDES.length;
    const src = baked ? `design/steps/baked-${escalator.pageTheme === 2 ? 'neutral' : '1'}-${escalator.pageTheme === 1 && index < 2 ? 1 - index : index}.webp` : STEP_SLIDES[sourceIndex];
    const colour = escalator.pageTheme === 1 ? escalator.stepColor : SCREEN_COLORS[index];
    step.style.setProperty('--screen-color', colour);
    step.style.setProperty('--original-step-color', escalator.stepColor);
    if (baked && colour.toUpperCase() !== '#C4C4C4') {
      renderStepColour(step, index, sourceIndex, colour);
    } else {
      step.dataset.colourRender = '';
      if (img && img.getAttribute('src') !== src) img.src = src;
      step.style.setProperty('--baked-tread', `url("design/steps/tread-1-${index}.png")`);
    }
    const title = step.querySelector('.case-meta span:nth-child(2)');
    if (title) title.textContent = escalator.pageTheme === 2 && index < 2
      ? (index === 0 ? 'Graphics, typography, font for SALUKI EUPHORIA' : 'Wild Ea$t album identity for SALUKI')
      : CASES[index].title;
  });
  const rib = RIB_PRESETS[escalator.ribs] || RIB_PRESETS[1];
  const pitch = Math.max(8, rib.pitch);
  root.style.setProperty('--rib-texture', rib.dark === 0 ? 'none' : escalator.ribs === 2 ? 'url("design/steps/rib-escalator-10.png")' : 'url("design/steps/rib-soft.png")');
  root.style.setProperty('--rib-width', escalator.ribs === 2 ? 8 : Math.max(18, pitch * 2));
  root.style.setProperty('--rib-strength', escalator.ribs === 2 ? escalator.ribStrength / .1 : escalator.ribStrength);
  root.style.setProperty('--rib-over-art', (rib.over || 0) * escalator.ribStrength);
  root.style.setProperty('--step-pct', String(escalator.stepH));
  root.style.setProperty('--tread-depth', String(escalator.tread));
  root.style.setProperty('--shaft-perspective', escalator.perspective);
}

function softBlobTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.03, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(42,42,42,0.42)');
  grd.addColorStop(0.3, 'rgba(55,55,55,0.18)');
  grd.addColorStop(0.62, 'rgba(70,70,70,0.05)');
  grd.addColorStop(1, 'rgba(70,70,70,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function prepareStamp(model) {
  model.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.flatShading = true;
      m.envMapIntensity = o.name === 'Pad' ? 0.08 : 0.2;
      m.needsUpdate = true;
    }
  });
  model.rotation.order = 'YXZ';
  return model;
}

function cloneMaterials(root) {
  root.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
  });
}

function fitTopDown(model) {
  const pivot = new THREE.Group();
  pivot.add(model);
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  pivot.scale.setScalar(1 / diam);
  pivot.position.copy(center).multiplyScalar(-1 / diam);
  return pivot;
}

function prepareApple(gltf, skinHex) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (skinHex != null && (m.name === 'PaleGreen' || m.name === 'green')) {
        m.color.setHex(skinHex);
        m.emissive.setHex(skinHex);
        m.emissiveIntensity = 0.04;
      }
      m.roughness = 0.42;
      m.metalness = 0;
    }
  });
  return fitTopDown(model);
}

function prepareHalfApple(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (o.isMesh && o.geometry) o.geometry = o.geometry.clone();
  });
  paintApple(model);
  const body = meshByMaterial(model, 'green');
  const stem = meshByMaterial(model, 'brown');
  const flesh = meshByMaterial(model, 'brownLight');
  const leaf = meshByMaterial(model, 'DarkGreen');
  if (flesh && stem && body) {
    const cutN = worldNormal(flesh);
    const stemDir = centerOf(stem).sub(centerOf(body));
    if (cutN.lengthSq() > 1e-8 && stemDir.lengthSq() > 1e-8) {
      const qCut = new THREE.Quaternion().setFromUnitVectors(cutN, new THREE.Vector3(0, 1, 0));
      const stemFlat = stemDir.normalize().applyQuaternion(qCut);
      stemFlat.y = 0;
      if (stemFlat.lengthSq() > 1e-8) {
        const qStem = new THREE.Quaternion().setFromUnitVectors(stemFlat.normalize(), new THREE.Vector3(0, 0, 1));
        model.quaternion.copy(qStem.multiply(qCut));
      } else {
        model.quaternion.copy(qCut);
      }
    }
  }
  model.updateMatrixWorld(true);
  if (leaf && body) faceLeafToCamera(leaf, centerOf(body));
  return fitTopDown(model);
}

function prepareGreenStamp(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.color.setHex(STAMP_GREEN);
      m.flatShading = true;
      m.roughness = 0.55;
      m.metalness = 0;
      if (o.name === 'Pad') m.color.multiplyScalar(0.78);
      if (o.name === 'Handle') m.color.multiplyScalar(0.9);
    }
  });
  return fitTopDown(model);
}

  function placeInk(current) {
    if (current.placed || !current.src) return;
    current.placed = true;
    if (current.rig.stack === 'replace') {
      for (let i = marks.length - 1; i >= 0; i--) {

  const colorDeck = [];
  let lastColor = '';
  function drawColor() {
    if (!colorDeck.length) {
      const colors = ['blue', 'pink', 'green'];
      for (let i = colors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [colors[i], colors[j]] = [colors[j], colors[i]];
      }
      if (colors[colors.length - 1] === lastColor) {
        [colors[0], colors[colors.length - 1]] = [colors[colors.length - 1], colors[0]];
      }
      colorDeck.push(...colors);
    }
    lastColor = colorDeck.pop();
    return lastColor;
  }
  function pickCast(kind) {
    const casts = kind === 'apple' ? APPLE_CASTS : STAMP_CASTS;
    const list = kind === 'apple' ? APPLE_IMPRINTS : STAMP_IMPRINTS;
    const rig = kind === 'apple' ? appleRig : stampRig;
    let cast = casts.find((item) => item.file === rig.file);
    if (!cast) {
      const color = drawColor();
      cast = casts.find((item) => item.color === color) || casts[0];
    } else {
      lastColor = cast.color;
    }
    const imprint = list.find((item) => item.file === cast.file) || list[0];
    return { ...imprint, bodyHex: cast.hex };
  }

  function sampleShot(point, rig, kind) {
    const choice = pickCast(kind);
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const span = rig.jitter * (w / 1440);
    return {
      ...choice,
      kind,
      rig,
      rot: (Math.random() * 2 - 1) * rig.rotation,
      px: (point.px + (Math.random() * 2 - 1) * span) / w,
      py: (point.py + (Math.random() * 2 - 1) * span) / h,
      placed: false,
    };
  }

  function paintMarks() {
    if (!marks.length || !host.isConnected) return;
    const h = host.clientHeight;
    if (host.clientWidth < 2 || h < 2) return;
    for (const mark of marks) {
      const rig = mark.kind === 'apple' ? appleRig : stampRig;
      const imgW = mark.kind === 'apple'
        ? (SIZE * rig.scale / viewH) * h
        : ((SIZE * rig.scale / viewH) * h) / INK_FRAC;
      mark.el.style.left = `calc(${mark.px * 100}% + ${rig.offsetX}px)`;
      mark.el.style.top = `calc(${mark.py * 100}% + ${rig.offsetY}px)`;
      mark.el.style.width = imgW + 'px';
      mark.el.style.opacity = String(rig.opacity);
      mark.el.style.filter = rig.blur > 0.01 ? `blur(${rig.blur}px)` : 'none';
      const rot = mark.kind === 'apple' ? rig.pressY - mark.rot : mark.rot;
      mark.el.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
      mark.dye.style.opacity = String(rig.tintAmount);
      mark.dye.style.background = rig.tint;
    }
  }

  function motionSeconds(base, speed) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    return (reduce ? base * 0.4 : base) / Math.max(0.25, speed);
  }

  function pressSeconds() {
    return matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.08 : 0.2;
  }

  function targetOf(current) {
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const px = current.px * w + current.rig.offsetX;
    const py = current.py * h + current.rig.offsetY;
    const size = SIZE * (current.kind === 'apple' ? current.rig.scale : current.rig.printScale);
    return {
      x: (px / w - 0.5) * viewW,
      z: (py / h - 0.5) * viewH,
      edge: viewH / 2 + size * 0.65,
    };
  }

  function squashCurve(u) {
    if (u < 0.55) return Math.sin((u / 0.55) * Math.PI / 2) * 1.12;
    const v = (u - 0.55) / 0.45;
    return 1.12 - 0.12 * (1 - (1 - v) ** 2);
  }

  function axisPose(flight, prefix) {
    const d = Math.PI / 180;
    const rig = flight.shot.rig;
    return {
      x: rig[prefix + 'X'] * d,
      y: rig[prefix + 'Y'] * d,
      z: rig[prefix + 'Z'] * d,
    };
  }

  function lerpPose(a, b, t) {
    return {
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t,
      z: a.z + (b.z - a.z) * t,
    };
  }

  function travelPose(u, from, via, to) {
    if (u <= 0.5) return lerpPose(from, via, u / 0.5);
    return lerpPose(via, to, (u - 0.5) / 0.5);
  }

  function poseFor(flight, name, u) {
    const start = axisPose(flight, 'start');
    const fly = axisPose(flight, 'fly');
    const press = axisPose(flight, 'press');
    if (name === 'descend') return travelPose(u, start, fly, press);
    if (name === 'lift') return travelPose(u, press, fly, start);
    return press;
  }

  function tintObject(root, rig) {
    root.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        if (!m.userData.baseColor) m.userData.baseColor = m.color.clone();
        m.color.copy(m.userData.baseColor);
        if (rig.tintAmount > 0) m.color.lerp(new THREE.Color(rig.tint), rig.tintAmount);
        m.transparent = rig.opacity < 0.999;
        m.opacity = rig.opacity;
        m.depthWrite = rig.opacity > 0.95;
      }
    });
  }

  function pressScales(squash, amount) {
    const signed = amount * squash;
    return {
      x: Math.max(0.12, 1 + signed),
      y: Math.max(0.12, 1 - signed * 1.35),
    };
  }

  function paintTool(root, kind, hex) {
    root.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) {
        if (kind === 'apple') {
          if (material.name !== 'green' && material.name !== 'PaleGreen') continue;
          material.color.setHex(hex);
          material.emissive.setHex(hex);
          material.emissiveIntensity = 0.08;
          continue;
        }
        const color = new THREE.Color(hex);
        if (node.name === 'Pad') color.multiplyScalar(0.78);
        else if (node.name === 'Handle') color.multiplyScalar(0.9);
        material.color.copy(color);
      }
    });
  }

  function cloneTool(source) {
    const clone = source.clone(true);
    clone.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      node.material = Array.isArray(node.material)
        ? node.material.map((material) => material.clone())
        : node.material.clone();
    });
    clone.visible = false;
    scene.add(clone);
    return clone;
  }

  function cloneShadow() {
    const mesh = shadow.clone();
    mesh.material = shadow.material.clone();
    mesh.visible = false;
    scene.add(mesh);
    return mesh;
  }

  function releaseFlight(flight) {
    scene.remove(flight.model);
    flight.model.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) material.dispose();
    });
    scene.remove(flight.shadow);
    flight.shadow.material.dispose();
    flight.model.visible = false;
    flight.shadow.visible = false;
  }

  function applyPose(flight, x, z, squashAmt, rot, presence, spin) {
    const shot = flight.shot;
    const rig = shot.rig;
    const size = SIZE * (shot.kind === 'apple' ? rig.scale : rig.printScale);
    const pressed = pressScales(rig.squash, squashAmt);
    const spread = pressed.x;
    const squat = pressed.y;
    const euler = spin || poseFor(flight, 'press', 1);
    const model = flight.model;
    model.scale.set(size * spread, size * squat, size * spread);
    model.rotation.order = 'XYZ';
    model.rotation.set(euler.x, euler.y - rot * Math.PI / 180, euler.z);
    model.position.set(x, 0.02 - Math.min(1, squashAmt) * 0.012, z);
    model.visible = true;
    if (shot.kind === 'apple') tintObject(model, rig);
    if (shot.bodyHex != null) paintTool(model, shot.kind, shot.bodyHex);
    const shade = flight.shadow;
    shade.visible = true;
    shade.position.set(x + 0.04, 0.002, z + 0.03);
    shade.material.opacity = 0.1 + presence * 0.22 + Math.min(1, squashAmt) * 0.4;
    shade.scale.setScalar(1.12 - Math.min(1, squashAmt) * 0.1);
  }

  function kindReady(kind) {
    return kind === 'apple' ? appleModel : stampModel;
  }

  function start(point) {
    const kind = pressN % 2 === 0 ? 'stamp' : 'apple';
    const source = kindReady(kind);
    if (!source) {
      queued.push(point);
      return;
    }
    pressN += 1;
    const rig = kind === 'stamp' ? stampRig : appleRig;
    const shot = sampleShot(point, rig, kind);
    const flight = {
      shot,
      phase: 'descend',
      phaseU: 0,
      model: cloneTool(source),
      shadow: cloneShadow(),
    };
    flights.push(flight);
    const ui = fileUis.find((item) => item.kind === kind);
    if (ui) ui.last.textContent = 'Сейчас: ' + shot.file;
    refreshFiles();
    const goal = targetOf(shot);
    applyPose(flight, goal.x, goal.edge, 0, shot.rot, 0, poseFor(flight, 'descend', 0));
  }

  function drainQueue() {
    while (queued.length) {
      const kind = pressN % 2 === 0 ? 'stamp' : 'apple';
      if (!kindReady(kind)) return;
      start(queued.shift());
    }
  }

  function stepFlight(flight, dt) {
    const shot = flight.shot;
    if (flight.phase === 'rest') {
      if (shot.rig.liftAway) {
        flight.phase = 'lift';
        flight.phaseU = 0;
      } else {
        const goal = targetOf(shot);
        applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      }
      return false;
    }
    const goal = targetOf(shot);
    if (flight.phase === 'descend') {
      flight.phaseU += dt / motionSeconds(0.62, shot.rig.descent);
      const u = Math.min(1, flight.phaseU);
      const k = 1 - (1 - u) ** 3;
      applyPose(flight, goal.x, goal.edge + (goal.z - goal.edge) * k, 0, shot.rot, k, poseFor(flight, 'descend', u));
      if (u >= 1) { flight.phase = 'press'; flight.phaseU = 0; }
    } else if (flight.phase === 'press') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      applyPose(flight, goal.x, goal.z, squashCurve(u), shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.5) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'repress') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      const sq = 1 + Math.sin(Math.min(1, u) * Math.PI) * 0.35;
      applyPose(flight, goal.x, goal.z, sq, shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.2) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'dwell') {
      applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      placeInk(shot);
      if (shot.rig.dwell <= 0.001) {
        flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
        flight.phaseU = 0;
      } else {
        flight.phaseU += dt / shot.rig.dwell;
        if (flight.phaseU >= 1) {
          flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
          flight.phaseU = 0;
        }
      }
    } else if (flight.phase === 'lift') {
      flight.phaseU += dt / motionSeconds(0.42, shot.rig.lift);
      const u = Math.min(1, flight.phaseU);
      const k = u * u;
      const release = Math.max(0, 1 - Math.min(1, u / 0.28));
      applyPose(flight, goal.x, goal.z + (goal.edge - goal.z) * k, release, shot.rot, 1 - k, poseFor(flight, 'lift', u));
      if (u >= 1) {
        releaseFlight(flight);
        return true;
      }
    }
    return false;
  }

  function step(dt) {
    for (let i = flights.length - 1; i >= 0; i--) {
      if (stepFlight(flights[i], dt)) flights.splice(i, 1);
    }
  }

  function onClick(e) {
    if (!alive) return;
    const hr = host.getBoundingClientRect();
    const point = { px: e.clientX - hr.left, py: e.clientY - hr.top };
    start(point);
  }
  host.addEventListener('click', onClick);

  function isTyping(el) {
    while (el && el !== document.body) {
      if (el.isContentEditable) return true;
      const tag = el.tagName;
      if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (tag === 'INPUT') {
        const type = (el.type || 'text').toLowerCase();
        return type !== 'range' && type !== 'checkbox' && type !== 'radio' && type !== 'button';
      }
      el = el.parentElement;
    }
    return false;
  }

  function onKey(e) {
    if (e.repeat) return;
    if (e.code === 'Escape' && !panel.hidden && !isTyping(e.target)) {
      panel.hidden = true;
      return;
    }
    if (e.code !== 'KeyG' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(e.target) || isTyping(document.activeElement)) return;
    e.preventDefault();
    panel.hidden = !panel.hidden;
  }
  addEventListener('keydown', onKey);
  close.addEventListener('click', () => { panel.hidden = true; });

  function frame() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    placeStage();
    paintMarks();
  }
  const ro = new ResizeObserver(frame);
  ro.observe(host);
  frame();

  function mountTool(kind, fitted) {
    const group = new THREE.Group();
    group.add(fitted);
    group.scale.setScalar(SIZE);
    group.visible = false;
    scene.add(group);
    if (kind === 'stamp') stampModel = group;
    else appleModel = group;
    drainQueue();
  }

  new GLTFLoader().load('models/stamp_round.glb', (gltf) => {
    if (!alive) return;
    mountTool('stamp', fitTopDown(prepareStamp(gltf.scene)));
  });
  new GLTFLoader().load('models/apple_half_green.glb', (gltf) => {
    if (!alive) return;
    mountTool('apple', prepareHalfApple(gltf));
  });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0;
    lastNow = now;
    step(dt);
    placeStage();
    renderer.render(scene, camera);
  });

  return () => {
    alive = false;
    while (flights.length) releaseFlight(flights.pop());
    host.removeEventListener('click', onClick);
    removeEventListener('keydown', onKey);
    renderer.setAnimationLoop(null);
    ro.disconnect();
    renderer.dispose();
    canvas.remove();
    panel.remove();
    layer.remove();
  };
}

// Полосы 1–4: клик поднимает объект из-за нижнего края, вид строго сверху, и сразу уводит вниз.
function mountBandDrops(root) {
  const bands = [...root.querySelectorAll('.escalator-track > .case:not(.is-clone)')].slice(0, 4);
  const clones = [...root.querySelectorAll('.escalator-track > .case.is-clone')];
  if (!bands.length) return () => {};

  const layer = document.createElement('div');
  layer.className = 'band-drop';
  const canvas = document.createElement('canvas');
  layer.appendChild(canvas);
  root.appendChild(layer);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 20);
  camera.position.set(0, 8, 0);
  camera.up.set(0, 0, -1);
  camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  const key = new THREE.DirectionalLight(0xfff7f2, 1.8);
  key.position.set(-2.2, 6, -1.6);
  scene.add(key);

  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({
      map: softBlobTexture(),
      transparent: true,
      depthWrite: false,
      toneMapped: false,
      opacity: 0,
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.visible = false;
  shadow.renderOrder = -1;
  scene.add(shadow);

  const actors = [null, null, null, null];
  let alive = true;
  let playing = false;
  let startedAt = 0;
  let pending = -1;
  let landX = 0;
  let landZ = 0;
  let offZ = 0;
  let upMs = 620;
  let downMs = 340;
  const SIZE = 0.46;

  function frame() {
    const w = innerWidth;
    const h = innerHeight;
    if (w < 2 || h < 2) return;
    const viewH = 2;
    const viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  frame();
  addEventListener('resize', frame);

  function worldOf(sx, sy) {
    const viewH = camera.top - camera.bottom;
    const viewW = camera.right - camera.left;
    return {
      x: (sx / innerWidth - 0.5) * viewW,
      z: (sy / innerHeight - 0.5) * viewH,
    };
  }

  function pageBottomZ() {
    const radiusPx = (SIZE / 2) * innerHeight / 2 + 36;
    return worldOf(innerWidth / 2, innerHeight + radiusPx).z;
  }

  function begin(index, now) {
    const actor = actors[index];
    if (!actor) {
      pending = index;
      return;
    }
    actors.forEach((item) => { if (item) item.visible = false; });
    const band = bands[index].getBoundingClientRect();
    const visTop = Math.max(band.top, 0);
    const visBot = Math.min(band.bottom, innerHeight);
    const sy = visTop < visBot ? (visTop + visBot) / 2 : band.top + band.height / 2;
    const spot = worldOf(band.left + band.width / 2, sy);
    landX = spot.x;
    landZ = spot.z;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const bottom = pageBottomZ();
    if (reduce) {
      const hop = Math.abs(worldOf(0, 96).z - worldOf(0, 0).z);
      offZ = landZ + Math.min(hop, Math.abs(bottom - landZ));
      upMs = 200;
      downMs = 160;
    } else {
      offZ = bottom;
      upMs = 620;
      downMs = 340;
    }
    actor.visible = true;
    actor.rotation.set(0, 0, 0);
    actor.position.set(landX, 0.03, offZ);
    actor.scale.setScalar(SIZE);
    shadow.visible = true;
    playing = true;
    pending = -1;
    startedAt = now;
  }

  function pose(now) {
    const actor = actors.find((item) => item && item.visible);
    if (!playing || !actor) return;
    const t = now - startedAt;
    let k;
    let z;
    if (t < upMs) {
      k = 1 - (1 - t / upMs) ** 3;
      z = landZ + (offZ - landZ) * (1 - k);
    } else if (t < upMs + downMs) {
      const u = (t - upMs) / downMs;
      k = 1 - (1 - u) ** 2;
      z = landZ + (offZ - landZ) * k;
    } else {
      actor.visible = false;
      shadow.visible = false;
      playing = false;
      return;
    }
    actor.rotation.set(0, 0, 0);
    actor.position.set(landX, 0.03, z);
    shadow.position.set(landX + 0.02, 0.002, z + 0.03);
    const settled = t < upMs ? k : 1 - k;
    shadow.material.opacity = 0.15 + settled * 0.5;
    shadow.scale.setScalar(1.05 - settled * 0.1);
  }

  const stops = bands.map((band, index) => {
    let gesture = null;
    function onDown(e) {
      if (e.button !== 0 || playing) return;
      gesture = { id: e.pointerId, x: e.clientX, y: e.clientY };
    }
    function onUp(e) {
      if (!gesture || e.pointerId !== gesture.id) return;
      const dx = e.clientX - gesture.x;
      const dy = e.clientY - gesture.y;
      gesture = null;
      if (playing || dx * dx + dy * dy > 64) return;
      begin(index, performance.now());
    }
    const targets = [band, clones[index]].filter(Boolean);
    targets.forEach((target) => {
      target.addEventListener('pointerdown', onDown);
      target.addEventListener('pointerup', onUp);
    });
    return () => {
      targets.forEach((target) => {
        target.removeEventListener('pointerdown', onDown);
        target.removeEventListener('pointerup', onUp);
      });
    };
  });

  Promise.all([
    new GLTFLoader().loadAsync(APPLE_FILE),
    new GLTFLoader().loadAsync(STAMP_FILE),
  ]).then(([appleGltf, stampGltf]) => {
    if (!alive) return;
    const built = [
      prepareApple(appleGltf, APPLE_RED),
      prepareGreenStamp(stampGltf),
      prepareApple(appleGltf, null),
      prepareGreenStamp(stampGltf),
    ];
    built.forEach((fitted, i) => {
      const rig = new THREE.Group();
      rig.add(fitted);
      rig.visible = false;
      actors[i] = rig;
      scene.add(rig);
    });
    if (pending >= 0 && !playing) begin(pending, performance.now());
  }).catch((err) => { globalThis.__dropErr = String(err); });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    pose(now);
    globalThis.__drop = { playing, pending, n: actors.filter(Boolean).length, t: playing ? now - startedAt : -1 };
    renderer.render(scene, camera);
  });

  return () => {
    alive = false;
    stops.forEach((stop) => stop());
    removeEventListener('resize', frame);
    renderer.setAnimationLoop(null);
    renderer.dispose();
    layer.remove();
  };
}

function weldSmoothGeometry(geometry) {
  const source = geometry.clone();
  for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) source.deleteAttribute(name);
  const merged = BufferGeometryUtils.mergeVertices(source, 1e-4);
  source.dispose();
  merged.computeVertexNormals();
  return merged;
}

function applyShadeSmooth(root, smooth) {
  if (!root) return;
  root.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    if (!node.userData.flatGeometry) {
      node.userData.flatGeometry = node.geometry;
      node.userData.smoothGeometry = weldSmoothGeometry(node.geometry);
    }
    node.geometry = smooth ? node.userData.smoothGeometry : node.userData.flatGeometry;
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    for (const material of mats) {
      if (!material) continue;
      material.flatShading = !smooth;
      material.needsUpdate = true;
    }
  });
}

const HEADER_APPLE_FILE = 'design/stub/models/apple-corner.glb';
const HEADER_APPLE_GREEN = 0x56ae08;
const HEADER_STEM = 0x8b5a2b;

function prepareHeaderApple(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    if (mats.some((material) => material && /green_apple_2_texture/i.test(material.name || ''))) {
      node.userData.appleStem = true;
    }
  });
  model.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    const prev = Array.isArray(node.material) ? node.material : [node.material];
    if (node.userData.appleStem) {
      const next = prev.map((material) => {
        if (!material) return material;
        const stem = material.clone();
        stem.name = 'stem';
        stem.color.setHex(HEADER_STEM);
        if (stem.emissive) {
          stem.emissive.setHex(0x000000);
          stem.emissiveIntensity = 0;
        }
        stem.map = stem.envMap = stem.normalMap = stem.roughnessMap = stem.metalnessMap = stem.aoMap = stem.emissiveMap = null;
        return stem;
      });
      node.material = Array.isArray(node.material) ? next : next[0];
      for (const old of prev) {
        if (old && !next.includes(old)) old.dispose();
      }
      return;
    }
    let side = THREE.FrontSide;
    for (const material of prev) {
      if (material && material.side === THREE.DoubleSide) side = THREE.DoubleSide;
    }
    const material = new THREE.MeshStandardMaterial({
      name: 'plane',
      color: HEADER_APPLE_GREEN,
      metalness: 0,
      roughness: 0.55,
      emissive: 0x000000,
      emissiveIntensity: 0,
      envMapIntensity: 0,
      side,
      flatShading: false,
    });
    node.material = material;
    for (const old of prev) {
      if (old && old !== material) old.dispose();
    }
  });
  applyShadeSmooth(model, true);
  return fitTopDown(model);
}

  function cubicBezierEase(x1, y1, x2, y2) {
    const calc = (t, a1, a2) => t * (3 * (1 - t) * ((1 - t) * a1 + t * a2) + t * t);
    return (x) => {
      let lower = 0;
      let upper = 1;

        const currentX = calc(t, x1, x2) - x;
        if (currentX * currentX < 1e-28 || i === 40) break;

}

function mountScroller(scroller) {
  const board = scroller.querySelector('.board');
  let alive = true;
  let drag = null;
  let wrapping = false;
  let pos = scroller.scrollLeft;

  function park(next) {
    const loop = loopWidth();
    if (loop > 0) next = ((next % loop) + loop) % loop;
    pos = next;
    wrapping = true;
    scroller.scrollLeft = next;
    wrapping = false;
  }

  function loopWidth() {
    return board.getBoundingClientRect().width;
  }

  function ensureCopies() {
    if (!alive) return;
    const loop = loopWidth();
    if (loop <= 0) return;
    const need = Math.max(2, Math.ceil(scroller.clientWidth / loop) + 1);
    const track = board.parentElement;
    while (track.children.length < need) {
      const copy = board.cloneNode(true);
      copy.setAttribute('aria-hidden', 'true');
      track.appendChild(copy);
      copy.querySelectorAll('video').forEach((video) => {
        video.muted = true;
        video.play().catch(() => {});
      });
    }
  }

  function wrap() {
    const loop = loopWidth();
    if (loop <= 0 || wrapping) return;
    const x = scroller.scrollLeft;
    if (x >= loop) park(x - loop);
    else if (x < 0) park(x + loop);
  }

  function onWheel(event) {
    if (!wheelScrollsPage(event)) event.preventDefault();
  }

  function onScroll() {
    if (!wrapping) wrap();
  }

  function onDown(event) {
    if (event.button !== 0) return;
    drag = { x: event.clientX, left: scroller.scrollLeft };
    scroller.classList.add('is-drag');
    try { scroller.setPointerCapture(event.pointerId); } catch (err) { /* synthetic */ }
  }

  function onMove(event) {
    if (!drag) return;
    const loop = loopWidth();
    let next = drag.left - (event.clientX - drag.x);
    if (loop > 0) next = ((next % loop) + loop) % loop;
    pos = next;
    scroller.scrollLeft = next;
  }

  function onUp() {
    drag = null;
    scroller.classList.remove('is-drag');
  }

  ensureCopies();
  board.querySelectorAll('video').forEach((video) => {
    video.muted = true;
    video.play().catch(() => {});
  });
  addEventListener('resize', ensureCopies);
  scroller.addEventListener('wheel', onWheel, { passive: false });
  scroller.addEventListener('scroll', onScroll, { passive: true });
  scroller.addEventListener('pointerdown', onDown);
  scroller.addEventListener('pointermove', onMove);
  scroller.addEventListener('pointerup', onUp);
  scroller.addEventListener('pointercancel', onUp);

  return () => {
    alive = false;
    removeEventListener('resize', ensureCopies);
  };
}

function nearestTurn(target, current) {
  const tau = Math.PI * 2;
  return target + Math.round((current - target) / tau) * tau;
}

  if (fy > ty + 0.012) {
    vy = -Math.sqrt(2 * G * (fy - ty + 0.16));
  } else {
    vy = 0.02;
  }
}

function materialsOf(mesh) {
  return Array.isArray(mesh.material) ? mesh.material : [mesh.material];

function smoothShade(root, tolerance = 1e-4) {
  let before = 0, after = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.geometry;
    before += src.attributes.position.count;
    for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) src.deleteAttribute(name);
    const merged = BufferGeometryUtils.mergeVertices(src, tolerance);
    merged.computeVertexNormals();
    src.dispose();
    o.geometry = merged;
    after += merged.attributes.position.count;
    for (const m of materialsOf(o)) {
      m.flatShading = false;
      m.needsUpdate = true;
    }
  });
  return { before, after };
}

function meshByMaterial(root, name) {
  let found = null;
  root.traverse((o) => {
    if (o.isMesh && materialsOf(o).some((m) => m.name === name)) found = o;
  });
  return found;
}

function paintApple(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of materialsOf(o)) {
      const look = LOOK[m.name];
      if (!look) continue;
      m.color.setHex(look.color);
      m.emissive.setHex(look.emissive);
      m.emissiveIntensity = look.emissiveIntensity;
      m.metalness = look.metalness;
      m.roughness = look.roughness;
      const skin = m.name === 'PaleGreen' || m.name === 'green';
      m.envMapIntensity = skin ? 0.22 : 0.12;
      m.side = m.name === 'DarkGreen' ? THREE.DoubleSide : THREE.FrontSide;
      m.flatShading = false;
      if (m.name === 'brownDark') {
        m.polygonOffset = true;
        m.polygonOffsetFactor = -2;
        m.polygonOffsetUnits = -2;
      }
      m.needsUpdate = true;
    }
  });
}

// Лист в модели стоит ребром. Разворачиваем пластинку нормалью к камере,
// вращая вокруг основания — ближайшей к телу вершины.
function faceLeafToCamera(leaf, bodyCenter) {
  const viewDir = new THREE.Vector3(0, 1, 0);
  leaf.updateWorldMatrix(true, false);
  const toWorld = leaf.matrixWorld;
  const attr = leaf.geometry.attributes.position;
  const pts = [];
  for (let i = 0; i < attr.count; i++) {
    pts.push(new THREE.Vector3().fromBufferAttribute(attr, i).applyMatrix4(toWorld));
  }
  const mean = new THREE.Vector3();
  for (const p of pts) mean.add(p);
  mean.multiplyScalar(1 / pts.length);

  const c = new Array(9).fill(0);
  for (const p of pts) {
    const d = p.clone().sub(mean);
    c[0] += d.x * d.x; c[1] += d.x * d.y; c[2] += d.x * d.z;
    c[4] += d.y * d.y; c[5] += d.y * d.z; c[8] += d.z * d.z;
  }
  c[3] = c[1]; c[6] = c[2]; c[7] = c[5];
  const trace = c[0] + c[4] + c[8];
  const m = c.map((x, i) => (i % 4 === 0 ? trace - x : -x));
  const n = new THREE.Vector3(0.41, 0.82, 0.41).normalize();
  for (let i = 0; i < 80; i++) {
    n.set(
      m[0] * n.x + m[1] * n.y + m[2] * n.z,
      m[3] * n.x + m[4] * n.y + m[5] * n.z,
      m[6] * n.x + m[7] * n.y + m[8] * n.z,
    ).normalize();
  }
  if (n.dot(viewDir) < 0) n.negate();

  let base = pts[0], best = Infinity;
  for (const p of pts) {
    const d2 = p.distanceToSquared(bodyCenter);
    if (d2 < best) { best = d2; base = p; }
  }
  const world = new THREE.Matrix4()
    .makeTranslation(base.x, base.y, base.z)
    .multiply(new THREE.Matrix4().makeRotationFromQuaternion(
      new THREE.Quaternion().setFromUnitVectors(n, viewDir)))
    .multiply(new THREE.Matrix4().makeTranslation(-base.x, -base.y, -base.z));
  const inv = new THREE.Matrix4().copy(toWorld).invert();
  leaf.geometry.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, world).multiply(toWorld));
  leaf.geometry.computeVertexNormals();
}

function updateCamera() {
