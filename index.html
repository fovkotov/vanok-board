<!DOCTYPE html>
<html lang="en" data-theme="0" class="page-ready">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanök Regular — graphic designer and art director</title>
<link rel="icon" href="design/stub/favicon.png" type="image/png">
<link rel="icon" href="design/stub/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="design/stub/apple-touch-icon.png">
<style>
  /* Кадр 1440×800. --k переводит его пиксели во вьюпорт.
     Хедер и палитра — классический тизер (vanok-teaser/index.html): один синий вордмарк в 12px от верха. */
  :root {
    --bg: #E9E9E9;
    --blue: #0A1AE9;
    --blue-fill: #0A1AE9;
    --blue-on: #e1e1e1;
    --grotesk: Arial, "Helvetica Neue", Helvetica, sans-serif;
    --k: calc(100vw / 1440);
    --u: calc(100vh / 800);
    --vv-lift: 0px;
    --step-pct: 100;
    --tread-depth: 288;
    --shaft-perspective: 1100px;
    --step-shade: 0;
  }
  html[data-theme="1"] {
    --blue: #8A7E59;
    --bg: hsl(303.8182deg 100% 78.4314%);
  }
  html[data-theme="2"] {
    --blue: #E3F4E8;
    --bg: linear-gradient(180deg, #A59D90 0%, #02DD67 100%);
  }
  html[data-theme="3"] {
    --blue: #ffffff;
    --bg: #80a6bc;
  }
  html[data-theme="3"] .chrome .site-credits {
    color: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; background: var(--bg) fixed; }

  body {
    color: var(--blue);
    font-family: var(--grotesk);
    -webkit-font-smoothing: antialiased;
  }

  /* Холст живёт всё время: смена hash не пересоздаёт WebGL. */
  #stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  #app { position: relative; z-index: 2; }

  /* Classic teaser header. Desktop wordmark is one blue mark, 12px from the top. */
  .chrome {
    --hk: calc(100vw / 1440);
    --grid-margin: 12px;
    --grid-gutter: 12px;
    --col: calc((100vw - 2 * var(--grid-margin) - 11 * var(--grid-gutter)) / 12);
    --letter-w: calc(6 * var(--col) + 5 * var(--grid-gutter));
    --letter-left: calc(var(--grid-margin) + 6 * (var(--col) + var(--grid-gutter)));
    --wordmark-top: calc(6 * var(--hk));
    position: relative;
    z-index: 5;
    height: calc(12px + var(--letter-w) * 233 / 702);
    color: var(--blue);
    pointer-events: none;
  }
  .chrome .crosshair,
  .chrome .ig-link,
  .chrome .catalog-entry,
  .chrome .site-credits,
  .chrome .soon { pointer-events: auto; }
  body[data-route="hero"] .chrome { height: 100vh; }
  body[data-route="board"] .chrome {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    margin-bottom: 0;
  }
  .chrome > * { position: absolute; }
  .chrome p { margin: 0; }
  .chrome img { display: block; max-width: none; }
  .chrome .vanok,
  .chrome .regular,
  .chrome .lettering { display: none; }
  html[data-theme="1"] .chrome .lettering-1,
  html[data-theme="2"] .chrome .lettering-2,
  html[data-theme="3"] .chrome .lettering-3 { display: block; }
  html[data-theme="1"] .chrome .wordmark,
  html[data-theme="2"] .chrome .wordmark,
  html[data-theme="3"] .chrome .wordmark { display: none; }

  .chrome .crosshair,
  .chrome .catalog-entry {
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    cursor: pointer;
  }
  .chrome .crosshair {
    z-index: 9;
    left: calc(11.06 * var(--hk));
    top: calc(11.23 * var(--hk));
    width: calc(21.535 * var(--hk));
    height: calc(21.535 * var(--hk));
    line-height: 0;
  }
  .chrome .crosshair svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .chrome .bio,
  .chrome .soon {
    font-size: calc(14 * var(--hk));
    line-height: normal;
    white-space: nowrap;
  }
  .chrome .bio {
    left: calc(var(--grid-margin) + var(--col) + var(--grid-gutter));
    top: calc(12 * var(--hk));
    line-height: calc(16 * var(--hk));
  }
  .chrome .soon {
    top: calc(12 * var(--hk));
    right: var(--grid-margin);
    color: inherit;
    text-decoration: none;
  }
  .chrome .ig-link,
  .chrome .catalog-entry {
    z-index: 3;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    line-height: normal;
    text-decoration-line: underline;
    text-decoration-thickness: from-font;
    text-underline-position: from-font;
    white-space: nowrap;
    cursor: pointer;
    top: calc(12 * var(--hk));
    font-size: calc(14 * var(--hk));
  }
  .chrome .ig-link { left: var(--letter-left); }
  .chrome .catalog-entry {
    left: calc(var(--grid-margin) + 9 * (var(--col) + var(--grid-gutter)));
  }
  .chrome .wordmark {
    left: var(--letter-left);
    top: 12px;
    width: var(--letter-w);
    height: calc(var(--letter-w) * 233 / 702);
  }
  .chrome .lettering-1,
  .chrome .lettering-2,
  .chrome .lettering-3 {
    left: var(--letter-left);
    width: var(--letter-w);
  }
  .chrome .lettering-1 {
    top: calc(var(--wordmark-top) + 23px);
    height: calc(var(--letter-w) * 135 / 619);
  }
  .chrome .lettering-2 {
    top: calc(var(--wordmark-top) + 32px);
    height: calc(var(--letter-w) * 82 / 702);
  }
  .chrome .lettering-3 {
    top: calc(var(--wordmark-top) + 12px);
    height: calc(var(--letter-w) * 124 / 702);
  }
  .chrome .site-credits {
    z-index: 4;
    position: fixed;
    right: 12px;
    bottom: 12px;
    margin: 0;
    color: var(--blue);
    font-family: var(--grotesk);
    font-weight: 400;
    font-size: calc(14 * var(--hk));
    line-height: normal;
    text-decoration: none;
    white-space: nowrap;
    writing-mode: vertical-rl;
    cursor: pointer;
    opacity: 0.32;
  }
  .chrome .site-credits .credits-name {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    visibility: hidden;
  }
  @media (hover: hover) {
    .chrome .ig-link,
    .chrome .catalog-entry { transition: opacity 180ms ease; }
    .chrome .ig-link:hover,
    .chrome .catalog-entry:hover { opacity: 0.8; }
    .chrome .site-credits:hover .credits-full { visibility: hidden; }
    .chrome .site-credits:hover .credits-name { visibility: visible; }
  }
  @media (max-width: 440px) {
    .chrome {
      --hk: calc(100vw / 375);
      --wordmark-top: calc(58 * var(--hk) + 24px);
      height: calc(var(--wordmark-top) + 110 * var(--hk));
    }
    body[data-route="hero"] .chrome { height: 100vh; }
    .chrome .wordmark,
    .chrome .catalog-entry,
    .chrome .site-credits { display: none; }
    .chrome .vanok,
    .chrome .regular { display: block; }
    html[data-theme="1"] .chrome .vanok,
    html[data-theme="1"] .chrome .regular,
    html[data-theme="2"] .chrome .vanok,
    html[data-theme="2"] .chrome .regular,
    html[data-theme="3"] .chrome .vanok,
    html[data-theme="3"] .chrome .regular { display: none; }
    .chrome .crosshair {
      left: calc(23.231 * var(--hk));
      top: calc(23.231 * var(--hk));
    }
    .chrome .bio {
      left: calc(194 * var(--hk));
      top: calc(16 * var(--hk));
      width: calc(157 * var(--hk));
      font-size: calc(12 * var(--hk));
      line-height: calc(14 * var(--hk));
      white-space: normal;
    }
    .chrome .soon {
      position: fixed;
      z-index: 6;
      top: auto;
      right: calc(24 * var(--hk));
      bottom: calc(24 * var(--hk) + var(--vv-lift));
      height: calc(14 * var(--hk));
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: calc(12 * var(--hk));
      line-height: calc(14 * var(--hk));
    }
    .chrome .ig-link {
      position: fixed;
      z-index: 6;
      left: calc(24 * var(--hk));
      top: auto;
      bottom: calc(24 * var(--hk) + var(--vv-lift));
      height: calc(14 * var(--hk));
      display: flex;
      align-items: center;
      font-size: calc(12 * var(--hk));
      line-height: calc(14 * var(--hk));
    }
    .chrome .vanok {
      left: calc(24 * var(--hk));
      top: var(--wordmark-top);
      width: calc(156.387 * var(--hk));
      height: calc(108.538 * var(--hk));
    }
    .chrome .regular {
      left: calc(136.341 * var(--hk));
      top: calc(var(--wordmark-top) + (93.593 - 77) * var(--hk));
      width: calc(214.658 * var(--hk));
      height: calc(90.339 * var(--hk));
    }
    .chrome .lettering-1,
    .chrome .lettering-2,
    .chrome .lettering-3 {
      left: calc(24 * var(--hk));
      top: var(--wordmark-top);
      width: calc(327 * var(--hk));
    }
    .chrome .lettering-1 { height: calc(71.32 * var(--hk)); }
    .chrome .lettering-2 { height: calc(327 * var(--hk) * 82 / 702); }
    .chrome .lettering-3 { height: calc(327 * var(--hk) * 124 / 702); }
  }

  .sheet {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: calc(18 * var(--k));
    padding: 0 0 14vh calc(72 * var(--k));
  }

  .sheet h2 {
    margin: 0;
    font-size: clamp(18px, calc(24 * var(--k)), 24px);
    font-weight: 400;
    max-width: 22ch;
  }

  .sheet p {
    margin: 0;
    font-size: clamp(13px, calc(16 * var(--k)), 16px);
    max-width: 34ch;
  }

  .index-list { margin: 0; padding: 0; list-style: none; max-width: calc(560 * var(--k)); }
  .index-list li {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    padding: calc(14 * var(--k)) 0;
    border-top: 1px solid color-mix(in srgb, var(--blue) 35%, transparent);
    font-size: clamp(13px, calc(16 * var(--k)), 16px);
  }
  .index-list li:last-child { border-bottom: 1px solid color-mix(in srgb, var(--blue) 35%, transparent); }

  .pill {
    align-self: flex-start;
    background: var(--blue-fill);
    color: var(--blue-on);
    border-radius: calc(30 * var(--k));
    padding: calc(12 * var(--k)) calc(16 * var(--k));
    font-size: clamp(14px, calc(18 * var(--k)), 18px);
    text-decoration: none;
  }

  .case {
    max-width: calc(520 * var(--k));
    margin: calc(12 * var(--k)) 0 0 calc(72 * var(--k));
    display: flex;
    flex-direction: column;
    gap: calc(14 * var(--k));
  }
  .case h2 { margin: 0; font-size: calc(16 * var(--k)); font-weight: 400; }
  .case p { margin: 0; font-size: calc(16 * var(--k)); max-width: 36ch; }

  .tiles {
    display: grid;
    grid-template-columns: 1.15fr 0.55fr 0.85fr;
    gap: calc(16 * var(--k));
    padding: calc(28 * var(--k)) calc(48 * var(--k)) calc(48 * var(--k));
  }
  .tile {
    height: calc(240 * var(--k));
    border: 1px solid color-mix(in srgb, var(--blue) 28%, transparent);
    background: rgba(255, 255, 255, 0.16);
  }
  .tile.wide { height: calc(300 * var(--k)); }

  .about-block {
    max-width: calc(420 * var(--k));
    margin: calc(48 * var(--k)) 0 0 calc(72 * var(--k));
    display: flex;
    flex-direction: column;
    gap: calc(16 * var(--k));
  }
  .about-block h2 { margin: 0; font-weight: 400; font-size: calc(24 * var(--k)); }
  .about-block p { margin: 0; font-size: calc(16 * var(--k)); max-width: 34ch; }
  .quiet {
    margin: calc(48 * var(--k)) 0 0 calc(72 * var(--k));
    font-size: calc(14 * var(--k));
  }
  .quiet a { color: var(--blue); }

  /* Маршрут #/board: колонка кадра 15:1144.
     Каждая полоса 4087×800 листается горизонтально, страница — вертикально. */
  html:has(body[data-route="board"]),
  body[data-route="board"] {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  body[data-route="board"] {
    --u: var(--k);
    background: #e4e7ec;
  }
  body[data-route="board"] #stage {
    visibility: hidden;
    pointer-events: none;
  }

  .reel {
    position: relative;
    z-index: 2;
    padding: 0;
  }

  .reel .case {
    max-width: none;
    width: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: calc(6 * var(--k));
  }
  .reel .signoff { margin-top: 0; }

  .escalator {
    position: relative;
    width: 100vw;
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #d0d0d0;
    perspective: var(--shaft-perspective);
    perspective-origin: 50% 24%;
  }
  .escalator-stage {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform-origin: 50% 46%;
    transform: translateZ(0px) scale(1.2);
  }
  .escalator-track {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }
  /* Лицо ступени. Десктоп — крупнейший 16:9. Coarse/mobile (data-riser) — крупнейший 9:16.
     --step-pct масштабирует обе стороны, пропорция не меняется. */
  .reel .escalator .case {
    --step-h: min(calc(var(--step-pct) * 1vh), calc(100vw * 9 / 16 * var(--step-pct) / 100));
    --step-h: min(calc(var(--step-pct) * 1dvh), calc(100vw * 9 / 16 * var(--step-pct) / 100));
    --riser-w: calc(var(--step-h) * 16 / 9);
    position: relative;
    height: var(--step-h);
    gap: 0;
    background: transparent;
    transform-style: preserve-3d;
  }
  .step-rig {
    position: absolute;
    inset: 0;
    overflow: visible;
    transform-style: preserve-3d;
  }
  .step-riser {
    position: absolute;
    top: 0;
    left: calc(50% - var(--riser-w) / 2);
    width: var(--riser-w);
    height: var(--step-h);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #c4c4c4;
  }
  html[data-riser="portrait"] .reel .escalator .case {
    --riser-w: min(calc(var(--step-pct) * 1vw), calc(100vh * 9 / 16 * var(--step-pct) / 100));
    --riser-w: min(calc(var(--step-pct) * 1vw), calc(100dvh * 9 / 16 * var(--step-pct) / 100));
    --step-h: calc(var(--riser-w) * 16 / 9);
  }
  html[data-riser="portrait"] .step-riser {
    aspect-ratio: 9 / 16;
  }
  .step-slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .step-tread {
    --fold: 0;
    position: absolute;
    left: calc(50% - var(--riser-w) / 2);
    top: 0;
    width: var(--riser-w);
    height: calc(var(--tread-depth) * 1px);
    transform-origin: center top;
    transform: rotateX(-90deg);
    background: #adadad;
  }
  .step-nose {
    position: absolute;
    left: calc(50% - var(--riser-w) / 2);
    top: 0;
    width: var(--riser-w);
    height: 2px;
    background: #969696;
    transform: translateZ(1px);
    pointer-events: none;
  }
  .escalator .case-meta {
    position: absolute;
    z-index: 2;
    left: 16px;
    top: 18px;
    margin: 0;
    height: auto;
    max-width: none;
    padding: 0;
    background: transparent;
    color: #4e4e4e;
    font-size: 14px;
    line-height: 1.2;
    white-space: nowrap;
    pointer-events: none;
  }
  .reel .case-meta {
    display: flex;
    gap: calc(12 * var(--k));
    align-items: center;
    margin: 0;
    max-width: none;
    height: calc(16 * var(--k));
    font-size: calc(14 * var(--k));
    line-height: normal;
    color: var(--blue);
    white-space: nowrap;
  }
  .case-meta span:nth-child(1) { width: calc(107 * var(--k)); flex: none; }
  .case-meta span:nth-child(2) { width: calc(583 * var(--k)); flex: none; }
  .case-meta span:nth-child(3) { width: calc(464 * var(--k)); flex: none; }
  .case-meta .full {
    width: calc(226 * var(--k));
    flex: none;
    text-decoration: underline dotted;
    text-underline-offset: 0.15em;
    cursor: pointer;
  }
  .reel .escalator .case-meta {
    position: absolute;
    z-index: 2;
    left: 16px;
    top: 18px;
    display: flex;
    gap: 16px;
    align-items: baseline;
    margin: 0;
    height: auto;
    max-width: calc(100vw - 32px);
    padding: 0;
    background: transparent;
    color: #4e4e4e;
    font-size: 14px;
    line-height: 1.2;
    white-space: nowrap;
    pointer-events: none;
  }
  .reel .escalator .case-meta span {
    width: auto;
    flex: none;
  }
  .reel .escalator .case-meta span:nth-child(2) {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scroller .full,
  .scroller a,
  .scroller button,
  .scroller.is-drag .full,
  .scroller.is-drag a,
  .scroller.is-drag button { cursor: pointer; }

  .reel .scroller {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(var(--tread-h) * var(--u));
    bottom: 0;
    width: 100%;
    max-width: none;
    margin: 0;
    height: auto;
    overflow: hidden;
    scrollbar-width: none;
    cursor: grab;
    overscroll-behavior-x: none;
  }
  .scroller::-webkit-scrollbar { display: none; }
  .scroller.is-drag { cursor: grabbing; }

  .track {
    display: flex;
    height: 100%;
    width: max-content;
  }

  .reel .track { align-items: flex-start; height: auto; }
  .board {
    position: relative;
    flex: none;
    width: calc(4087 * var(--u));
    height: calc(800 * var(--u));
    margin-top: 0;
    background: #d7d7d7;
    overflow: hidden;
  }

  .bar {
    position: absolute;
    top: 0;
    width: calc(76 * var(--u));
    height: 100%;
    background: rgba(0, 0, 0, 0.12);
  }

  .piece { position: absolute; overflow: hidden; }
  .piece.dark { background: #000; }
  .piece img {
    position: absolute;
    display: block;
    max-width: none;
  }
  .piece .cover { inset: 0; width: 100%; height: 100%; }
  .loose {
    position: absolute;
    display: block;
    max-width: none;
    object-fit: fill;
    pointer-events: none;
  }
  .cover { object-fit: cover; }
  .flip { transform: scaleX(-1); }
  .board img, .board video { -webkit-user-drag: none; user-select: none; }
  .board video { background: transparent; }

  .signoff {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(5 * var(--k));
    background: var(--bg);
    color: var(--blue);
    font-size: calc(14 * var(--k));
    cursor: pointer;
    user-select: none;
  }
  .signoff.is-placed { cursor: default; }
  .sign-stage {
    position: fixed;
    pointer-events: none;
    z-index: 8;
  }
  .signoff p { margin: 0; position: relative; z-index: 1; }
  .sign-lines { display: flex; gap: calc(12 * var(--k)); position: relative; z-index: 1; }
  .sign-lines i {
    display: block;
    width: calc(226 * var(--k));
    border-top: 1px solid currentColor;
  }
  .sign-imprints {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .sign-imprint {
    position: absolute;
    display: block;
    transform-origin: center center;
    pointer-events: none;
  }
  .sign-imprint .ink {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
  }
  .sign-imprint .dye {
    position: absolute;
    inset: 0;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
  .stamp-panel {
    position: fixed;
    z-index: 40;
    right: 16px;
    bottom: 16px;
    width: min(300px, calc(100vw - 32px));
    max-height: min(680px, calc(100vh - 32px));
    overflow: auto;
    padding: 12px 14px 14px;
    background: #d7d7d7;
    color: var(--blue);
    border: 1px solid var(--blue);
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.3;
  }
  .stamp-panel[hidden] { display: none; }
  .stamp-panel h2 {
    margin: 0;
    padding-right: 52px;
    font-size: 14px;

let wheelDelta = 0;

// Applied multiplier eases toward its target. Idle stays forward 1×.
// Gesture magnitude aims at boost×2 on desktop and boost×9 on coarse/mobile.
// Sign flips with the wheel/touch immediately.
const SCROLL_EASE_MS = 420;
let scrollMul = 1;
let scrollMulFrom = 1;
let scrollMulTo = 1;
let scrollMulT = 1;

// Phones and tablets. Coarse pointer covers a finger; a narrow touch viewport
// covers the same breakpoint the page already uses when the pointer query misses.
function coarseScrollDevice() {
  if (matchMedia('(pointer: coarse)').matches) return true;
  const narrow = matchMedia('(max-width: 440px)').matches;
  const touch = navigator.maxTouchPoints > 0 || matchMedia('(hover: none)').matches;
  return narrow && touch;
}

// Тот же признак, что у скролла (coarse или узкий тач), плюс брейкпоинт страницы 440px.
// Размер остаётся в CSS (vw/dvh и --step-pct), флаг обновляется на ресайз и поворот.
function riserIsPortrait() {
  if (coarseScrollDevice()) return true;
  return matchMedia('(max-width: 440px)').matches;
}
function applyRiserFrame() {
  document.documentElement.dataset.riser = riserIsPortrait() ? 'portrait' : 'landscape';
}
applyRiserFrame();
addEventListener('resize', applyRiserFrame);
addEventListener('orientationchange', applyRiserFrame);
for (const query of ['(pointer: coarse)', '(max-width: 440px)', '(hover: none)']) {
  matchMedia(query).addEventListener('change', applyRiserFrame);
}

function escalatorTouchBlocked(target) {
  return target instanceof Element && !!target.closest(
    'a, button, input, textarea, select, summary, label, .sig-modal, .stamp-panel'
  );
}

// Vertical wheel/trackpad and one-finger touch feed wheelDelta.
// Forward (deltaY > 0) and back (deltaY < 0) follow the gesture.
// The page itself does not scroll.
function onEscalatorWheel(event) {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (!wheelScrollsPage(event)) return;
  event.preventDefault();
  wheelDelta += event.deltaY;
}

function onEscalatorTouchStart(event) {
  if (!coarseScrollDevice() || event.touches.length !== 1) return;
  if (escalatorTouchBlocked(event.target)) return;
  const t = event.touches[0];
  escalatorTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
}

function onEscalatorTouchMove(event) {
  if (!escalatorTouch) return;
  const t = [...event.touches].find((touch) => touch.identifier === escalatorTouch.id);
  if (!t) return;
  const dx = t.clientX - escalatorTouch.x;
  const dy = escalatorTouch.y - t.clientY;
  escalatorTouch.x = t.clientX;
  escalatorTouch.y = t.clientY;
  const onScroller = event.target instanceof Element && !!event.target.closest('.scroller');
  if (onScroller && Math.abs(dx) > Math.abs(dy)) return;
  if (event.cancelable) event.preventDefault();
  if (dy) wheelDelta += dy;
}

function onEscalatorTouchEnd(event) {
  if (!escalatorTouch) return;
  const ended = [...event.changedTouches].some((touch) => touch.identifier === escalatorTouch.id);
  if (ended) escalatorTouch = null;
}

function scrollGestureBoost() {
  return pageScroll.boost * (coarseScrollDevice() ? 9 : 2);
}

function retargetScrollMul(next) {
  if (next === scrollMulTo) return;
  scrollMulFrom = scrollMul;
  scrollMulTo = next;
  scrollMulT = 0;
}

function stepScrollMul(dt) {
  if (scrollMulT >= 1) {
    scrollMul = scrollMulTo;
    return;
  }
  const step = (dt > 0 ? dt : 0) * 1000 / SCROLL_EASE_MS;
  scrollMulT = Math.min(1, scrollMulT + step);
  const u = scrollMulT * scrollMulT * (3 - 2 * scrollMulT);
  scrollMul = scrollMulFrom + (scrollMulTo - scrollMulFrom) * u;
}

function pageScrollMult(dt) {
  const delta = wheelDelta;
  wheelDelta = 0;
  if (delta) {
    const sign = Math.sign(delta) || 1;
    retargetScrollMul(sign * scrollGestureBoost());
  } else {
    retargetScrollMul(1);
  }
  stepScrollMul(dt);
  return scrollMul;
}

// Any vertical wheel component scrolls the page, even when deltaX is larger.
function wheelScrollsPage(event) {
  if (event.shiftKey) return false;
  return Math.abs(event.deltaY) > 0;
}

  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.03, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(42,42,42,0.42)');
  grd.addColorStop(0.3, 'rgba(55,55,55,0.18)');
  grd.addColorStop(0.62, 'rgba(70,70,70,0.05)');

function prepareStamp(model) {
  model.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.flatShading = true;
      m.envMapIntensity = o.name === 'Pad' ? 0.08 : 0.2;
      m.needsUpdate = true;
    }
  });
  model.rotation.order = 'YXZ';
  return model;
}

function cloneMaterials(root) {
  root.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
  });
}

function fitTopDown(model) {
  const pivot = new THREE.Group();
  pivot.add(model);
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  pivot.scale.setScalar(1 / diam);
  pivot.position.copy(center).multiplyScalar(-1 / diam);
  return pivot;
}

function prepareApple(gltf, skinHex) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (skinHex != null && (m.name === 'PaleGreen' || m.name === 'green')) {
        m.color.setHex(skinHex);
        m.emissive.setHex(skinHex);
        m.emissiveIntensity = 0.04;
      }
      m.roughness = 0.42;
      m.metalness = 0;
    }
  });
  return fitTopDown(model);
}

function prepareHalfApple(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((o) => {
    if (o.isMesh && o.geometry) o.geometry = o.geometry.clone();
  });
  paintApple(model);
  const body = meshByMaterial(model, 'green');
  const stem = meshByMaterial(model, 'brown');
  const flesh = meshByMaterial(model, 'brownLight');
  const leaf = meshByMaterial(model, 'DarkGreen');
  if (flesh && stem && body) {
    const cutN = worldNormal(flesh);
    const stemDir = centerOf(stem).sub(centerOf(body));
    if (cutN.lengthSq() > 1e-8 && stemDir.lengthSq() > 1e-8) {
      const qCut = new THREE.Quaternion().setFromUnitVectors(cutN, new THREE.Vector3(0, 1, 0));
      const stemFlat = stemDir.normalize().applyQuaternion(qCut);
      stemFlat.y = 0;
      if (stemFlat.lengthSq() > 1e-8) {
        const qStem = new THREE.Quaternion().setFromUnitVectors(stemFlat.normalize(), new THREE.Vector3(0, 0, 1));
        model.quaternion.copy(qStem.multiply(qCut));
      } else {
        model.quaternion.copy(qCut);
      }
    }
  }
  model.updateMatrixWorld(true);
  if (leaf && body) faceLeafToCamera(leaf, centerOf(body));
  return fitTopDown(model);
}

function prepareGreenStamp(gltf) {

  const colorDeck = [];
  let lastColor = '';
  function drawColor() {
    if (!colorDeck.length) {
      const colors = ['blue', 'pink', 'green'];
      for (let i = colors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [colors[i], colors[j]] = [colors[j], colors[i]];
      }
      if (colors[colors.length - 1] === lastColor) {
        [colors[0], colors[colors.length - 1]] = [colors[colors.length - 1], colors[0]];
      }
      colorDeck.push(...colors);
    }
    lastColor = colorDeck.pop();
    return lastColor;
  }
  function pickCast(kind) {
    const casts = kind === 'apple' ? APPLE_CASTS : STAMP_CASTS;
    const list = kind === 'apple' ? APPLE_IMPRINTS : STAMP_IMPRINTS;
    const rig = kind === 'apple' ? appleRig : stampRig;
    let cast = casts.find((item) => item.file === rig.file);
    if (!cast) {
      const color = drawColor();
      cast = casts.find((item) => item.color === color) || casts[0];
    } else {
      lastColor = cast.color;
    }
    const imprint = list.find((item) => item.file === cast.file) || list[0];
    return { ...imprint, bodyHex: cast.hex };
  }

  function sampleShot(point, rig, kind) {
    const choice = pickCast(kind);
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const span = rig.jitter * (w / 1440);
    return {
      ...choice,
      kind,
      rig,
      rot: (Math.random() * 2 - 1) * rig.rotation,
      px: (point.px + (Math.random() * 2 - 1) * span) / w,
      py: (point.py + (Math.random() * 2 - 1) * span) / h,
      placed: false,
    };
  }

  function paintMarks() {
    if (!marks.length || !host.isConnected) return;
    const h = host.clientHeight;
    if (host.clientWidth < 2 || h < 2) return;
    for (const mark of marks) {
      const rig = mark.kind === 'apple' ? appleRig : stampRig;
      const imgW = mark.kind === 'apple'
        ? (SIZE * rig.scale / viewH) * h
        : ((SIZE * rig.scale / viewH) * h) / INK_FRAC;
      mark.el.style.left = `calc(${mark.px * 100}% + ${rig.offsetX}px)`;
      mark.el.style.top = `calc(${mark.py * 100}% + ${rig.offsetY}px)`;
      mark.el.style.width = imgW + 'px';
      mark.el.style.opacity = String(rig.opacity);
      mark.el.style.filter = rig.blur > 0.01 ? `blur(${rig.blur}px)` : 'none';
      const rot = mark.kind === 'apple' ? rig.pressY - mark.rot : mark.rot;
      mark.el.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
      mark.dye.style.opacity = String(rig.tintAmount);
      mark.dye.style.background = rig.tint;
    }
  }

  function motionSeconds(base, speed) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    return (reduce ? base * 0.4 : base) / Math.max(0.25, speed);
  }

  function pressSeconds() {
    return matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.08 : 0.2;
  }

  function targetOf(current) {
    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;
    const px = current.px * w + current.rig.offsetX;
    const py = current.py * h + current.rig.offsetY;
    const size = SIZE * (current.kind === 'apple' ? current.rig.scale : current.rig.printScale);
    return {
      x: (px / w - 0.5) * viewW,
      z: (py / h - 0.5) * viewH,
      edge: viewH / 2 + size * 0.65,
    };
  }

  function squashCurve(u) {
    if (u < 0.55) return Math.sin((u / 0.55) * Math.PI / 2) * 1.12;
    const v = (u - 0.55) / 0.45;
    return 1.12 - 0.12 * (1 - (1 - v) ** 2);
  }

  function axisPose(flight, prefix) {
    const d = Math.PI / 180;
    const rig = flight.shot.rig;
    return {
      x: rig[prefix + 'X'] * d,
      y: rig[prefix + 'Y'] * d,
      z: rig[prefix + 'Z'] * d,
    };
  }

  function lerpPose(a, b, t) {
    return {
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t,
      z: a.z + (b.z - a.z) * t,
    };
  }

  function travelPose(u, from, via, to) {
    if (u <= 0.5) return lerpPose(from, via, u / 0.5);
    return lerpPose(via, to, (u - 0.5) / 0.5);
  }

  function poseFor(flight, name, u) {
    const start = axisPose(flight, 'start');
    const fly = axisPose(flight, 'fly');
    const press = axisPose(flight, 'press');
    if (name === 'descend') return travelPose(u, start, fly, press);
    if (name === 'lift') return travelPose(u, press, fly, start);
    return press;
  }

  function tintObject(root, rig) {
    root.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        if (!m.userData.baseColor) m.userData.baseColor = m.color.clone();
        m.color.copy(m.userData.baseColor);
        if (rig.tintAmount > 0) m.color.lerp(new THREE.Color(rig.tint), rig.tintAmount);
        m.transparent = rig.opacity < 0.999;
        m.opacity = rig.opacity;
        m.depthWrite = rig.opacity > 0.95;
      }
    });
  }

  function pressScales(squash, amount) {
    const signed = amount * squash;
    return {
      x: Math.max(0.12, 1 + signed),
      y: Math.max(0.12, 1 - signed * 1.35),
    };
  }

  function paintTool(root, kind, hex) {
    root.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) {
        if (kind === 'apple') {
          if (material.name !== 'green' && material.name !== 'PaleGreen') continue;
          material.color.setHex(hex);
          material.emissive.setHex(hex);
          material.emissiveIntensity = 0.08;
          continue;
        }
        const color = new THREE.Color(hex);
        if (node.name === 'Pad') color.multiplyScalar(0.78);
        else if (node.name === 'Handle') color.multiplyScalar(0.9);
        material.color.copy(color);
      }
    });
  }

  function cloneTool(source) {
    const clone = source.clone(true);
    clone.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      node.material = Array.isArray(node.material)
        ? node.material.map((material) => material.clone())
        : node.material.clone();
    });
    clone.visible = false;
    scene.add(clone);
    return clone;
  }

  function cloneShadow() {
    const mesh = shadow.clone();
    mesh.material = shadow.material.clone();
    mesh.visible = false;
    scene.add(mesh);
    return mesh;
  }

  function releaseFlight(flight) {
    scene.remove(flight.model);
    flight.model.traverse((node) => {
      if (!node.isMesh || !node.material) return;
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      for (const material of mats) material.dispose();
    });
    scene.remove(flight.shadow);
    flight.shadow.material.dispose();
    flight.model.visible = false;
    flight.shadow.visible = false;
  }

  function applyPose(flight, x, z, squashAmt, rot, presence, spin) {
    const shot = flight.shot;
    const rig = shot.rig;
    const size = SIZE * (shot.kind === 'apple' ? rig.scale : rig.printScale);
    const pressed = pressScales(rig.squash, squashAmt);
    const spread = pressed.x;
    const squat = pressed.y;
    const euler = spin || poseFor(flight, 'press', 1);
    const model = flight.model;
    model.scale.set(size * spread, size * squat, size * spread);
    model.rotation.order = 'XYZ';
    model.rotation.set(euler.x, euler.y - rot * Math.PI / 180, euler.z);
    model.position.set(x, 0.02 - Math.min(1, squashAmt) * 0.012, z);
    model.visible = true;
    if (shot.kind === 'apple') tintObject(model, rig);
    if (shot.bodyHex != null) paintTool(model, shot.kind, shot.bodyHex);
    const shade = flight.shadow;
    shade.visible = true;
    shade.position.set(x + 0.04, 0.002, z + 0.03);
    shade.material.opacity = 0.1 + presence * 0.22 + Math.min(1, squashAmt) * 0.4;
    shade.scale.setScalar(1.12 - Math.min(1, squashAmt) * 0.1);
  }

  function kindReady(kind) {
    return kind === 'apple' ? appleModel : stampModel;
  }

  function start(point) {
    const kind = pressN % 2 === 0 ? 'stamp' : 'apple';
    const source = kindReady(kind);
    if (!source) {
      queued.push(point);
      return;
    }
    pressN += 1;
    const rig = kind === 'stamp' ? stampRig : appleRig;
    const shot = sampleShot(point, rig, kind);
    const flight = {
      shot,
      phase: 'descend',
      phaseU: 0,
      model: cloneTool(source),
      shadow: cloneShadow(),
    };
    flights.push(flight);
    const ui = fileUis.find((item) => item.kind === kind);
    if (ui) ui.last.textContent = 'Сейчас: ' + shot.file;
    refreshFiles();
    const goal = targetOf(shot);
    applyPose(flight, goal.x, goal.edge, 0, shot.rot, 0, poseFor(flight, 'descend', 0));
  }

  function drainQueue() {
    while (queued.length) {
      const kind = pressN % 2 === 0 ? 'stamp' : 'apple';
      if (!kindReady(kind)) return;
      start(queued.shift());
    }
  }

  function stepFlight(flight, dt) {
    const shot = flight.shot;
    if (flight.phase === 'rest') {
      if (shot.rig.liftAway) {
        flight.phase = 'lift';
        flight.phaseU = 0;
      } else {
        const goal = targetOf(shot);
        applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      }
      return false;
    }
    const goal = targetOf(shot);
    if (flight.phase === 'descend') {
      flight.phaseU += dt / motionSeconds(0.62, shot.rig.descent);
      const u = Math.min(1, flight.phaseU);
      const k = 1 - (1 - u) ** 3;
      applyPose(flight, goal.x, goal.edge + (goal.z - goal.edge) * k, 0, shot.rot, k, poseFor(flight, 'descend', u));
      if (u >= 1) { flight.phase = 'press'; flight.phaseU = 0; }
    } else if (flight.phase === 'press') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      applyPose(flight, goal.x, goal.z, squashCurve(u), shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.5) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'repress') {
      flight.phaseU += dt / pressSeconds();
      const u = Math.min(1, flight.phaseU);
      const sq = 1 + Math.sin(Math.min(1, u) * Math.PI) * 0.35;
      applyPose(flight, goal.x, goal.z, sq, shot.rot, 1, poseFor(flight, 'press', 1));
      if (u >= 0.2) placeInk(shot);
      if (u >= 1) { flight.phase = 'dwell'; flight.phaseU = 0; }
    } else if (flight.phase === 'dwell') {
      applyPose(flight, goal.x, goal.z, 1, shot.rot, 1, poseFor(flight, 'press', 1));
      placeInk(shot);
      if (shot.rig.dwell <= 0.001) {
        flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
        flight.phaseU = 0;
      } else {
        flight.phaseU += dt / shot.rig.dwell;
        if (flight.phaseU >= 1) {
          flight.phase = shot.rig.liftAway ? 'lift' : 'rest';
          flight.phaseU = 0;
        }
      }
    } else if (flight.phase === 'lift') {
      flight.phaseU += dt / motionSeconds(0.42, shot.rig.lift);
      const u = Math.min(1, flight.phaseU);
      const k = u * u;
      const release = Math.max(0, 1 - Math.min(1, u / 0.28));
      applyPose(flight, goal.x, goal.z + (goal.edge - goal.z) * k, release, shot.rot, 1 - k, poseFor(flight, 'lift', u));
      if (u >= 1) {
        releaseFlight(flight);
        return true;
      }
    }
    return false;
  }

  function step(dt) {
    for (let i = flights.length - 1; i >= 0; i--) {
      if (stepFlight(flights[i], dt)) flights.splice(i, 1);
    }
  }

  function onClick(e) {
    if (!alive) return;
    const hr = host.getBoundingClientRect();
    const point = { px: e.clientX - hr.left, py: e.clientY - hr.top };
    start(point);
  }
  host.addEventListener('click', onClick);

  function isTyping(el) {
    while (el && el !== document.body) {
      if (el.isContentEditable) return true;
      const tag = el.tagName;
      if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (tag === 'INPUT') {
        const type = (el.type || 'text').toLowerCase();
        return type !== 'range' && type !== 'checkbox' && type !== 'radio' && type !== 'button';
      }
      el = el.parentElement;
    }
    return false;
  }

  function onKey(e) {
    if (e.repeat) return;
    if (e.code === 'Escape' && !panel.hidden && !isTyping(e.target)) {
      panel.hidden = true;
      return;
    }
    if (e.code !== 'KeyG' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(e.target) || isTyping(document.activeElement)) return;
    e.preventDefault();
    panel.hidden = !panel.hidden;
  }
  addEventListener('keydown', onKey);
  close.addEventListener('click', () => { panel.hidden = true; });

  function frame() {
    const w = host.clientWidth;
    const h = host.clientHeight;
    if (w < 2 || h < 2) return;
    viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    placeStage();
    paintMarks();
  }
  const ro = new ResizeObserver(frame);
  ro.observe(host);
  frame();

  function mountTool(kind, fitted) {
    const group = new THREE.Group();
    group.add(fitted);
    group.scale.setScalar(SIZE);
    group.visible = false;
    scene.add(group);
    if (kind === 'stamp') stampModel = group;
    else appleModel = group;
    drainQueue();
  }

  new GLTFLoader().load('models/stamp_round.glb', (gltf) => {
    if (!alive) return;
    mountTool('stamp', fitTopDown(prepareStamp(gltf.scene)));
  });
  new GLTFLoader().load('models/apple_half_green.glb', (gltf) => {
    if (!alive) return;
    mountTool('apple', prepareHalfApple(gltf));
  });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0;
    lastNow = now;
    step(dt);
    placeStage();
    renderer.render(scene, camera);
  });

  return () => {
    alive = false;
    while (flights.length) releaseFlight(flights.pop());
    host.removeEventListener('click', onClick);
    removeEventListener('keydown', onKey);
    renderer.setAnimationLoop(null);
    ro.disconnect();
    renderer.dispose();
    canvas.remove();
    panel.remove();
    layer.remove();
  };
}

// Полосы 1–4: клик поднимает объект из-за нижнего края, вид строго сверху, и сразу уводит вниз.
function mountBandDrops(root) {
  const bands = [...root.querySelectorAll('.escalator-track > .case:not(.is-clone)')].slice(0, 4);
  const clones = [...root.querySelectorAll('.escalator-track > .case.is-clone')];
  if (!bands.length) return () => {};

  const layer = document.createElement('div');
  layer.className = 'band-drop';
  const canvas = document.createElement('canvas');
  layer.appendChild(canvas);
  root.appendChild(layer);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 20);
  camera.position.set(0, 8, 0);
  camera.up.set(0, 0, -1);
  camera.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  const key = new THREE.DirectionalLight(0xfff7f2, 1.8);
  key.position.set(-2.2, 6, -1.6);
  scene.add(key);

  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({
      map: softBlobTexture(),
      transparent: true,
      depthWrite: false,
      toneMapped: false,
      opacity: 0,
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.visible = false;
  shadow.renderOrder = -1;
  scene.add(shadow);

  const actors = [null, null, null, null];
  let alive = true;
  let playing = false;
  let startedAt = 0;
  let pending = -1;
  let landX = 0;
  let landZ = 0;
  let offZ = 0;
  let upMs = 620;
  let downMs = 340;
  const SIZE = 0.46;

  function frame() {
    const w = innerWidth;
    const h = innerHeight;
    if (w < 2 || h < 2) return;
    const viewH = 2;
    const viewW = viewH * (w / h);
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.left = -viewW / 2;
    camera.right = viewW / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  frame();
  addEventListener('resize', frame);

  function worldOf(sx, sy) {
    const viewH = camera.top - camera.bottom;
    const viewW = camera.right - camera.left;
    return {
      x: (sx / innerWidth - 0.5) * viewW,
      z: (sy / innerHeight - 0.5) * viewH,
    };
  }

  function pageBottomZ() {
    const radiusPx = (SIZE / 2) * innerHeight / 2 + 36;
    return worldOf(innerWidth / 2, innerHeight + radiusPx).z;
  }

  function begin(index, now) {
    const actor = actors[index];
    if (!actor) {
      pending = index;
      return;
    }
    actors.forEach((item) => { if (item) item.visible = false; });
    const band = bands[index].getBoundingClientRect();
    const visTop = Math.max(band.top, 0);
    const visBot = Math.min(band.bottom, innerHeight);
    const sy = visTop < visBot ? (visTop + visBot) / 2 : band.top + band.height / 2;
    const spot = worldOf(band.left + band.width / 2, sy);
    landX = spot.x;
    landZ = spot.z;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const bottom = pageBottomZ();
    if (reduce) {
      const hop = Math.abs(worldOf(0, 96).z - worldOf(0, 0).z);
      offZ = landZ + Math.min(hop, Math.abs(bottom - landZ));
      upMs = 200;
      downMs = 160;
    } else {
      offZ = bottom;
      upMs = 620;
      downMs = 340;
    }
    actor.visible = true;
    actor.rotation.set(0, 0, 0);
    actor.position.set(landX, 0.03, offZ);
    actor.scale.setScalar(SIZE);
    shadow.visible = true;
    playing = true;
    pending = -1;
    startedAt = now;
  }

  function pose(now) {
    const actor = actors.find((item) => item && item.visible);
    if (!playing || !actor) return;
    const t = now - startedAt;
    let k;
    let z;
    if (t < upMs) {
      k = 1 - (1 - t / upMs) ** 3;
      z = landZ + (offZ - landZ) * (1 - k);
    } else if (t < upMs + downMs) {
      const u = (t - upMs) / downMs;
      k = 1 - (1 - u) ** 2;
      z = landZ + (offZ - landZ) * k;
    } else {
      actor.visible = false;
      shadow.visible = false;
      playing = false;
      return;
    }
    actor.rotation.set(0, 0, 0);
    actor.position.set(landX, 0.03, z);
    shadow.position.set(landX + 0.02, 0.002, z + 0.03);
    const settled = t < upMs ? k : 1 - k;
    shadow.material.opacity = 0.15 + settled * 0.5;
    shadow.scale.setScalar(1.05 - settled * 0.1);
  }

  const stops = bands.map((band, index) => {
    let gesture = null;
    function onDown(e) {
      if (e.button !== 0 || playing) return;
      gesture = { id: e.pointerId, x: e.clientX, y: e.clientY };
    }
    function onUp(e) {
      if (!gesture || e.pointerId !== gesture.id) return;
      const dx = e.clientX - gesture.x;
      const dy = e.clientY - gesture.y;
      gesture = null;
      if (playing || dx * dx + dy * dy > 64) return;
      begin(index, performance.now());
    }
    const targets = [band, clones[index]].filter(Boolean);
    targets.forEach((target) => {
      target.addEventListener('pointerdown', onDown);
      target.addEventListener('pointerup', onUp);
    });
    return () => {
      targets.forEach((target) => {
        target.removeEventListener('pointerdown', onDown);
        target.removeEventListener('pointerup', onUp);
      });
    };
  });

  Promise.all([
    new GLTFLoader().loadAsync(APPLE_FILE),
    new GLTFLoader().loadAsync(STAMP_FILE),
  ]).then(([appleGltf, stampGltf]) => {
    if (!alive) return;
    const built = [
      prepareApple(appleGltf, APPLE_RED),
      prepareGreenStamp(stampGltf),
      prepareApple(appleGltf, null),
      prepareGreenStamp(stampGltf),
    ];
    built.forEach((fitted, i) => {
      const rig = new THREE.Group();
      rig.add(fitted);
      rig.visible = false;
      actors[i] = rig;
      scene.add(rig);
    });
    if (pending >= 0 && !playing) begin(pending, performance.now());
  }).catch((err) => { globalThis.__dropErr = String(err); });

  renderer.setAnimationLoop((now) => {
    if (!alive) return;
    pose(now);
    globalThis.__drop = { playing, pending, n: actors.filter(Boolean).length, t: playing ? now - startedAt : -1 };
    renderer.render(scene, camera);
  });

  return () => {
    alive = false;
    stops.forEach((stop) => stop());
    removeEventListener('resize', frame);
    renderer.setAnimationLoop(null);
    renderer.dispose();
    layer.remove();
  };
}

function weldSmoothGeometry(geometry) {
  const source = geometry.clone();
  for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) source.deleteAttribute(name);
  const merged = BufferGeometryUtils.mergeVertices(source, 1e-4);
  source.dispose();
  merged.computeVertexNormals();
  return merged;
}

function applyShadeSmooth(root, smooth) {
  if (!root) return;
  root.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    if (!node.userData.flatGeometry) {
      node.userData.flatGeometry = node.geometry;
      node.userData.smoothGeometry = weldSmoothGeometry(node.geometry);
    }
    node.geometry = smooth ? node.userData.smoothGeometry : node.userData.flatGeometry;
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    for (const material of mats) {
      if (!material) continue;
      material.flatShading = !smooth;
      material.needsUpdate = true;
    }
  });
}

const HEADER_APPLE_FILE = 'design/stub/models/apple-corner.glb';
const HEADER_APPLE_GREEN = 0x56ae08;
const HEADER_STEM = 0x8b5a2b;

function prepareHeaderApple(gltf) {
  const model = gltf.scene.clone(true);
  cloneMaterials(model);
  model.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    if (mats.some((material) => material && /green_apple_2_texture/i.test(material.name || ''))) {
      node.userData.appleStem = true;
    }
  });
  model.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    const prev = Array.isArray(node.material) ? node.material : [node.material];
    if (node.userData.appleStem) {
      const next = prev.map((material) => {
        if (!material) return material;
        const stem = material.clone();
        stem.name = 'stem';
        stem.color.setHex(HEADER_STEM);
        if (stem.emissive) {
          stem.emissive.setHex(0x000000);
          stem.emissiveIntensity = 0;
        }
        stem.map = stem.envMap = stem.normalMap = stem.roughnessMap = stem.metalnessMap = stem.aoMap = stem.emissiveMap = null;
        return stem;
      });
      node.material = Array.isArray(node.material) ? next : next[0];
      for (const old of prev) {
        if (old && !next.includes(old)) old.dispose();
      }
      return;
    }
    let side = THREE.FrontSide;
    for (const material of prev) {
      if (material && material.side === THREE.DoubleSide) side = THREE.DoubleSide;
    }
    const material = new THREE.MeshStandardMaterial({
      name: 'plane',
      color: HEADER_APPLE_GREEN,
      metalness: 0,
      roughness: 0.55,
      emissive: 0x000000,
      emissiveIntensity: 0,
      envMapIntensity: 0,
      side,
      flatShading: false,
    });
    node.material = material;
    for (const old of prev) {
      if (old && old !== material) old.dispose();
    }
  });
  applyShadeSmooth(model, true);
  return fitTopDown(model);
}

function mountEscalator(root) {
  const viewport = root.querySelector('.escalator');
  const track = viewport && viewport.querySelector('.escalator-track');
  const stage = viewport && viewport.querySelector('.escalator-stage');
  if (!track) return () => {};
  const originals = [...track.children].filter((el) => el.classList.contains('case'));
  for (const step of originals) {
    const copy = step.cloneNode(true);
    copy.setAttribute('aria-hidden', 'true');
    copy.classList.add('is-clone');
    track.appendChild(copy);
  }
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let alive = true;
  let y = 0;
  let last = performance.now();
  addEventListener('wheel', onEscalatorWheel, { passive: false });
  addEventListener('touchstart', onEscalatorTouchStart, { passive: true });
  addEventListener('touchmove', onEscalatorTouchMove, { passive: false });
  addEventListener('touchend', onEscalatorTouchEnd);
  addEventListener('touchcancel', onEscalatorTouchEnd);

  function placeStage() {
    if (!stage) return;
    const near = Number(escalator.near) || 0;
    const zoom = Number(escalator.scale) || 1;
    stage.style.transform = `translateZ(${near}px) scale(${zoom})`;
  }

  function articulate() {
    const viewH = viewport.clientHeight;
    if (viewH <= 0) return;
    const recess = escalator.recess;
    const nose = 0.72;
    for (const step of track.querySelectorAll('.case')) {
      const rise = step.offsetHeight;
      const stepFrac = Math.max(rise / viewH, 0.01);
      const top = (step.offsetTop - y) / viewH;
      let depth = -recess * (nose - top) / stepFrac;
      if (depth > 0) depth = 0;
      const cap = Math.max(recess, 1) * 8;
      if (depth < -cap) depth = -cap;
      const rig = step.querySelector('.step-rig');
      if (rig) {
        rig.style.transform = `translateZ(${depth}px)`;
        const shade = Math.min(1, Math.max(0, -depth / Math.max(recess, 1)));
        rig.style.setProperty('--step-shade', shade.toFixed(3));
      }
      const tread = step.querySelector('.step-tread');
      if (!tread) continue;
      let fold = 0;
      if (top < -0.04) fold = Math.min(1, (-top - 0.04) / 0.2);
      else if (top > 1.02) fold = Math.min(1, (top - 1.02) / 0.2);
      tread.style.transform = `rotateX(${-90 * (1 - fold)}deg)`;
      tread.style.setProperty('--fold', fold.toFixed(3));
    }
  }

  function tick(now) {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const step = originals[0];
    const loopH = step ? step.offsetHeight * originals.length : 0;
    if (!motion.matches && loopH > 0) {
      const scale = innerWidth / DESIGN_W;
      y += STRIP_SPEED * escalator.speed * pageScrollMult(dt) * scale * dt;
      y = ((y % loopH) + loopH) % loopH;
    } else {
      pageScrollMult(dt);
    }
    track.style.transform = `translate3d(0, ${-y}px, 0)`;
    placeStage();
    articulate();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  return () => {
    alive = false;
    removeEventListener('wheel', onEscalatorWheel);
    removeEventListener('touchstart', onEscalatorTouchStart);
    removeEventListener('touchmove', onEscalatorTouchMove);
    removeEventListener('touchend', onEscalatorTouchEnd);
    removeEventListener('touchcancel', onEscalatorTouchEnd);
    escalatorTouch = null;
  };
}

function fitBoards(root) {
  const u = innerWidth / DESIGN_W;
  for (const board of root.querySelectorAll('.board')) {
    const scroller = board.closest('.scroller');
    const riser = scroller ? scroller.clientHeight : 0;
    const natural = 800 * u;
    const fit = riser > 0 && natural > 0 ? Math.max(1, riser / natural) : 1;
    board.style.setProperty('--u', `${u * fit}px`);
    board.style.marginTop = `${(riser - natural * fit) / 2}px`;
  }
}

function mountStrip(root) {
  applyEscalatorVars();
  const stopEscalator = mountEscalator(root);
  const stopControls = mountEscalatorControls();
  const scrollers = [...root.querySelectorAll('.escalator-track > .case .scroller')];
  const stops = scrollers.map((scroller, index) => mountScroller(scroller, index));
  const stopFx = mountBoardFx(root);
  const refit = () => { if (root.querySelector('.board')) fitBoards(root); };
  if (root.querySelector('.board')) {
    requestAnimationFrame(refit);
    addEventListener('resize', refit);
  }
  return () => {
    removeEventListener('resize', refit);
    stopEscalator();
    stopControls();
    stops.forEach((stop) => stop());
    stopFx();
  };
}

function mountScroller(scroller) {
  const board = scroller.querySelector('.board');
  let alive = true;
  let drag = null;
  let wrapping = false;
  let pos = scroller.scrollLeft;

  function park(next) {
    const loop = loopWidth();
    if (loop > 0) next = ((next % loop) + loop) % loop;
    pos = next;
    wrapping = true;
    scroller.scrollLeft = next;
    wrapping = false;
  }

  function loopWidth() {
    return board.getBoundingClientRect().width;
  }

  function ensureCopies() {
    if (!alive) return;
    const loop = loopWidth();
    if (loop <= 0) return;
    const need = Math.max(2, Math.ceil(scroller.clientWidth / loop) + 1);
    const track = board.parentElement;
    while (track.children.length < need) {
      const copy = board.cloneNode(true);
      copy.setAttribute('aria-hidden', 'true');
      track.appendChild(copy);
      copy.querySelectorAll('video').forEach((video) => {
        video.muted = true;
        video.play().catch(() => {});
      });
    }
  }

  function wrap() {
    const loop = loopWidth();
    if (loop <= 0 || wrapping) return;
    const x = scroller.scrollLeft;
    if (x >= loop) park(x - loop);
    else if (x < 0) park(x + loop);
  }

  function onWheel(event) {
    if (!wheelScrollsPage(event)) event.preventDefault();
  }

  function onScroll() {
    if (!wrapping) wrap();
  }

  function onDown(event) {
    if (event.button !== 0) return;
    drag = { x: event.clientX, left: scroller.scrollLeft };
    scroller.classList.add('is-drag');
    try { scroller.setPointerCapture(event.pointerId); } catch (err) { /* synthetic */ }
  }

  function onMove(event) {
    if (!drag) return;
    const loop = loopWidth();
    let next = drag.left - (event.clientX - drag.x);
    if (loop > 0) next = ((next % loop) + loop) % loop;
    pos = next;
    scroller.scrollLeft = next;
  }

  function onUp() {
    drag = null;
    scroller.classList.remove('is-drag');
  }

  ensureCopies();
  board.querySelectorAll('video').forEach((video) => {
    video.muted = true;
    video.play().catch(() => {});
  });
  addEventListener('resize', ensureCopies);
  scroller.addEventListener('wheel', onWheel, { passive: false });
  scroller.addEventListener('scroll', onScroll, { passive: true });
  scroller.addEventListener('pointerdown', onDown);
  scroller.addEventListener('pointermove', onMove);
  scroller.addEventListener('pointerup', onUp);
  scroller.addEventListener('pointercancel', onUp);

  return () => {
    alive = false;
    removeEventListener('resize', ensureCopies);
  };
}

function nearestTurn(target, current) {
  const tau = Math.PI * 2;
  return target + Math.round((current - target) / tau) * tau;
}

function launch(tx, ty) {
  destFx = tx;

  e = 0.64;

  yawVel += 3.6;
  if (Math.abs(fy - ty) < 0.02 && Math.abs(fx - tx) < 0.02) {
    phase = 'settle';
    vy = 0;
    return;
  }
  phase = 'fly';
  if (fy > ty + 0.012) {
    vy = -Math.sqrt(2 * G * (fy - ty + 0.16));
  } else {
    vy = 0.02;
  }
}

const fill = new THREE.DirectionalLight(0xffffff, 0.1);
fill.position.set(2.4, 5, -1.6);
scene.add(fill);

function shadowTexture() {
  const s = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, s * 0.02, s / 2, s / 2, s * 0.5);
  grd.addColorStop(0, 'rgba(58,58,58,0.55)');
  grd.addColorStop(0.22, 'rgba(68,68,68,0.22)');
  grd.addColorStop(0.5, 'rgba(80,80,80,0.07)');
  grd.addColorStop(1, 'rgba(80,80,80,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

const shadowMat = new THREE.MeshBasicMaterial({
  map: shadowTexture(),
  transparent: true,
  depthWrite: false,
  toneMapped: false,
  opacity: 0.48,
  side: THREE.DoubleSide,
});
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMat);
shadow.position.set(0.4, -1.2, -0.22);
shadow.scale.setScalar(4.1);
shadow.lookAt(camera.position);
shadow.renderOrder = -2;
scene.add(shadow);

const spin = new THREE.Group();
const aim = new THREE.Group();
spin.add(aim);
scene.add(spin);

const SKIN = { color: 0x67c514, emissive: 0x7be81a, emissiveIntensity: 0.1, metalness: 0, roughness: 0.42 };
const STEM = { color: 0x7a4e28, emissive: 0x000000, emissiveIntensity: 0, metalness: 0, roughness: 0.64 };
const LEAF = { color: 0x2f861f, emissive: 0x14300a, emissiveIntensity: 0.18, metalness: 0, roughness: 0.52 };
const FLESH = { color: 0xf6e0b8, emissive: 0xf0d0a0, emissiveIntensity: 0.08, metalness: 0, roughness: 0.62 };
const SEED = { color: 0x6b3a22, emissive: 0x2a140c, emissiveIntensity: 0.04, metalness: 0, roughness: 0.5 };
const LOOK = {
  PaleGreen: SKIN,
  green: SKIN,
  DarkBrown: STEM,
  brown: STEM,
  _defaultMat: STEM,
  DarkGreen: LEAF,
  brownLight: FLESH,
  brownDark: SEED,
};

function materialsOf(mesh) {
  return Array.isArray(mesh.material) ? mesh.material : [mesh.material];
}

function smoothShade(root, tolerance = 1e-4) {
  let before = 0, after = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.geometry;
    before += src.attributes.position.count;
    for (const name of ['normal', 'uv', 'uv1', 'uv2', 'uv3', 'tangent', 'color']) src.deleteAttribute(name);
    const merged = BufferGeometryUtils.mergeVertices(src, tolerance);
    merged.computeVertexNormals();
    src.dispose();
    o.geometry = merged;
    after += merged.attributes.position.count;
    for (const m of materialsOf(o)) {
      m.flatShading = false;
      m.needsUpdate = true;
    }
  });
  return { before, after };
}

function meshByMaterial(root, name) {
  let found = null;
  root.traverse((o) => {
    if (o.isMesh && materialsOf(o).some((m) => m.name === name)) found = o;
  });
  return found;
}

function paintApple(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of materialsOf(o)) {
      const look = LOOK[m.name];
      if (!look) continue;
      m.color.setHex(look.color);
      m.emissive.setHex(look.emissive);
      m.emissiveIntensity = look.emissiveIntensity;
      m.metalness = look.metalness;
      m.roughness = look.roughness;
      const skin = m.name === 'PaleGreen' || m.name === 'green';
      m.envMapIntensity = skin ? 0.22 : 0.12;
      m.side = m.name === 'DarkGreen' ? THREE.DoubleSide : THREE.FrontSide;
      m.flatShading = false;
      if (m.name === 'brownDark') {
        m.polygonOffset = true;
        m.polygonOffsetFactor = -2;
        m.polygonOffsetUnits = -2;
      }
      m.needsUpdate = true;
    }
  });
}

// Лист в модели стоит ребром. Разворачиваем пластинку нормалью к камере,
// вращая вокруг основания — ближайшей к телу вершины.
function faceLeafToCamera(leaf, bodyCenter) {
  const viewDir = new THREE.Vector3(0, 1, 0);
  leaf.updateWorldMatrix(true, false);
  const toWorld = leaf.matrixWorld;
  const attr = leaf.geometry.attributes.position;
  const pts = [];
  for (let i = 0; i < attr.count; i++) {
    pts.push(new THREE.Vector3().fromBufferAttribute(attr, i).applyMatrix4(toWorld));
  }
  const mean = new THREE.Vector3();
  for (const p of pts) mean.add(p);
  mean.multiplyScalar(1 / pts.length);

  const c = new Array(9).fill(0);
  for (const p of pts) {
    const d = p.clone().sub(mean);
    c[0] += d.x * d.x; c[1] += d.x * d.y; c[2] += d.x * d.z;
    c[4] += d.y * d.y; c[5] += d.y * d.z; c[8] += d.z * d.z;
  }
  c[3] = c[1]; c[6] = c[2]; c[7] = c[5];
  const trace = c[0] + c[4] + c[8];
  const m = c.map((x, i) => (i % 4 === 0 ? trace - x : -x));
  const n = new THREE.Vector3(0.41, 0.82, 0.41).normalize();
  for (let i = 0; i < 80; i++) {
    n.set(
      m[0] * n.x + m[1] * n.y + m[2] * n.z,
      m[3] * n.x + m[4] * n.y + m[5] * n.z,
      m[6] * n.x + m[7] * n.y + m[8] * n.z,
    ).normalize();
  }
  if (n.dot(viewDir) < 0) n.negate();

  let base = pts[0], best = Infinity;
  for (const p of pts) {
    const d2 = p.distanceToSquared(bodyCenter);
    if (d2 < best) { best = d2; base = p; }
  }
  const world = new THREE.Matrix4()
    .makeTranslation(base.x, base.y, base.z)
    .multiply(new THREE.Matrix4().makeRotationFromQuaternion(
      new THREE.Quaternion().setFromUnitVectors(n, viewDir)))
    .multiply(new THREE.Matrix4().makeTranslation(-base.x, -base.y, -base.z));
  const inv = new THREE.Matrix4().copy(toWorld).invert();
  leaf.geometry.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, world).multiply(toWorld));
  leaf.geometry.computeVertexNormals();
}

function centerOf(mesh) {
  return new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
}

let ready = false;
let shadeStats = null;
let bodyMat = null;

function worldNormal(mesh) {
  const attr = mesh.geometry.attributes.normal;
  const n = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  for (let i = 0; i < attr.count; i++) n.add(tmp.fromBufferAttribute(attr, i));
  mesh.updateWorldMatrix(true, false);
  return n.transformDirection(mesh.matrixWorld).normalize();
}

// Половинка Kenney: кожура с одной стороны, плоский срез (мякоть и семечки) с другой.
const gltf = await new GLTFLoader().loadAsync('models/apple_half_green.glb');
const model = gltf.scene;
shadeStats = smoothShade(model);
paintApple(model);

const body = meshByMaterial(model, 'green');
const stem = meshByMaterial(model, 'brown');
const flesh = meshByMaterial(model, 'brownLight');
const leaf = meshByMaterial(model, 'DarkGreen');
bodyMat = materialsOf(body).find((m) => m.name === 'green');

aim.add(model);
spin.updateMatrixWorld(true);

// Срез смотрит в камеру (+Y), черенок — вверх кадра (+Z).
{
  const cutN = worldNormal(flesh);
  const stemDir = centerOf(stem).sub(centerOf(body));
  if (cutN.lengthSq() > 1e-8 && stemDir.lengthSq() > 1e-8) {
    const qCut = new THREE.Quaternion().setFromUnitVectors(cutN, new THREE.Vector3(0, 1, 0));
    const stemFlat = stemDir.normalize().applyQuaternion(qCut);
    stemFlat.y = 0;
    if (stemFlat.lengthSq() > 1e-8) {
      const qStem = new THREE.Quaternion().setFromUnitVectors(stemFlat.normalize(), new THREE.Vector3(0, 0, 1));
      model.quaternion.copy(qStem.multiply(qCut));
    } else {
      model.quaternion.copy(qCut);
    }
  }
}
spin.updateMatrixWorld(true);
if (leaf) faceLeafToCamera(leaf, centerOf(body));

// Масштаб: диаметр тела = 1. Центр тела — в начале координат.
{
  const box = new THREE.Box3().setFromObject(body);
  const size = box.getSize(new THREE.Vector3());
  const diam = Math.max(size.x, size.z, 1e-6);
  const c = box.getCenter(new THREE.Vector3());
  model.scale.setScalar(1 / diam);
  model.position.copy(c).multiplyScalar(-1 / diam);
}
spin.updateMatrixWorld(true);

// Чуть в три четверти: плоскость среза к зрителю, с краю видна кожура.
aim.rotation.x = 0.2;
aim.rotation.z = -0.5;
spin.updateMatrixWorld(true);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
resize();

function updateCamera() {
  const w = innerWidth, h = innerHeight;
  const applePx = APPLE_D * (w / DESIGN_W);
  const worldPerPx = 1 / applePx;
  const visibleW = w * worldPerPx;
  const visibleH = h * worldPerPx;
  const sx = fx * w;
  const sy = fy * h;
  camera.left = -(sx / w) * visibleW;
  camera.right = camera.left + visibleW;
  camera.top = (sy / h) * visibleH;
  camera.bottom = camera.top - visibleH;
  camera.updateProjectionMatrix();
}

function step(dt) {
  if (phase === 'fly') {
    flyT += dt;
    const prev = fy;
    vy += G * dt;
    fy += vy * dt;
    fx += (destFx - fx) * (1 - Math.exp(-5 * dt));
    yaw += yawVel * dt;
    yawVel *= Math.exp(-dt * 0.55);
    if (vy > 0 && prev <= destFy && fy >= destFy) {
      fy = destFy;
      if (Math.abs(vy) < 0.34) {
        vy = 0;
        phase = 'settle';
      } else {
        vy = -vy * e;
        e *= 0.73;
        yawVel += 1.8 + Math.abs(vy) * 1.4;
      }
    }
    if (flyT > 7) {
      fx = destFx;
      fy = destFy;
      vy = 0;
      phase = 'settle';
    }
    const air = Math.min(Math.abs(vy) * 0.45, 0.4);
    spin.scale.setScalar(1 + air * 0.07);
    shadow.scale.setScalar(4.1 * (1 + air * 0.35));
    shadowMat.opacity = 0.48 * (1 - air * 0.28);
  } else if (phase === 'scroll') {
    const target = -scrollY * SPIN_PER_PX;
    yaw += (target - yaw) * (1 - Math.exp(-dt * 8));
    yawVel = 0;
    const a = heroAnchor();
    fx += (a.fx - fx) * (1 - Math.exp(-dt * 10));
    fy += (a.fy - fy) * (1 - Math.exp(-dt * 10));
    spin.scale.setScalar(1);
    shadow.scale.setScalar(4.1);
    shadowMat.opacity = 0.48;
  } else if (phase === 'settle') {
    const raw = route === 'hero' ? -scrollY * SPIN_PER_PX : 0;
    const target = route === 'hero' ? raw : nearestTurn(raw, yaw);
    yaw += (target - yaw) * (1 - Math.exp(-dt * 4));
    yawVel = 0;
    fx += (destFx - fx) * (1 - Math.exp(-dt * 8));
    fy += (destFy - fy) * (1 - Math.exp(-dt * 8));
    spin.scale.setScalar(1);
    shadow.scale.setScalar(4.1);
    shadowMat.opacity = 0.48;
    if (Math.abs(target - yaw) < 0.02 && Math.abs(destFy - fy) < 0.004) {
      phase = route === 'hero' ? 'scroll' : 'rest';
    }
  } else {
    yaw += (nearestTurn(0, yaw) - yaw) * (1 - Math.exp(-dt * 4));
    spin.scale.setScalar(1);
    shadow.scale.setScalar(4.1);
    shadowMat.opacity = 0.48;
  }
  const scrollQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const pitchQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dragPitch);
  const turnQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), dragYaw);
  spin.quaternion.copy(turnQ).multiply(pitchQ).multiply(scrollQ);
}

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();

function overInteractive(event) {
  const t = event.target;
  return t instanceof Element && !!t.closest('a, button, input, textarea, select, summary, label, .scroller');
}

function pointerHitsApple(event) {
  pointerNdc.set((event.clientX / innerWidth) * 2 - 1, -(event.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointerNdc, camera);
  return raycaster.intersectObject(model, true).length > 0;
}

addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || !ready) return;
  if (document.body.dataset.route === 'board') return;
  if (overInteractive(event)) return;
  if (!pointerHitsApple(event)) return;
  grab = { id: event.pointerId, x: event.clientX, y: event.clientY };
  document.body.style.cursor = 'grabbing';
  event.preventDefault();
});

addEventListener('pointermove', (event) => {
  if (document.body.dataset.route === 'board') {
    if (grab) grab = null;
    if (document.body.style.cursor) document.body.style.cursor = '';
    return;
  }
  if (grab && event.pointerId === grab.id) {
    const dx = event.clientX - grab.x;
    const dy = event.clientY - grab.y;
    grab.x = event.clientX;
    grab.y = event.clientY;
    dragYaw += dx * 0.012;
    dragPitch = Math.max(-1.35, Math.min(1.35, dragPitch + dy * 0.012));
    return;
  }
  if (grab) return;
  document.body.style.cursor = !overInteractive(event) && pointerHitsApple(event) ? 'grab' : '';
});

function endGrab(event) {
  if (!grab || event.pointerId !== grab.id) return;
  grab = null;
  document.body.style.cursor = '';
}
addEventListener('pointerup', endGrab);
addEventListener('pointercancel', endGrab);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (ready) step(dt);
  updateCamera();
  renderer.render(scene, camera);
});

ready = true;

const col = bodyMat.color;
globalThis.__apple = {
  THREE,
  scene,
  camera,
  spin,
  shadeStats,
  debug: () => ({
    route,
    phase,
    fx, fy, vy, yaw, yawVel, e,
    dragYaw, dragPitch,
    shade: shadeStats,
    model: 'models/apple_half_green.glb',
    body: col.getStyle(),
    stem: materialsOf(stem).find((m) => m.name === 'brown').color.getStyle(),
    flesh: materialsOf(flesh).find((m) => m.name === 'brownLight').color.getStyle(),
    scrollY,
  }),
};
</script>
<script>
(function () {
  var themes = ['0', '1', '2', '3'];
  var root = document.documentElement;
  document.addEventListener('click', function (event) {
    var btn = event.target.closest && event.target.closest('.crosshair');
    if (!btn) return;
    event.preventDefault();
    var i = themes.indexOf(root.dataset.theme || '0');
    if (i < 0) i = -1;
    root.dataset.theme = themes[(i + 1) % themes.length];
    root.dispatchEvent(new CustomEvent('vanok-theme'));
  });
  function syncViewport() {
    var vv = window.visualViewport;
    var layoutH = window.innerHeight || root.clientHeight || 0;
    var top = vv ? vv.offsetTop : 0;
    var h = vv ? vv.height : layoutH;
    var lift = Math.max(0, layoutH - top - h);
    root.style.setProperty('--vv-lift', lift + 'px');
  }
  syncViewport();
  window.addEventListener('resize', syncViewport);
  window.addEventListener('orientationchange', syncViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewport);
    window.visualViewport.addEventListener('scroll', syncViewport);
  }
})();
</script>
<script src="design/stub/signatures.js"></script>
