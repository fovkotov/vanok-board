<!DOCTYPE html>
<html lang="ru" data-theme="0">
<head>
<meta charset="utf-8">

<title>Сфера SVG — Vanok</title>
<style>
  /* lab.html theme 0: paper ground, blue ink, grotesque. */
  :root {
    color-scheme: light;
    --bg: #E9E9E9;
    --blue: #0A1AE9;
    --grotesk: Arial, "Helvetica Neue", Helvetica, sans-serif;
    --rule: color-mix(in srgb, var(--blue) 35%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html {
    background-color: var(--bg);
    background-image: var(--paper, none);
    background-repeat: repeat;
    background-size: 256px 256px;
    background-attachment: fixed;
  }
  body {
    display: flex;
    background: transparent;
    color: var(--blue);
    font-family: var(--grotesk);
    font-weight: 400;
    font-size: 12px;
    line-height: 1.3;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #stage {
    position: relative;
    container-type: size;
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  #stage.drag { outline: 1px dashed var(--blue); outline-offset: -8px; }
  #stage.flash { box-shadow: inset 0 0 0 2px var(--blue); }
  #viewport {
    width: min(calc(100cqw - 24px), calc(100cqh - 168px));
    height: auto;
    aspect-ratio: 1;
    touch-action: none;
    cursor: grab;
    overflow: visible;
    outline: 1px solid var(--blue);
    outline-offset: 0;
  }
  #viewport:active { cursor: grabbing; }
  #guide {
    stroke: color-mix(in srgb, var(--blue) 45%, transparent);
    stroke-width: 1.5;
    fill: none;
    pointer-events: none;
  }
  #empty {
    font-family: var(--grotesk);
    font-size: 16px;
    font-weight: 400;
    fill: var(--blue);
    text-anchor: middle;
    pointer-events: none;
    user-select: none;
  }

  #presets, #player {
    position: absolute;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: 0;
    background: var(--bg);
    border: 1px solid var(--blue);
  }
  #presets { top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); }
  #player { left: 12px; right: 12px; bottom: 12px; }
  #player button { padding: 4px 8px; }
  #presets button, #player button, aside button, .themes button {
    appearance: none;
    margin: 0;
    font: inherit;
    color: var(--blue);
    background: transparent;
    border: 1px solid var(--blue);
    border-radius: 0;
    padding: 4px 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  #presets button[aria-pressed="true"],
  #player button[aria-pressed="true"],
  .themes button[aria-pressed="true"] {
    background: var(--blue);
    color: var(--bg);
    border-color: var(--blue);
  }
  #copy {
    background: var(--blue);
    color: var(--bg);
    border-color: var(--blue);
    font-weight: 400;
  }
  #phase {
    width: 140px;
    accent-color: var(--blue);
  }
  #phaseLabel {
    min-width: 3.2em;
    color: var(--blue);
    font-variant-numeric: tabular-nums;
  }
  .dirs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

  aside {
    width: 340px;
    height: 100%;
    overflow: auto;
    padding: 12px 14px 28px;
    background: var(--bg);
    color: var(--blue);
    border-left: 1px solid var(--blue);
    scrollbar-color: var(--blue) var(--bg);
  }
  aside h1 { margin: 0 0 4px; font-size: 14px; font-weight: 400; }
  aside .hint { margin: 0 0 12px; color: var(--blue); }
  aside h2 {
    margin: 14px 0 8px;
    padding-top: 8px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--blue);
    font-weight: 400;
  }
  label.field { display: block; margin: 0 0 10px; }
  label.field span { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  label.field b { font-weight: 400; }
  label.field i { font-style: normal; color: var(--blue); font-variant-numeric: tabular-nums; }
  select, input[type="color"], textarea {
    font: inherit;
    color: var(--blue);
    background: var(--bg);
    border: 1px solid var(--blue);
    border-radius: 0;
  }
  select { width: 100%; padding: 4px 8px; }
  textarea::placeholder { color: color-mix(in srgb, var(--blue) 45%, transparent); }
  input[type="range"] { width: 100%; margin-top: 4px; accent-color: var(--blue); }
  input[type="checkbox"] { accent-color: var(--blue); }
  input[type="color"] { width: 100%; height: 24px; padding: 0; cursor: pointer; }
  label.check {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 0 0 8px;
    cursor: pointer;
  }
  .themes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #customBox textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    padding: 8px;
  }
  #customBox .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #customStatus { color: var(--blue); min-height: 1.2em; }
  #toast {
    position: absolute;
    z-index: 3;
    top: 56px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 12px;
    border-radius: 0;
    background: var(--bg);
    border: 1px solid var(--blue);
    color: var(--blue);
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
  @media (max-width: 860px) {
    body { flex-direction: column; }
    aside { width: 100%; height: 46%; border-left: 0; border-top: 1px solid var(--blue); }
    #viewport { width: min(calc(100cqw - 24px), calc(100cqh - 140px), 70vw); height: auto; }
  }
</style>
<script>
(function () {
  var PAPER = 256;
  var canvas = document.createElement('canvas');
  canvas.width = PAPER;
  canvas.height = PAPER;
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  function hash2(ix, iy) {
    var n = Math.imul(ix, 374761393) + Math.imul(iy, 668265263);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function paperNoise(x, y, period) {
    var xi = Math.floor(x);
    var yi = Math.floor(y);
    var xf = x - xi;
    var yf = y - yi;
    var u = xf * xf * (3 - 2 * xf);
    var v = yf * yf * (3 - 2 * yf);
    var wrap = function (i) { return ((i % period) + period) % period; };
    var a = hash2(wrap(xi), wrap(yi));
    var b = hash2(wrap(xi + 1), wrap(yi));
    var c = hash2(wrap(xi), wrap(yi + 1));
    var d = hash2(wrap(xi + 1), wrap(yi + 1));
    return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
  }
  function paintPaper(r, g, b) {
    var img = ctx.createImageData(PAPER, PAPER);
    var data = img.data;
    var period = 4;
    var y, x, i, cloud, fine, delta;
    for (y = 0; y < PAPER; y++) {
      for (x = 0; x < PAPER; x++) {
        cloud = paperNoise((x / PAPER) * period, (y / PAPER) * period, period);
        fine = paperNoise((x / PAPER) * period * 2, (y / PAPER) * period * 2, period);
        delta = (cloud * 0.78 + fine * 0.22 - 0.5) * 4.2;
        i = (y * PAPER + x) * 4;
        data[i] = Math.max(0, Math.min(255, Math.round(r + delta)));
        data[i + 1] = Math.max(0, Math.min(255, Math.round(g + delta)));
        data[i + 2] = Math.max(0, Math.min(255, Math.round(b + delta)));
        data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    var seed = 0x51A7;
    function rnd() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function strokeWrap(x0, y0, x1, y1) {
      var oy, ox;
      for (oy = -1; oy <= 1; oy++) {
        for (ox = -1; ox <= 1; ox++) {
          ctx.beginPath();
          ctx.moveTo(x0 + ox * PAPER, y0 + oy * PAPER);
          ctx.lineTo(x1 + ox * PAPER, y1 + oy * PAPER);
          ctx.stroke();
        }
      }
    }
    ctx.lineCap = 'round';
    var f, s;
    for (f = 0; f < 22; f++) {
      var x0 = rnd() * PAPER;
      var y0 = rnd() * PAPER;
      var len = 22 + rnd() * 64;
      var ang = rnd() > 0.82 ? rnd() * Math.PI : 0.22 + (rnd() - 0.5) * 0.95;
      ctx.lineWidth = 0.55 + rnd() * 0.4;
      ctx.strokeStyle = rnd() > 0.7 ? 'rgba(255,255,255,0.045)' : 'rgba(30,30,30,0.032)';
      strokeWrap(x0, y0, x0 + Math.cos(ang) * len, y0 + Math.sin(ang) * len);
    }
    for (s = 0; s < 32; s++) {
      var sx = rnd() * PAPER;
      var sy = rnd() * PAPER;
      var rad = 0.55 + rnd() * 0.65;
      ctx.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.04)';
      var oy, ox;
      for (oy = -1; oy <= 1; oy++) {
        for (ox = -1; ox <= 1; ox++) {
          ctx.beginPath();
          ctx.arc(sx + ox * PAPER, sy + oy * PAPER, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }
  paintPaper(233, 233, 233);
  document.documentElement.style.setProperty('--paper', 'url("' + canvas.toDataURL('image/png') + '")');
})();
</script>
</head>
<body>
<div id="stage">
  <div id="presets"></div>
  <svg id="viewport" viewBox="-500 -500 1000 1000" xmlns="http://www.w3.org/2000/svg">
    <rect id="bg" x="-500" y="-500" width="1000" height="1000"></rect>
    <circle id="guide" cx="0" cy="0" r="380"></circle>
    <g id="shapes"></g>
    <text id="empty" x="0" y="8" style="display:none">Перетащи SVG сюда</text>
  </svg>
  <div id="player">
    <button id="play" type="button">Пауза</button>
    <input id="phase" type="range" min="0" max="1" step="0.001" value="0" aria-label="Фаза">
    <span id="phaseLabel">0%</span>
    <div class="dirs">
      <button type="button" data-dir="cw">↻ По часовой</button>

      <button type="button" data-dir="pendulum">∿ Маятник</button>

</div>
<aside>
  <h1>Сфера SVG</h1>
  <p class="hint">Тяни холст — крутить. Колесо — радиус, Alt+колесо — натяжение. Пробел — пауза. C — скопировать кадр, в том числе на русской раскладке.</p>
  <div id="panel"></div>
</aside>
<script>
const DEG = Math.PI / 180;
const NS = 'http://www.w3.org/2000/svg';

const PRESETS = {
  petals: {
    count: 7, radius: 380, spread: 0.85, tilt: 0.2, thickness: 0.78,
    bulge: 0.65, poleOffset: 0.24, clipCircle: false, hideBackface: false,
    renderMode: 'fill', strokeWidth: 9, strokeCap: 'round',
    fgColor: '#6f8fb0', bgColor: '#ffffff',
    motionMode: 'orbit', originAngle: -90, rotX: 0, rotY: 0, rotZ: 0,
    axisSpinX: 0, axisSpinY: 1, axisSpinZ: 0.25,
    arcTrim: 1, arcWave: 0, speed: 0.28, direction: 1
  },
  lattice: {
    count: 10, radius: 390, spread: 1, tilt: 0.42, thickness: 0.16,
    bulge: 1.05, poleOffset: -0.02, clipCircle: false, hideBackface: false,
    renderMode: 'fill', strokeWidth: 6, strokeCap: 'round',
    fgColor: '#9b51bf', bgColor: '#ffffff',
    motionMode: 'orbit', originAngle: -90, rotX: 16, rotY: 0, rotZ: 0,
    axisSpinX: 0.15, axisSpinY: 1, axisSpinZ: 0.2,
    arcTrim: 1, arcWave: 0, speed: 0.22, direction: 1
  },
  ribs: {
    count: 11, radius: 400, spread: 0.9, tilt: 0.35, thickness: 0.28,
    bulge: 1.15, poleOffset: -0.08, clipCircle: true, hideBackface: false,
    renderMode: 'stroke', strokeWidth: 8, strokeCap: 'round',
    fgColor: '#ff0015', bgColor: '#000000',
    motionMode: 'orbit', originAngle: -90, rotX: 0, rotY: 0, rotZ: 0,
    axisSpinX: 0, axisSpinY: 1, axisSpinZ: 0.25,
    arcTrim: 1, arcWave: 0.15, speed: 0.2, direction: 1
  },
  meridians: {
    count: 12, radius: 380, spread: 1, tilt: 0.45, thickness: 0.07,
    bulge: 1, poleOffset: 0, clipCircle: false, hideBackface: false,
    renderMode: 'stroke', strokeWidth: 3, strokeCap: 'round',
    fgColor: '#ece8df', bgColor: '#14161a',
    motionMode: 'sphere3d', originAngle: -90, rotX: 18, rotY: 0, rotZ: 0,
    axisSpinX: 0.05, axisSpinY: 1, axisSpinZ: 0.15,
    arcTrim: 1, arcWave: 0, speed: 0.3, direction: 1
  },
  custom: {
    count: 6, radius: 360, spread: 0.9, tilt: 0.4, thickness: 0.2,
    bulge: 1.1, poleOffset: 0, clipCircle: false, hideBackface: false,
    renderMode: 'stroke', strokeWidth: 4, strokeCap: 'round',
    fgColor: '#67c514', bgColor: '#14161a',
    motionMode: 'combo', originAngle: -90, rotX: 14, rotY: 0, rotZ: 0,
    axisSpinX: 0.1, axisSpinY: 1, axisSpinZ: 0.2,
    arcTrim: 1, arcWave: 0, speed: 0.28, direction: 1
  }
};

const state = Object.assign({
  preset: 'petals',
  playing: true,
  phase: 0,
  exportBg: false
}, PRESETS.petals);
state.hideBackface = false;

let currentPaths = [];
let customContours = [];
let scrubbing = false;
let toastTimer = 0;

const EXAMPLES = {
  star: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100"><polygon points="0,-46 12,-16 44,-16 18,4 28,38 0,18 -28,38 -18,4 -44,-16 -12,-16"/></svg>`,
  grid: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100"><path fill="none" stroke="#000" stroke-width="2" d="M-40 -40 H40 M-40 -20 H40 M-40 0 H40 M-40 20 H40 M-40 40 H40 M-40 -40 V40 M-20 -40 V40 M0 -40 V40 M20 -40 V40 M40 -40 V40"/></svg>`,
  vanok: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80"><path fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" d="M8 8 L28 72 L48 8 M18 44 H38 M64 8 L86 40 L108 8 M64 8 V72 M108 8 V72 M128 8 V72 H168 M188 40 a22 22 0 1 0 0.1 0 M236 8 V72 M236 8 H270 L236 40 H270 M236 72 H270"/></svg>`
};

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function wrap01(v) { v %= 1; return v < 0 ? v + 1 : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpPt(a, b, t) {
  return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z || 0, b.z || 0, t) };
}
function fmt(n) {
  const v = Math.round(n * 100) / 100;
  return String(v);
}

function rotate3D(x, y, z, rx, ry, rz) {
  const cx = Math.cos(rx), sx = Math.sin(rx);
  let y1 = y * cx - z * sx;
  let z1 = y * sx + z * cx;
  const cy = Math.cos(ry), sy = Math.sin(ry);
  let x2 = x * cy + z1 * sy;
  let z2 = -x * sy + z1 * cy;
  const cz = Math.cos(rz), sz = Math.sin(rz);
  return { x: x2 * cz - y1 * sz, y: x2 * sz + y1 * cz, z: z2 };
}

function currentEuler() {
  const spinOn = state.motionMode === 'sphere3d' || state.motionMode === 'combo';
  let turns = 0;
  if (spinOn) {
    turns = state.direction === 0
      ? Math.sin(state.phase * Math.PI * 2)
      : state.phase * state.direction;
  }
  const tau = Math.PI * 2 * turns;
  return {
    rx: state.rotX * DEG + tau * state.axisSpinX,
    ry: state.rotY * DEG + tau * state.axisSpinY,
    rz: state.rotZ * DEG + tau * state.axisSpinZ
  };
}

function warpToSphere2D(u, v, R, bulge) {
  if (!R) return { x: u, y: v };
  const nx = u / R;
  const ny = v / R;
  const r = Math.hypot(nx, ny);
  if (r < 1e-8 || bulge <= 0) return { x: u, y: v };
  const theta = Math.atan2(ny, nx);
  const mappedR = r <= 1
    ? Math.sin(r * Math.PI * 0.5)
    : Math.pow(r, 1 / (1 + bulge));
  const w = clamp(bulge, 0, 1.6);
  const finalNorm = Math.max(0, (1 - w) * r + w * mappedR);
  const finalR = R * finalNorm;
  return { x: finalR * Math.cos(theta), y: finalR * Math.sin(theta) };
}

function projectXYZ(x, y, z) {
  const e = currentEuler();
  const p = rotate3D(x, y, z, e.rx, e.ry, e.rz);
  let px = p.x;
  let py = p.y;
  const rho = Math.hypot(px, py);
  if (Math.abs(state.bulge - 1) > 1e-4 && rho > 1e-6) {
    const k = Math.pow(rho, 1 / Math.max(0.25, state.bulge)) / rho;
    px *= k;
    py *= k;
  }
  const R = state.radius;
  return { x: px * R, y: -py * R, z: p.z };
}

function projectSphere(lat, lon) {
  const x = Math.cos(lat) * Math.sin(lon);
  const y = Math.sin(lat);
  const z = Math.cos(lat) * Math.cos(lon);
  return projectXYZ(x, y, z);
}

function projectPlanar(x, y) {
  const R = state.radius;
  const w = warpToSphere2D(x, y, R, state.bulge);
  let X = w.x / R;
  let Y = -w.y / R;
  const r2 = X * X + Y * Y;
  let Z = 0;
  if (r2 <= 1) Z = Math.sqrt(Math.max(0, 1 - r2));
  else {
    const s = 1 / Math.sqrt(r2);
    X *= s;
    Y *= s;
  }
  const e = currentEuler();
  const p = rotate3D(X, Y, Z, e.rx, e.ry, e.rz);
  return { x: p.x * R, y: -p.y * R, z: p.z };
}

function orbitShift() {
  if (state.motionMode === 'sphere3d' || state.motionMode === 'diverge') return 0;
  if (state.direction === 0) return 0.5 * Math.sin(state.phase * Math.PI * 2);
  return state.phase * state.direction;
}

function divergeAmount() {
  let t = 0.5 - 0.5 * Math.cos(state.phase * Math.PI * 2);
  if (state.direction < 0) t = 1 - t;
  if (state.direction === 0) t = 0.5 + 0.5 * Math.sin(state.phase * Math.PI * 2);
  return t;
}

function originLon() {
  return (state.originAngle + 90) * DEG;
}

function n1(n) { return (n).toFixed(1); }

function polyToPath(points, closed, digits) {
  if (!points || points.length < 2) return '';
  const num = digits == null ? n1 : (n) => Number(n).toFixed(digits);
  let d = `M ${num(points[0].x)} ${num(points[0].y)}`;
  for (let i = 1; i < points.length; i++) d += ` L ${num(points[i].x)} ${num(points[i].y)}`;
  if (closed) d += ' Z';
  return d;
}

function pointInside(p) {
  state.hideBackface = false;
  if (state.clipCircle && (p.x * p.x + p.y * p.y) > state.radius * state.radius + 0.01) return false;
  return true;
}

function crossBoundary(a, b) {
  let lo = 0;
  let hi = 1;
  const aIn = pointInside(a);
  for (let n = 0; n < 16; n++) {
    const m = (lo + hi) / 2;
    if (pointInside(lerpPt(a, b, m)) === aIn) lo = m;
    else hi = m;
  }
  return lerpPt(a, b, (lo + hi) / 2);
}

function clipOpen(pts) {
  const segs = [];
  let cur = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const inn = pointInside(p);
    if (i === 0) {
      if (inn) cur.push(p);
      continue;
    }
    const prev = pts[i - 1];
    const prevIn = pointInside(prev);
    if (prevIn && inn) cur.push(p);
    else if (prevIn && !inn) {
      cur.push(crossBoundary(prev, p));
      if (cur.length > 1) segs.push(cur);
      cur = [];
    } else if (!prevIn && inn) {
      cur = [crossBoundary(prev, p), p];
    }
  }
  if (cur.length > 1) segs.push(cur);
  return segs;
}

function insideHalf(p, a, b) {
  return (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x) >= -1e-4;
}

function edgeIntersect(s, e, a, b) {
  const dx = e.x - s.x;
  const dy = e.y - s.y;
  const ax = b.x - a.x;
  const ay = b.y - a.y;
  const den = dx * ay - dy * ax;
  let t = 0;
  if (Math.abs(den) > 1e-8) t = ((a.x - s.x) * ay - (a.y - s.y) * ax) / den;
  t = clamp(t, 0, 1);
  return lerpPt(s, e, t);
}

function clipPolyHalf(poly, keepFn, hitFn) {
  const output = [];
  if (poly.length < 3) return output;
  for (let j = 0; j < poly.length; j++) {
    const s = poly[j];
    const e = poly[(j + 1) % poly.length];
    const sIn = keepFn(s);
    const eIn = keepFn(e);
    if (sIn && eIn) output.push(e);
    else if (sIn && !eIn) output.push(hitFn(s, e));
    else if (!sIn && eIn) {
      output.push(hitFn(s, e));
      output.push(e);
    }
  }
  return output;
}

function clipToFront(pts) {
  state.hideBackface = false;
  return pts;
}

function clipPolyToCircle(poly, R) {
  if (!state.clipCircle) return poly;
  const sides = 72;
  const clip = [];
  for (let i = 0; i < sides; i++) {
    const a = (i / sides) * Math.PI * 2;
    clip.push({ x: Math.cos(a) * R, y: Math.sin(a) * R, z: 1 });
  }
  let output = poly;
  for (let i = 0; i < clip.length; i++) {
    const a = clip[i];
    const b = clip[(i + 1) % clip.length];
    output = clipPolyHalf(output, (p) => insideHalf(p, a, b), (s, e) => edgeIntersect(s, e, a, b));
    if (output.length < 3) return [];
  }
  return output;
}

function finishClosed(pts, digits) {
  let poly = clipToFront(pts);
  poly = clipPolyToCircle(poly, state.radius);
  if (poly.length < 3) return '';
  return polyToPath(poly, true, digits);
}

function finishOpen(pts, digits) {
  return clipOpen(pts).map((seg) => polyToPath(seg, false, digits)).filter(Boolean);
}

function ellipsePoints(cx, cy, rx, ry, rot, samples) {
  const pts = [];
  const co = Math.cos(rot);
  const si = Math.sin(rot);
  const n = samples || 96;
  for (let k = 0; k < n; k++) {
    const a = (k / n) * Math.PI * 2;
    const x = Math.cos(a) * rx;
    const y = Math.sin(a) * ry;
    pts.push(projectPlanar(cx + x * co - y * si, cy + x * si + y * co));
  }
  return pts;
}

function petalU(i, n) {
  if (state.motionMode === 'diverge') {
    const side = i % 2 === 0 ? 1 : -1;
    const rank = Math.floor(i / 2);
    const pairs = Math.max(1, Math.ceil(n / 2));
    return side * ((rank + 0.5) / pairs) * Math.max(divergeAmount(), 0.04);
  }
  if (state.motionMode === 'sphere3d') return n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
  return wrap01((i + 0.5) / n + orbitShift()) * 2 - 1;
}

function buildPetals() {
  const R = state.radius;
  const n = state.count;
  const parts = [];
  const origin = state.originAngle * DEG;
  for (let i = 0; i < n; i++) {
    const u = petalU(i, n);
    const angle = origin + u * state.spread * Math.PI;
    const dist = R * state.poleOffset;
    const cx = Math.cos(angle) * dist;
    const cy = Math.sin(angle) * dist;
    const radius = R * state.thickness * state.arcTrim;
    const aspect = 1 - 0.18 * Math.min(1, Math.abs(u));
    const wave = 1 + state.arcWave * Math.sin((i / n + state.phase) * Math.PI * 2) * 0.18;
    const pts = ellipsePoints(cx, cy, radius * wave, radius * aspect * wave, angle * state.tilt, 96);
    const d = finishClosed(pts);
    if (d) parts.push(d);
  }
  return parts;
}

function buildLattice() {
  const n = Math.max(2, state.count);
  const parts = [];
  const shift = orbitShift() * Math.PI * 2;
  const grow = state.motionMode === 'diverge' ? Math.max(0.06, divergeAmount()) : 1;
  const inset = clamp(1 - state.thickness * 0.55, 0.2, 0.98) * state.arcTrim;
  const dLon = (Math.PI * 2 * state.spread) / n;
  const dLat = Math.PI / n;
  const shear = Math.sin(state.tilt);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (((i + j) & 1) !== 0) continue;
      const side = (i + 0.5) / n - 0.5;
      let lonC = originLon() + (i + 0.5) * dLon;
      let latC = -Math.PI / 2 + (j + 0.5) * dLat + state.poleOffset;
      if (state.motionMode === 'diverge') {
        lonC = originLon() + side * grow * Math.PI * 2 * state.spread;
        latC = (latC - state.poleOffset) * (0.28 + 0.72 * grow) + state.poleOffset;
      } else if (state.motionMode !== 'sphere3d') lonC += shift;
      lonC += Math.sin(j * 0.65 + state.phase * Math.PI * 2) * state.arcWave * dLon * 0.45;
      const hLon = dLon * 0.5 * inset;
      const hLat = dLat * 0.5 * inset;
      const corners = [
        [latC + hLat, lonC + shear * hLat],
        [latC + shear * hLon * 0.25, lonC + hLon],
        [latC - hLat, lonC - shear * hLat],
        [latC - shear * hLon * 0.25, lonC - hLon]
      ];
      const pts = [];
      const steps = 6;
      for (let e = 0; e < 4; e++) {
        const a = corners[e];
        const b = corners[(e + 1) % 4];
        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          pts.push(projectSphere(clamp(lerp(a[0], b[0], t), -1.52, 1.52), lerp(a[1], b[1], t)));
        }
      }
      const d = finishClosed(pts);
      if (d) parts.push(d);
    }
  }
  return parts;
}

function buildRibs() {
  const parts = [];
  const oLon = originLon();
  const slide = orbitShift();
  const grow = state.motionMode === 'diverge' ? 0.12 + 0.88 * divergeAmount() : 1;
  const stemN = 72;
  for (const off of [-1, 0, 1]) {
    const pts = [];
    for (let k = 0; k <= stemN; k++) {
      const t = k / stemN;
      const lat = lerp(1.42, -1.48, t) + state.poleOffset;
      const open = off * (0.012 + t * 0.055) * (0.45 + state.thickness);
      const lon = oLon + open + Math.sin(lat * 1.4) * 0.02;
      pts.push(projectSphere(lat, lon));
    }
    parts.push(...finishOpen(pts));
  }

  const n = state.count;
  for (let i = 0; i < n; i++) {
    for (const side of [-1, 1]) {
      let attach;
      if (state.motionMode === 'diverge') attach = (i / Math.max(1, n - 1)) * grow;
      else if (state.motionMode === 'sphere3d') attach = i / Math.max(1, n - 1);
      else attach = wrap01(i / n + slide);
      const wave = 0.78 + 0.22 * Math.sin((i * state.arcWave + state.phase) * Math.PI * 2);
      const lat0 = lerp(1.28, -0.2, attach) + state.poleOffset;
      const len = state.arcTrim * wave * (state.motionMode === 'diverge' ? grow : 1);
      const pts = [];
      const steps = 36;
      for (let k = 0; k <= steps; k++) {
        const s = (k / steps) * len;
        const lat = lat0 * (1 - s * 0.9) - side * state.tilt * s * 0.35;
        const lon = oLon + side * Math.pow(s, 0.8) * state.spread * Math.PI * 0.58;
        pts.push(projectSphere(lat, lon));
      }
      parts.push(...finishOpen(pts));
    }
  }

  const crossN = Math.max(3, Math.round(n * 0.45));
  for (let i = 0; i < crossN; i++) {
    for (const side of [-1, 1]) {
      let attach;
      if (state.motionMode === 'diverge') attach = ((i + 0.5) / crossN) * grow;
      else if (state.motionMode === 'sphere3d') attach = (i + 0.5) / crossN;
      else attach = wrap01((i + 0.5) / crossN + slide * 0.65);
      const latBase = lerp(0.95, -1.15, attach) + state.poleOffset;
      const reach = state.arcTrim * (state.motionMode === 'diverge' ? grow : 1);
      const pts = [];
      const steps = 40;
      for (let k = 0; k <= steps; k++) {
        const s = ((k / steps) * 2 - 1) * reach;
        const lon = oLon + s * state.spread * Math.PI * 0.5;
        const lat = latBase + side * state.tilt * s * 0.95;
        pts.push(projectSphere(lat, lon));
      }
      parts.push(...finishOpen(pts));
    }
  }
  return parts;
}

function buildMeridians() {
  const parts = [];
  const n = state.count;
  const parallels = Math.max(3, Math.round(n * 0.6));
  const shift = orbitShift();
  const grow = state.motionMode === 'diverge' ? divergeAmount() : 1;
  const width = state.thickness * 0.35;

  for (let i = 0; i < n; i++) {
    const side = i < n / 2 ? -1 : 1;
    const rank = side < 0 ? (n / 2 - i) / Math.max(1, n / 2) : (i - n / 2) / Math.max(1, n / 2);
    let lon;
    if (state.motionMode === 'diverge') lon = originLon() + side * rank * grow * Math.PI * state.spread;
    else lon = originLon() + (i / n) * Math.PI * 2 * state.spread + shift * Math.PI * 2;
    const wave = state.arcWave * Math.sin((i / n + state.phase) * Math.PI * 2) * 0.25;
    const lat0 = -Math.PI / 2 * state.arcTrim;
    const lat1 = Math.PI / 2 * state.arcTrim;
    if (state.renderMode === 'fill') {
      const pts = [];
      const steps = 64;
      for (let k = 0; k <= steps; k++) {
        const lat = lerp(lat0, lat1, k / steps) + state.poleOffset + wave;
        pts.push(projectSphere(lat, lon - width));
      }
      for (let k = steps; k >= 0; k--) {
        const lat = lerp(lat0, lat1, k / steps) + state.poleOffset + wave;
        pts.push(projectSphere(lat, lon + width));
      }
      const d = finishClosed(pts);
      if (d) parts.push(d);
    } else {
      const pts = [];
      const steps = 72;
      for (let k = 0; k <= steps; k++) {
        const lat = lerp(lat0, lat1, k / steps) + state.poleOffset + wave;
        pts.push(projectSphere(lat, lon));
      }
      parts.push(...finishOpen(pts));
    }
  }

  for (let j = 0; j < parallels; j++) {
    const t = (j + 1) / (parallels + 1);
    let lat = (0.5 - t) * Math.PI * state.arcTrim + state.poleOffset;
    if (state.motionMode === 'orbit' || state.motionMode === 'combo') lat += shift * 0.35;
    if (state.motionMode === 'diverge') lat += (grow - 0.5) * state.spread * 0.6;
    if (state.renderMode === 'fill') {
      const pts = [];
      const steps = 80;
      const band = width * Math.cos(lat);
      for (let k = 0; k <= steps; k++) {
        const lon = originLon() + (k / steps) * Math.PI * 2;
        pts.push(projectSphere(lat - band, lon));
      }
      for (let k = steps; k >= 0; k--) {
        const lon = originLon() + (k / steps) * Math.PI * 2;
        pts.push(projectSphere(lat + band, lon));
      }
      const d = finishClosed(pts);
      if (d) parts.push(d);
    } else {
      const pts = [];
      const steps = 90;
      for (let k = 0; k <= steps; k++) {
        const lon = originLon() + (k / steps) * Math.PI * 2 * (state.motionMode === 'diverge' ? Math.max(grow, 0.05) : 1);
        pts.push(projectSphere(lat, lon));
      }
      parts.push(...finishOpen(pts));
    }
  }
  return parts;
}

function chordDeviation(p, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  if (len2 < 1e-12) return Math.hypot(p.x - a.x, p.y - a.y);
  const cross = (p.x - a.x) * dy - (p.y - a.y) * dx;
  return Math.abs(cross) / Math.sqrt(len2);
}

function customWarpPoint(p, patch, lonOff) {
  const lon = p.x * patch * Math.PI + lonOff;
  const lat = -p.y * patch * Math.PI * 0.5 + state.poleOffset * 0.35;
  const wave = state.arcWave * Math.sin(p.x * 3 + state.phase * Math.PI * 2) * 0.08;
  return projectSphere(lat + wave, lon);
}

function densifyCustomWarp(srcPts, project, closed) {
  const flatTol = 0.25;
  const maxDepth = 12;
  const longSrc = 0.02;
  const maxPoints = 20000;
  if (!srcPts || !srcPts.length) return [];
  if (srcPts.length === 1) return [project(srcPts[0])];
  const out = [];
  function walk(a, b, wa, wb, depth) {
    const srcLen = Math.hypot(b.x - a.x, b.y - a.y);
    if (depth >= maxDepth || out.length >= maxPoints) {
      out.push(wb);
      return;
    }
    const mid = { x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 };
    const wm = project(mid);
    if (chordDeviation(wm, wa, wb) > flatTol || srcLen > longSrc) {
      walk(a, mid, wa, wm, depth + 1);
      walk(mid, b, wm, wb, depth + 1);
    } else out.push(wb);
  }
  let prev = srcPts[0];
  let prevW = project(prev);
  out.push(prevW);
  for (let i = 1; i < srcPts.length; i++) {
    const next = srcPts[i];
    const nextW = project(next);
    walk(prev, next, prevW, nextW, 0);
    prev = next;
    prevW = nextW;
  }
  if (closed && srcPts.length > 2) {
    const start = srcPts[0];
    const gap = Math.hypot(prev.x - start.x, prev.y - start.y);
    if (gap > 1e-4) walk(prev, start, prevW, out[0], 0);
  }
  return out;
}

function buildCustom() {
  if (!customContours.length) return [];
  const copies = Math.max(1, state.count);
  const parts = [];
  const shift = orbitShift();
  const grow = state.motionMode === 'diverge' ? Math.max(0.08, divergeAmount()) : 1;
  const patch = Math.min(1.25, state.spread) * (copies === 1 ? 0.85 : 0.36);
  for (let c = 0; c < copies; c++) {
    const side = c % 2 === 0 ? -1 : 1;
    const rank = Math.floor(c / 2) / Math.max(1, copies / 2);
    let lonOff = originLon();
    if (state.motionMode === 'diverge') lonOff += side * (rank + 0.2) * grow * Math.PI * state.spread;
    else if (copies === 1) {
      if (state.motionMode !== 'sphere3d') lonOff += shift * Math.PI * 2;
    } else {
      const spin = state.motionMode === 'sphere3d' ? 0 : shift;
      lonOff += ((c + spin * copies) / copies) * Math.PI * 2;
    }
    customContours.forEach((contour) => {
      const pts = densifyCustomWarp(contour.pts, (p) => customWarpPoint(p, patch, lonOff), contour.closed);
      if (contour.closed) {
        const d = finishClosed(pts, 2);
        if (d) parts.push(d);
      } else parts.push(...finishOpen(pts, 2));
    });
  }
  return parts;
}

function generate() {
  if (state.preset === 'petals') return buildPetals();
  if (state.preset === 'lattice') return buildLattice();
  if (state.preset === 'ribs') return buildRibs();
  if (state.preset === 'meridians') return buildMeridians();
  return buildCustom();
}

function paintPath(path, d) {
  path.setAttribute('d', d);
  if (state.renderMode === 'stroke') {
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', state.fgColor);
    path.setAttribute('stroke-width', String(state.strokeWidth));
    path.setAttribute('stroke-linecap', state.strokeCap);
    path.setAttribute('stroke-linejoin', 'round');
    path.removeAttribute('fill-rule');
  } else {
    path.setAttribute('fill', state.fgColor);
    path.setAttribute('fill-rule', 'nonzero');
    path.setAttribute('stroke', 'none');
    path.removeAttribute('stroke-width');
    path.removeAttribute('stroke-linecap');
    path.removeAttribute('stroke-linejoin');
  }
}

function displayedPaths() {
  const subs = currentPaths.filter(Boolean);
  if (state.renderMode === 'stroke') return subs.length ? [subs.join(' ')] : [];
  return subs;
}

function render() {
  currentPaths = generate();
  const items = displayedPaths();
  const host = document.getElementById('shapes');
  while (host.children.length > items.length) host.removeChild(host.lastElementChild);
  for (let i = 0; i < items.length; i++) {
    let path = host.children[i];
    if (!path) {
      path = document.createElementNS(NS, 'path');
      host.appendChild(path);
    }
    paintPath(path, items[i]);
  }
  document.getElementById('bg').setAttribute('fill', state.bgColor);
  document.getElementById('guide').setAttribute('r', String(state.radius));
  document.getElementById('stage').style.background = state.bgColor;
  const empty = document.getElementById('empty');
  empty.style.display = state.preset === 'custom' && !items.length ? '' : 'none';
  empty.setAttribute('fill', state.bgColor === '#000000' || state.bgColor === '#14161a' ? '#9b968c' : '#6d6a64');
}

function buildExportString() {
  const bg = state.exportBg
    ? `\n  <rect x="-500" y="-500" width="1000" height="1000" fill="${state.bgColor}"/>`
    : '';
  const paths = displayedPaths().map((d) => (
    state.renderMode === 'stroke'
      ? `\n  <path d="${d}" fill="none" stroke="${state.fgColor}" stroke-width="${state.strokeWidth}" stroke-linecap="${state.strokeCap}" stroke-linejoin="round"/>`
      : `\n  <path d="${d}" fill="${state.fgColor}" fill-rule="nonzero"/>`
  )).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 -500 1000 1000" width="1000" height="1000">${bg}${paths}\n</svg>\n`;
}

function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

async function copyCurrentSvgToClipboard() {
  render();
  const svg = buildExportString();
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(svg);
      ok = true;
    }
  } catch (err) {
    ok = false;
  }
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = svg;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
  }
  toast(ok
    ? `SVG скопирован в буфер (кадр ${(state.phase * 100).toFixed(0)}%)`
    : 'Не удалось скопировать');
  const stage = document.getElementById('stage');
  stage.classList.add('flash');
  setTimeout(() => stage.classList.remove('flash'), 280);
}

function downloadSvg() {
  render();
  const blob = new Blob([buildExportString()], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sphere-${state.preset}-${Math.round(state.phase * 100)}.svg`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function pathTokens(d) {
  return String(d || '').match(/[MmLlHhVvCcSsQqTtAaZz]|[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g) || [];
}

function countPathPoints(d) {
  const tokens = pathTokens(d);
  const arity = { M: 2, L: 2, H: 1, V: 1, C: 6, S: 4, Q: 4, T: 2, A: 7 };
  const per = { M: 1, L: 1, H: 1, V: 1, C: 3, S: 2, Q: 2, T: 1, A: 1 };
  let cmd = '';
  let count = 0;
  for (let i = 0; i < tokens.length;) {
    if (/^[A-Za-z]$/.test(tokens[i])) {
      cmd = tokens[i];
      i += 1;
    }
    if (!cmd || cmd === 'Z' || cmd === 'z') {
      if (cmd === 'Z' || cmd === 'z') cmd = '';
      else if (!cmd) i += 1;
      continue;
    }
    const upper = cmd.toUpperCase();
    const n = arity[upper] || 0;
    if (!n || i + n > tokens.length) break;
    i += n;
    count += per[upper] || 1;
    if (upper === 'M') cmd = cmd === 'M' ? 'L' : 'l';
  }
  return count;
}

function sourcePointCount(el) {
  const tag = el.localName;
  if (tag === 'polygon' || tag === 'polyline') {
    const nums = (el.getAttribute('points') || '').match(/[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g);
    return nums ? Math.floor(nums.length / 2) : 0;
  }
  if (tag === 'line') return 2;
  if (tag === 'path') return countPathPoints(el.getAttribute('d') || '');
  return 0;
}

function needsDenseSample(el) {
  const tag = el.localName;
  if (tag === 'circle' || tag === 'ellipse' || tag === 'rect') return true;
  return tag === 'path' && /[CcQqAaSsTt]/.test(el.getAttribute('d') || '');
}

function contourSampleCount(el, len) {
  const source = sourcePointCount(el);
  const stepped = Math.ceil(len / 0.35);
  if (!needsDenseSample(el)) return Math.max(source, stepped, 1);
  return Math.max(source, 8, stepped);
}

function splitAbsoluteSubpaths(d) {
  function pathNum(n) {
    return String(Math.round(n * 1e6) / 1e6);
  }
  const tokens = pathTokens(d);
  const arity = { M: 2, L: 2, H: 1, V: 1, C: 6, S: 4, Q: 4, T: 2, A: 7 };
  let i = 0;
  let cx = 0;
  let cy = 0;
  let sx = 0;
  let sy = 0;
  let cmd = '';
  const subs = [];
  let current = null;
  while (i < tokens.length) {
    if (/^[A-Za-z]$/.test(tokens[i])) {
      cmd = tokens[i];
      i += 1;
    }
    if (!cmd) {
      i += 1;
      continue;
    }
    if (cmd === 'Z' || cmd === 'z') {
      if (current) current.push('Z');
      cx = sx;
      cy = sy;
      cmd = '';
      continue;
    }
    const upper = cmd.toUpperCase();
    const rel = cmd !== upper;
    const n = arity[upper] || 0;
    if (!n || i + n > tokens.length) break;
    const raw = tokens.slice(i, i + n);
    const v = raw.map((num) => parseFloat(num));
    i += n;
    if (upper === 'M') {
      const x = rel ? cx + v[0] : v[0];
      const y = rel ? cy + v[1] : v[1];
      cx = x;
      cy = y;
      sx = x;
      sy = y;
      current = [rel ? `M ${pathNum(x)} ${pathNum(y)}` : `M ${raw[0]} ${raw[1]}`];
      subs.push(current);
      cmd = rel ? 'l' : 'L';
      continue;
    }
    if (!current) {
      current = [];
      subs.push(current);
    }
    if (upper === 'H') cx = rel ? cx + v[0] : v[0];
    else if (upper === 'V') cy = rel ? cy + v[0] : v[0];
    else if (upper === 'L' || upper === 'T') {
      cx = rel ? cx + v[0] : v[0];
      cy = rel ? cy + v[1] : v[1];
    } else if (upper === 'C') {
      cx = rel ? cx + v[4] : v[4];
      cy = rel ? cy + v[5] : v[5];
    } else if (upper === 'S' || upper === 'Q') {
      cx = rel ? cx + v[v.length - 2] : v[v.length - 2];
      cy = rel ? cy + v[v.length - 1] : v[v.length - 1];
    } else if (upper === 'A') {
      cx = rel ? cx + v[5] : v[5];
      cy = rel ? cy + v[6] : v[6];
    }
    current.push(`${cmd} ${raw.join(' ')}`);
  }
  return subs.map((parts) => parts.join(' ')).filter(Boolean);
}

function loadSvgText(text) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  if (doc.querySelector('parsererror')) throw new Error('SVG не разобрался');
  const src = doc.documentElement;
  if (!src || src.tagName.toLowerCase() !== 'svg') throw new Error('Это не SVG');
  const host = document.createElementNS(NS, 'svg');
  host.setAttribute('xmlns', NS);
  host.style.position = 'fixed';
  host.style.left = '-12000px';
  host.style.top = '0';
  host.style.overflow = 'hidden';
  host.style.pointerEvents = 'none';
  const vb = src.getAttribute('viewBox');
  if (vb) host.setAttribute('viewBox', vb);
  host.setAttribute('width', src.getAttribute('width') || '1000');
  host.setAttribute('height', src.getAttribute('height') || '1000');
  Array.from(src.childNodes).forEach((node) => host.appendChild(document.importNode(node, true)));
  document.body.appendChild(host);

  const els = host.querySelectorAll('path, circle, ellipse, rect, polygon, polyline, line');
  const raw = [];
  const all = [];
  try {
    els.forEach((el) => {
      if (el.closest('defs, clipPath, mask, symbol, marker')) return;
      const tag = el.localName;
      const dAttr = (el.getAttribute('d') || '').trim();
      const kindClosed = tag === 'circle' || tag === 'ellipse' || tag === 'rect' || tag === 'polygon' || /z\s*$/i.test(dAttr);
      const clones = [];
      let targets = [el];
      if (tag === 'path') {
        const subs = splitAbsoluteSubpaths(dAttr);
        const drawn = subs.filter((part) => /[LlHhVvCcSsQqTtAaZz]/.test(part));
        if (drawn.length > 1) {
          const parent = el.parentNode || host;
          const made = [];
          let sum = 0;
          subs.forEach((part) => {
            const clone = el.cloneNode(false);
            clone.removeAttribute('id');
            clone.removeAttribute('pathLength');
            clone.setAttribute('d', part);
            parent.appendChild(clone);
            clones.push(clone);
            let partLen = 0;
            try { partLen = clone.getTotalLength(); } catch (err) { partLen = 0; }
            if (partLen && isFinite(partLen)) {
              sum += partLen;
              made.push(clone);
            }
          });
          let whole = 0;
          try { whole = el.getTotalLength(); } catch (err) { whole = 0; }
          const tol = Math.max(0.75, whole * 0.001);
          if (made.length === drawn.length && whole && Math.abs(sum - whole) <= tol) targets = made;
        }
      }
      targets.forEach((target) => {
        let len = 0;
        try { len = target.getTotalLength(); } catch (err) { return; }
        if (!len || !isFinite(len)) return;
        const samples = contourSampleCount(target, len);
        const ctm = target.getCTM();
        const local = [];
        for (let k = 0; k <= samples; k++) {
          const p = target.getPointAtLength((k / samples) * len);
          let x = p.x;
          let y = p.y;
          if (ctm) {
            const pt = host.createSVGPoint();
            pt.x = p.x;
            pt.y = p.y;
            const mapped = pt.matrixTransform(ctm);
            x = mapped.x;
            y = mapped.y;
          }
          local.push({ x, y });
        }
        const gaps = [];
        for (let i = 1; i < local.length; i++) gaps.push(Math.hypot(local[i].x - local[i - 1].x, local[i].y - local[i - 1].y));
        gaps.sort((a, b) => a - b);
        const median = gaps[Math.floor(gaps.length / 2)] || 1;
        const groups = [];
        let current = [local[0]];
        for (let i = 1; i < local.length; i++) {
          const dist = Math.hypot(local[i].x - local[i - 1].x, local[i].y - local[i - 1].y);
          if (dist > median * 8 && current.length > 1) {
            groups.push(current);
            current = [local[i]];
          } else current.push(local[i]);
        }
        if (current.length > 1) groups.push(current);
        groups.forEach((group) => {
          const near = Math.hypot(group[0].x - group[group.length - 1].x, group[0].y - group[group.length - 1].y) < median * 4;
          raw.push({ pts: group, closed: kindClosed && near });
          group.forEach((p) => all.push(p));
        });
      });
      clones.forEach((clone) => clone.remove());
    });
  } finally {
    host.remove();
  }
  if (!all.length) throw new Error('В SVG нет контуров');
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  all.forEach((p) => {
    minX = Math.min(minX, p.x);
    minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x);
    maxY = Math.max(maxY, p.y);
  });
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const maxDim = Math.max(maxX - minX, maxY - minY) / 2 || 1;
  customContours = raw.map((contour) => ({
    closed: contour.closed,
    pts: contour.pts.map((p) => ({ x: (p.x - cx) / maxDim, y: (p.y - cy) / maxDim }))
  }));
  const status = document.getElementById('customStatus');
  if (status) status.textContent = `Контуров: ${customContours.length}`;
}

const PRESET_BUTTONS = [
  ['petals', 'Лепестки'],
  ['lattice', 'Ромбы'],
  ['ribs', 'Рёбра'],
  ['meridians', 'Глобус'],
  ['custom', 'Свой SVG']
];

const FIELDS = [
  { section: 'Анимация и вращение' },
  { key: 'motionMode', type: 'select', label: 'Режим', options: [
    ['orbit', 'Орбита по кругу'],
    ['diverge', 'Расхождение из точки'],
    ['sphere3d', '3D-вращение сферы'],
    ['combo', 'Комбо']
  ]},
  { key: 'speed', type: 'range', min: -2, max: 2, step: 0.01, label: 'Скорость' },
  { key: 'originAngle', type: 'range', min: -180, max: 180, step: 1, label: 'Точка старта' },
  { key: 'rotX', type: 'range', min: -90, max: 90, step: 1, label: 'Наклон X' },
  { key: 'rotY', type: 'range', min: -180, max: 180, step: 1, label: 'Поворот Y' },
  { key: 'rotZ', type: 'range', min: -180, max: 180, step: 1, label: 'Крен Z' },
  { key: 'axisSpinX', type: 'range', min: -1, max: 1, step: 0.01, label: 'Вклад оси X' },
  { key: 'axisSpinY', type: 'range', min: -1, max: 1, step: 0.01, label: 'Вклад оси Y' },
  { key: 'axisSpinZ', type: 'range', min: -1, max: 1, step: 0.01, label: 'Вклад оси Z' },
  { key: 'arcTrim', type: 'range', min: 0.05, max: 1, step: 0.01, label: 'Длина дуг' },
  { key: 'arcWave', type: 'range', min: 0, max: 1, step: 0.01, label: 'Волна дуг' },
  { section: 'Геометрия сферы' },
  { key: 'count', type: 'range', min: 1, max: 36, step: 1, label: 'Количество' },
  { key: 'radius', type: 'range', min: 100, max: 460, step: 1, label: 'Радиус' },
  { key: 'bulge', type: 'range', min: 0, max: 2.5, step: 0.01, label: 'Натяжение' },
  { key: 'spread', type: 'range', min: 0.05, max: 2, step: 0.01, label: 'Размах' },
  { key: 'tilt', type: 'range', min: -1.57, max: 1.57, step: 0.01, label: 'Наклон' },
  { key: 'thickness', type: 'range', min: 0.02, max: 1.2, step: 0.01, label: 'Толщина' },
  { key: 'poleOffset', type: 'range', min: -0.9, max: 0.9, step: 0.01, label: 'Смещение полюса' },
  { key: 'clipCircle', type: 'check', label: 'Обрезать по кругу' },
  { section: 'Стиль и экспорт' },
  { key: 'renderMode', type: 'select', label: 'Режим отрисовки', options: [
    ['fill', 'Заливка'],
    ['stroke', 'Линии stroke']
  ]},
  { key: 'strokeWidth', type: 'range', min: 1, max: 40, step: 0.5, label: 'Толщина линии' },
  { key: 'strokeCap', type: 'select', label: 'Концы линий', options: [
    ['round', 'Скруглённые'],
    ['butt', 'Плоские'],
    ['square', 'Квадратные']
  ]},
  { key: 'fgColor', type: 'color', label: 'Цвет фигуры' },
  { key: 'bgColor', type: 'color', label: 'Цвет фона' },
  { key: 'exportBg', type: 'check', label: 'Копировать вместе с фоном' }
];

const THEMES = [
  ['Синий', '#6f8fb0', '#ffffff'],
  ['Фиолетовый', '#9b51bf', '#ffffff'],
  ['Красный', '#ff0015', '#000000'],
  ['Зелёный', '#67c514', '#14161a'],
  ['Белый', '#ffffff', '#0a0a0a']
];

function controlEl(key) {
  return document.querySelector(`[data-key="${key}"]`);
}

function syncControl(key) {
  const el = controlEl(key);
  if (!el) return;
  if (el.type === 'checkbox') el.checked = !!state[key];
  else el.value = state[key];
  const out = document.querySelector(`[data-out="${key}"]`);
  if (out) out.textContent = fmt(Number(state[key]));
}

function syncAllControls() {
  FIELDS.forEach((field) => { if (field.key) syncControl(field.key); });
  syncPlay();
  syncDirs();
  syncPhase();
  document.querySelectorAll('#presets button').forEach((btn) => {
    btn.setAttribute('aria-pressed', btn.dataset.preset === state.preset ? 'true' : 'false');
  });
  const box = document.getElementById('customBox');
  if (box) box.hidden = state.preset !== 'custom';
}

function syncPlay() {
  const btn = document.getElementById('play');
  btn.textContent = state.playing ? 'Пауза' : 'Играть';
  btn.setAttribute('aria-pressed', state.playing ? 'true' : 'false');
}

function syncPhase() {
  const phase = document.getElementById('phase');
  if (!scrubbing) phase.value = String(state.phase);
  document.getElementById('phaseLabel').textContent = `${Math.round(state.phase * 100)}%`;
}

function syncDirs() {
  document.querySelectorAll('[data-dir]').forEach((btn) => {
    let on = false;
    if (btn.dataset.dir === 'diverge') on = state.motionMode === 'diverge';
    else if (btn.dataset.dir === 'pendulum') on = state.direction === 0 && state.motionMode !== 'diverge';
    else if (btn.dataset.dir === 'cw') on = state.direction === 1 && state.motionMode !== 'diverge';
    else if (btn.dataset.dir === 'ccw') on = state.direction === -1 && state.motionMode !== 'diverge';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function applyPreset(name) {
  Object.assign(state, PRESETS[name]);
  state.hideBackface = false;
  state.preset = name;
  state.phase = 0;
  syncAllControls();
  render();
}

function bindUi() {
  const presets = document.getElementById('presets');
  PRESET_BUTTONS.forEach(([id, label]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.preset = id;
    btn.textContent = label;
    btn.addEventListener('click', () => applyPreset(id));
    presets.appendChild(btn);
  });

  const panel = document.getElementById('panel');
  const custom = document.createElement('div');
  custom.id = 'customBox';
  custom.innerHTML = `
    <h2>Источник и свой SVG</h2>
    <div class="row">
      <button type="button" id="pickSvg">Загрузить SVG</button>
      <button type="button" id="exStar">Звезда</button>
      <button type="button" id="exGrid">Сетка</button>
      <button type="button" id="exVanok">Текст Vanök</button>
    </div>
    <input id="file" type="file" accept="image/svg+xml,.svg" hidden>
    <textarea id="svgCode" placeholder="Вставь SVG-код"></textarea>
    <div class="row"><button type="button" id="applyCode">Натянуть код</button></div>
    <div id="customStatus"></div>`;
  panel.appendChild(custom);

  FIELDS.forEach((field) => {
    if (field.section) {
      const h = document.createElement('h2');
      h.textContent = field.section;
      panel.appendChild(h);
      if (field.section === 'Стиль и экспорт') {
        const themes = document.createElement('div');
        themes.className = 'themes';
        THEMES.forEach(([name, fg, bg]) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = name;
          b.addEventListener('click', () => {
            state.fgColor = fg;
            state.bgColor = bg;
            syncControl('fgColor');
            syncControl('bgColor');
            render();
          });
          themes.appendChild(b);
        });
        panel.appendChild(themes);
      }
      return;
    }
    if (field.type === 'check') {
      const label = document.createElement('label');
      label.className = 'check';
      label.innerHTML = `<input data-key="${field.key}" type="checkbox"> ${field.label}`;
      panel.appendChild(label);
      return;
    }
    const label = document.createElement('label');
    label.className = 'field';
    const head = document.createElement('span');
    head.innerHTML = `<b>${field.label}</b>${field.type === 'range' ? `<i data-out="${field.key}"></i>` : ''}`;
    label.appendChild(head);
    let input;
    if (field.type === 'select') {
      input = document.createElement('select');
      field.options.forEach(([value, text]) => {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = text;
        input.appendChild(opt);
      });
    } else if (field.type === 'color') {
      input = document.createElement('input');
      input.type = 'color';
    } else {
      input = document.createElement('input');
      input.type = 'range';
      input.min = field.min;
      input.max = field.max;
      input.step = field.step;
    }
    input.dataset.key = field.key;
    label.appendChild(input);
    panel.appendChild(label);
  });

  panel.addEventListener('input', (e) => {
    const key = e.target.dataset && e.target.dataset.key;
    if (!key) return;
    if (e.target.type === 'checkbox') state[key] = e.target.checked;
    else if (e.target.type === 'range') state[key] = Number(e.target.value);
    else state[key] = e.target.value;
    if (key === 'count') state.count = Math.round(state.count);
    syncControl(key);
    if (key === 'motionMode') syncDirs();
    render();
  });

  document.getElementById('play').addEventListener('click', () => {
    state.playing = !state.playing;
    syncPlay();
  });
  const phase = document.getElementById('phase');
  phase.addEventListener('pointerdown', () => { scrubbing = true; });
  phase.addEventListener('input', () => {
    state.phase = Number(phase.value);
    syncPhase();
    render();
  });
  window.addEventListener('pointerup', () => { scrubbing = false; });
  document.querySelectorAll('[data-dir]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const dir = btn.dataset.dir;
      if (dir === 'cw') {
        state.direction = 1;
        if (state.motionMode === 'diverge') state.motionMode = 'orbit';
      } else if (dir === 'ccw') {
        state.direction = -1;
        if (state.motionMode === 'diverge') state.motionMode = 'orbit';
      } else if (dir === 'diverge') state.motionMode = 'diverge';
      else if (dir === 'pendulum') {
        state.direction = 0;
        if (state.motionMode === 'diverge') state.motionMode = 'orbit';
      }
      syncControl('motionMode');
      syncDirs();
    });
  });
  document.getElementById('copy').addEventListener('click', copyCurrentSvgToClipboard);
  document.getElementById('save').addEventListener('click', downloadSvg);

  document.getElementById('pickSvg').addEventListener('click', () => document.getElementById('file').click());
  document.getElementById('file').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    readSvgFile(file);
    e.target.value = '';
  });
  document.getElementById('applyCode').addEventListener('click', () => {
    try {
      loadSvgText(document.getElementById('svgCode').value);
      if (state.preset !== 'custom') applyPreset('custom');
      else render();
      toast('SVG натянут на сферу');
    } catch (err) {
      toast(err.message || 'Ошибка SVG');
    }
  });
  document.getElementById('exStar').addEventListener('click', () => useExample(EXAMPLES.star));
  document.getElementById('exGrid').addEventListener('click', () => useExample(EXAMPLES.grid));
  document.getElementById('exVanok').addEventListener('click', () => useExample(EXAMPLES.vanok));

  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drag'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('drag');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) readSvgFile(file);
  });

  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    state.rotY = ((state.rotY + dx * 0.35 + 540) % 360) - 180;
    state.rotX = clamp(state.rotX + dy * 0.28, -90, 90);
    syncControl('rotY');
    syncControl('rotX');
    render();
  });
  viewport.addEventListener('pointerup', () => { dragging = false; });
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = Math.sign(e.deltaY);
    if (e.altKey) state.bulge = clamp(state.bulge - delta * 0.04, 0, 2.5);
    else state.radius = clamp(state.radius - delta * 8, 100, 460);
    syncControl('bulge');
    syncControl('radius');
    render();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      state.playing = !state.playing;
      syncPlay();
      return;
    }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
      e.preventDefault();
      state.phase = wrap01(state.phase + (e.code === 'ArrowRight' ? 0.01 : -0.01));
      syncPhase();
      render();
      return;
    }
    if (e.code === 'KeyC') {
      const sel = String(window.getSelection ? window.getSelection() : '');
      if ((e.metaKey || e.ctrlKey) && sel) return;
      e.preventDefault();
      copyCurrentSvgToClipboard();
    }
  });
}

function readSvgFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      loadSvgText(String(reader.result));
      document.getElementById('svgCode').value = String(reader.result).slice(0, 20000);
      if (state.preset !== 'custom') applyPreset('custom');
      else render();
      toast('SVG натянут на сферу');
    } catch (err) {
      toast(err.message || 'Ошибка SVG');
    }
  };
  reader.readAsText(file);
}

function useExample(svg) {
  try {
    loadSvgText(svg);
    document.getElementById('svgCode').value = svg;
    if (state.preset !== 'custom') applyPreset('custom');
    else {
      syncAllControls();
      render();
    }
    toast('Пример натянут на сферу');
  } catch (err) {
    toast(err.message || 'Ошибка SVG');
  }
}

bindUi();
syncAllControls();
render();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state.playing) {
    state.phase = wrap01(state.phase + dt * state.speed * 0.25);
    syncPhase();
    render();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
